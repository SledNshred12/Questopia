function renderThumbs(){
  if(!HAS3D || !avatarGroup) return;
  avatarGroup.visible = false;
  document.querySelectorAll("canvas[data-thumb]").forEach(cv=>{
    const owner = cv.dataset.owner ? playerByCode(cv.dataset.owner) : null; // a friend's Locker draws on the friend's avatar
    const look = owner ? Object.assign({}, DEFAULT_LOOK, owner.look) : getLook();
    const gear = owner ? Object.assign({}, DEFAULT_GEAR, owner.gear) : getGear();
    const g = buildHuman(look, Object.assign({}, gear, { [cv.dataset.slot]: cv.dataset.id }));
    g.rotation.y = .35; scene.add(g);
    R.render(scene, cams[cv.dataset.cam] || camFull);
    const ctx = cv.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(R.domElement,0,0,cv.width,cv.height);
    scene.remove(g); disposeGroup(g);
  });
  avatarGroup.visible = true;
}

/* ---------- Activities: GPS walks and hikes ----------
   Location is only read while an Activity is running. It is kept in this device's own storage, never inside
   `state`, so it is never saved online and never shown to friends. No map tiles are loaded: the route is drawn here. */
const GPS_QUESTS = {   // quests that have to be done with an Activity. mi = minimum distance, fast = top speed in m/s that still counts
  d2:{mi:.25}, d7:{mi:.3, fast:12}, d11:{mi:.5}, d14:{mi:.25}, w4:{mi:.5}, w11:{mi:.4}, s4:{mi:1.2}
};
const MI = 1609.344, MAX_ACC = 40, MAX_WALK = 6;     // metres per mile, worst GPS accuracy we trust (m), top walking/running speed (m/s)
const WALKS_KEY = "questopia-walks-v1", LIVE_KEY = "questopia-live-v1";
function readJSON(k, dflt){ try{ const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? dflt : v; }catch(e){ return dflt; } }
let walks = readJSON(WALKS_KEY, []);
walks = Array.isArray(walks) ? walks.filter(w=>w && typeof w.id==="string" && Array.isArray(w.path) && Number.isFinite(w.start)) : [];
let live = readJSON(LIVE_KEY, null);
if(!live || typeof live !== "object" || !Array.isArray(live.pts) || !Number.isFinite(live.start)) live = null;
else live.status = "paused"; // after a reload nothing is tracking until the player opens it again
let inActivity = false, actPage = "live", confirmDiscard = false, actResult = null;
let inWalks = false, walksPage = "list", viewWalkId = null, confirmDelete = null, lastResult = null;
let watchId = null, wakeLock = null;

function saveWalks(){
  try{ localStorage.setItem(WALKS_KEY, JSON.stringify(walks)); }
  catch(e){ if(walks.length > 4){ walks.length = Math.floor(walks.length/2); saveWalks(); } }
}
function saveLive(){ try{ live ? localStorage.setItem(LIVE_KEY, JSON.stringify(live)) : localStorage.removeItem(LIVE_KEY); }catch(e){} }

const rad = d => d*Math.PI/180;
function haversine(a, b){
  const R = 6371000, dLat = rad(b[0]-a[0]), dLon = rad(b[1]-a[1]);
  const s = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(s)));
}
const fmtMi = m => { const mi = m/MI; return (mi < 10 ? mi.toFixed(2) : mi.toFixed(1)) + " mi"; };
const fmtDur = ms => { const t = Math.max(0, Math.round(ms/1000)), h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
function fmtPace(m, ms){
  if(m < 80 || ms <= 0) return "--";
  const s = Math.round(ms/1000/(m/MI));
  return s > 5999 ? "--" : `${Math.floor(s/60)}:${pad(s%60)}`;
}
const fmtHM = ms => { const m = Math.round(ms/60000); return m >= 60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}m`; };
function compactPath(pts, max){
  if(pts.length <= max) return pts.slice();
  const out = [];
  for(let i=0; i<max; i++) out.push(pts[Math.round(i*(pts.length-1)/(max-1))]);
  return out;
}

/* Every GPS reading goes through these checks before it counts */
function onFix(pos){
  if(!live || !pos || !pos.coords) return;
  const c = pos.coords, acc = c.accuracy == null ? 999 : c.accuracy, t = pos.timestamp || Date.now();
  live.acc = Math.round(acc);
  if(!Number.isFinite(c.latitude) || !Number.isFinite(c.longitude)){ return; }
  if(acc > MAX_ACC){ live.status = "weak"; paintLive(); return; }
  live.status = "good";
  const p = [+c.latitude.toFixed(6), +c.longitude.toFixed(6), t], last = live.last;
  if(!last){ live.last = p; live.pts.push([p[0], p[1]]); live.fixes = 1; saveLive(); paintLive(); return; }
  const dt = (t - last[2])/1000;
  if(dt < 1.5){ paintLive(); return; }
  const d = haversine(last, p), v = d/dt;
  const g = live.quest && GPS_QUESTS[live.quest.id], cap = (g && g.fast) || MAX_WALK;
  if(d < Math.max(7, Math.min(acc, 25)*.6)){ paintLive(); return; } // standing still or GPS wobble: nothing counted
  const take = () => { live.dist += d; live.last = p; live.pts.push([p[0], p[1]]); live.fixes = (live.fixes||0) + 1; };
  if(dt > 60){ // the screen was off or the signal was lost for a while
    if(dt <= 600 && v <= 2.5) take();
    else { live.gaps = (live.gaps||0) + 1; live.gapM = (live.gapM||0) + d; live.last = p; live.pts.push([p[0], p[1]]); }
  } else if(v > cap){ // faster than anyone walks (or bikes, for the bike quest): a car or bus
    live.fastM = (live.fastM||0) + d; live.last = p; live.pts.push([p[0], p[1]]);
  } else take();
  if(live.pts.length > 3000) live.pts = compactPath(live.pts, 1500);
  saveLive(); paintLive();
}
function onGeoError(e){
  if(!live) return;
  live.status = e && e.code===1 ? "denied" : "nosignal";
  paintLive();
}
function startWatch(){
  if(!live) return;
  stopWatch();
  if(!("geolocation" in navigator)){ live.status = "unsupported"; return; }
  if(live.status !== "good") live.status = "wait";
  watchId = navigator.geolocation.watchPosition(onFix, onGeoError, { enableHighAccuracy:true, maximumAge:0, timeout:30000 });
  getWake();
}
function stopWatch(){
  if(watchId != null){ try{ navigator.geolocation.clearWatch(watchId); }catch(e){} watchId = null; }
  releaseWake();
}
async function getWake(){
  try{
    if("wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
    }
  }catch(e){}
}
function releaseWake(){ try{ if(wakeLock) wakeLock.release(); }catch(e){} wakeLock = null; }
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && live && watchId != null) getWake(); });

function beginActivity(quest, startAt){
  live = { id: Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36),
    quest: quest ? { kind:quest.kind, id:quest.id } : null,
    start: startAt || Date.now(), pts:[], dist:0, fixes:0, fastM:0, gapM:0, gaps:0, last:null, status:"wait", goal:false };
  saveLive();
  inActivity = true; inWalks = false; actPage = "live"; confirmDiscard = false;
  startWatch(); render(); window.scrollTo(0,0);
}
function startGpsQuest(kind, id){
  if(!("geolocation" in navigator)){ toast("This browser can't share GPS."); return; }
  if(live){ toast("You already have an Activity running."); openActivity(); return; }
  if(!startQuest(kind, id)) return;
  beginActivity({ kind, id }, state.active && state.active.start);
}
function startFreeWalk(){
  if(!("geolocation" in navigator)){ toast("This browser can't share GPS."); return; }
  if(live){ openActivity(); return; }
  beginActivity(null);
}
function openActivity(){
  if(!live){
    const a = runningQuest();
    if(a && GPS_QUESTS[a.id]){ beginActivity({ kind:a.kind, id:a.id }, a.start); return; }
    return;
  }
  inActivity = true; inWalks = false; actPage = "live"; confirmDiscard = false;
  if(watchId == null) startWatch();
  render(); window.scrollTo(0,0);
}
function discardLive(){
  stopWatch(); live = null; saveLive();
  inActivity = false; actPage = "live"; confirmDiscard = false; actResult = null;
}

/* What Finish checks. A quest walk needs the quest's time AND its distance, at a speed people can actually walk. */
function verifyActivity(a){
  const el = Date.now() - a.start, d = a.dist, why = [];
  const q = a.quest && activeFor(a.quest.kind, a.quest.id) ? a.quest : null, g = q && GPS_QUESTS[q.id];
  const fastM = a.fastM || 0, gapM = a.gapM || 0;
  if(g){
    const needMs = minsFor(q.id)*60000, needM = g.mi*MI;
    if(el < needMs) why.push({ k:"time", ms:needMs - el });
    if(d < needM) why.push({ k:"dist", m:needM - d });
  } else if(d < 50) why.push({ k:"short" });
  if(fastM > 150 && fastM > .2*(d + fastM)) why.push({ k:"fast" });
  if(g && gapM > 250 && gapM > .5*d) why.push({ k:"gap" });
  return { ok:!why.length, why, credit:!!g, quest:q };
}
// Gives the quest its points. Same payout as ticking it off by hand, but only a finished Activity can call it.
function awardGpsQuest(kind, id){
  const before = state.points, q = qInfo(kind, id);
  state.active = null;
  if(kind==="season"){
    state.season.last = Object.assign(state.season.last || {}, { [id]: dayKey() });
    bumpSeason(id, 1);
  } else if(q && !state[kind].done.includes(id)){
    state[kind].done.push(id);
    const amt = payFor(q.pts);
    state.paid[payKey(kind, id)] = amt;
    addPoints(amt);
    if(kind==="daily") bumpSeason("s6", 1);
  }
  save();
  return Math.max(0, state.points - before);
}
function finishActivity(){
  if(!live) return;
  stopWatch();
  live.ended = Date.now();
  const v = verifyActivity(live);
  if(v.ok){ concludeActivity(v, true); return; }
  actResult = v; actPage = "check"; saveLive(); render(); window.scrollTo(0,0);
}
function concludeActivity(v, credit){
  if(!live) return;
  const q = live.quest;
  let pts = 0;
  if(credit && v.credit && v.quest) pts = awardGpsQuest(v.quest.kind, v.quest.id);
  const w = { id: live.id, start: live.start, end: live.ended || Date.now(), dist: Math.round(live.dist),
    path: compactPath(live.pts, 300), quest: q ? { kind:q.kind, id:q.id } : null, credited: !!(credit && v.credit && v.quest), pts };
  walks.unshift(w); if(walks.length > 60) walks.length = 60;
  saveWalks();
  stopWatch(); live = null; saveLive();
  inActivity = false; inWalks = true; walksPage = "result"; viewWalkId = w.id; actPage = "live"; actResult = null; confirmDiscard = false;
  if(pts) toast(`+${pts} points`);
  render(); window.scrollTo(0,0);
}
function resumeActivity(){
  if(!live) return;
  live.ended = null; actPage = "live"; actResult = null;
  startWatch(); render();
}

/* ---------- Drawing a route ----------
   "Simple" draws the path on a plain background and loads nothing from the internet.
   "Street" and "Satellite" (opt-in) also load small map pictures from OpenStreetMap or Esri. Those services can see which
   area is on screen (and the phone's IP address). They never receive the route itself. Saved-walk thumbnails stay Simple. */
const MAP_KEY = "questopia-map-v1";
const MAP_MODES = { simple:"Simple", street:"Street", sat:"Satellite" };
let mapMode = readJSON(MAP_KEY, "simple");
if(!MAP_MODES[mapMode]) mapMode = "simple";
const TILE_URL = {
  street:(z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
  sat:(z,x,y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`
};
const TILE_MAXZ = { street:19, sat:18 };
const MAP_CREDIT = { street:"© OpenStreetMap contributors", sat:"Esri, Maxar, Earthstar Geographics" };
const tiles = new Map();   // "mode/z/x/y" -> { img, state:"loading" | "ok" | "err" }, oldest first
let tileRedraw = 0;
function scheduleRedraw(){
  if(tileRedraw) return;
  tileRedraw = requestAnimationFrame(()=>{ tileRedraw = 0; if(inActivity || inWalks) paintRoutes(); });
}
function getTile(mode, z, x, y){
  const key = `${mode}/${z}/${x}/${y}`;
  let t = tiles.get(key);
  if(t){ tiles.delete(key); tiles.set(key, t); return t; }
  const img = new Image();
  t = { img, state:"loading" };
  tiles.set(key, t);
  img.onload = () => { t.state = "ok"; scheduleRedraw(); };
  img.onerror = () => { t.state = "err"; scheduleRedraw(); };
  img.referrerPolicy = "strict-origin-when-cross-origin";
  img.src = TILE_URL[mode](z, x, y);
  if(tiles.size > 300) tiles.delete(tiles.keys().next().value);
  return t;
}
function setMapMode(m){
  if(!MAP_MODES[m]) return;
  mapMode = m;
  try{ localStorage.setItem(MAP_KEY, JSON.stringify(m)); }catch(e){}
  tiles.forEach((t, k)=>{ if(t.state === "err") tiles.delete(k); }); // switching styles gives failed pictures another try
}
function mapToggleHtml(){
  const credit = mapMode === "street"
    ? `Map pictures from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>.`
    : `Map pictures from Esri, Maxar and Earthstar Geographics.`;
  return `<div class="seg" role="group" aria-label="Map style">${Object.keys(MAP_MODES).map(k=>
      `<button class="seg-btn" data-act="map-mode" data-mode="${k}" aria-pressed="${mapMode===k}">${MAP_MODES[k]}</button>`).join("")}</div>
    ${mapMode !== "simple" ? `<p class="fine map-credit">${credit} They can see the area you're looking at, but never your exact route.</p>` : ""}`;
}

function drawRoute(cv, pts, opt){
  opt = opt || {};
  const mode = opt.mini ? "simple" : mapMode, onMap = mode !== "simple";
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth || 320, h = cv.clientHeight || 240;
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const x = cv.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);
  const bg = x.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, "#DDF0FA"); bg.addColorStop(1, "#EAF3DE");
  x.fillStyle = bg; x.fillRect(0, 0, w, h);
  const pill = (txt, px0, py0, align, size) => { // small readable label on top of a picture
    x.font = `700 ${size || 12}px system-ui,sans-serif`;
    const tw = x.measureText(txt).width + 12, bx = align === "right" ? px0 - tw : align === "center" ? px0 - tw/2 : px0;
    x.fillStyle = "rgba(255,255,255,.88)"; x.beginPath();
    if(x.roundRect) x.roundRect(bx, py0 - 16, tw, 22, 8); else x.rect(bx, py0 - 16, tw, 22);
    x.fill();
    x.fillStyle = "#1F2A22"; x.textAlign = "left"; x.fillText(txt, bx + 6, py0);
  };
  if(!onMap){
    x.strokeStyle = "rgba(46,94,62,.09)"; x.lineWidth = 1;
    for(let gx = 0; gx < w; gx += 32){ x.beginPath(); x.moveTo(gx+.5, 0); x.lineTo(gx+.5, h); x.stroke(); }
    for(let gy = 0; gy < h; gy += 32){ x.beginPath(); x.moveTo(0, gy+.5); x.lineTo(w, gy+.5); x.stroke(); }
  }
  if(!pts || !pts.length){
    x.fillStyle = "#5D6B60"; x.font = "600 15px system-ui,sans-serif"; x.textAlign = "center";
    x.fillText(opt.empty || "Waiting for GPS...", w/2, h/2);
    return;
  }
  // Web Mercator, so the route lines up with the map pictures. World units run 0..1 across the whole map.
  const wx = lon => (lon + 180)/360;
  const wy = lat => { const s = Math.sin(rad(Math.max(-85, Math.min(85, lat)))); return .5 - Math.log((1+s)/(1-s))/(4*Math.PI); };
  const Pw = pts.map(p=>[wx(p[1]), wy(p[0])]);
  const lat0 = pts.reduce((s,p)=>s+p[0], 0)/pts.length, mPerW = 40075017*Math.cos(rad(lat0)); // metres per world unit here
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  Pw.forEach(q=>{ minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); });
  const pad2 = opt.pad == null ? 26 : opt.pad, minSpan = (opt.mini ? 50 : 70)/mPerW; // never zoom closer than about 70 m
  const spanX = Math.max(maxX-minX, minSpan), spanY = Math.max(maxY-minY, minSpan);
  const sc = Math.min((w-2*pad2)/spanX, (h-2*pad2)/spanY);   // CSS pixels per world unit
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const px = q => w/2 + (q[0]-cx)*sc, py = q => h/2 + (q[1]-cy)*sc;

  let mapNote = null;
  if(onMap){
    const z = Math.max(2, Math.min(TILE_MAXZ[mode], Math.round(Math.log2(sc*dpr/256)))), n = 2**z, tileCss = sc/n;
    const x0 = cx - (w/2)/sc, x1 = cx + (w/2)/sc, y0 = cy - (h/2)/sc, y1 = cy + (h/2)/sc;
    const tx0 = Math.floor(x0*n), tx1 = Math.floor(x1*n), ty0 = Math.max(0, Math.floor(y0*n)), ty1 = Math.min(n-1, Math.floor(y1*n));
    let okc = 0, failed = 0, loading = 0;
    if((tx1-tx0+1)*(ty1-ty0+1) <= 48){
      for(let ty = ty0; ty <= ty1; ty++) for(let tx = tx0; tx <= tx1; tx++){
        const t = getTile(mode, z, ((tx % n) + n) % n, ty);
        if(t.state === "ok"){ x.drawImage(t.img, w/2 + (tx/n - cx)*sc, h/2 + (ty/n - cy)*sc, tileCss + .6, tileCss + .6); okc++; }
        else if(t.state === "err") failed++; else loading++;
      }
    }
    if(!okc && failed) mapNote = ["Map pictures couldn't load. Check your connection.", w/2, 28, "center"];
    else if(!okc && loading) mapNote = ["Loading map...", 10, 24, "left"];
  }

  x.lineJoin = "round"; x.lineCap = "round";
  const trace = () => { x.beginPath(); Pw.forEach((q,i)=>{ i ? x.lineTo(px(q), py(q)) : x.moveTo(px(q), py(q)); }); };
  if(Pw.length > 1){
    trace(); x.strokeStyle = "rgba(255,255,255,.95)"; x.lineWidth = opt.mini ? 6 : 9; x.stroke();
    trace(); x.strokeStyle = onMap ? "#FF6A00" : "#2E5E3E"; x.lineWidth = opt.mini ? 3 : 5; x.stroke();
  }
  const dot = (q, fill, r) => {
    x.beginPath(); x.arc(px(q), py(q), r+3, 0, 7); x.fillStyle = "#fff"; x.fill();
    x.beginPath(); x.arc(px(q), py(q), r, 0, 7); x.fillStyle = fill; x.fill();
  };
  const r = opt.mini ? 4 : 8;
  dot(Pw[0], "#3E8E5A", r);
  if(opt.live) dot(Pw[Pw.length-1], "#F5B82E", r);
  else if(Pw.length > 1) dot(Pw[Pw.length-1], "#E8446B", r);

  if(mapNote) pill(mapNote[0], mapNote[1], mapNote[2], mapNote[3], 12); // drawn last so the route can't cover it
  if(!opt.mini){ // scale bar, and the map credit when a map picture is showing
    const mPerPx = mPerW/sc, opts = [[30.48,"100 ft"],[76.2,"250 ft"],[152.4,"500 ft"],[160.9,"0.1 mi"],[402.3,"0.25 mi"],[804.7,"0.5 mi"],[1609.3,"1 mi"],[3218.7,"2 mi"],[8046.7,"5 mi"]];
    let best = opts[0];
    for(const o of opts){ if(o[0]/mPerPx <= w*.3) best = o; }
    const len = best[0]/mPerPx;
    if(onMap){ x.fillStyle = "rgba(255,255,255,.88)"; x.fillRect(8, h-36, len + 12, 28); }
    x.strokeStyle = "#1F2A22"; x.lineWidth = 3; x.beginPath(); x.moveTo(14, h-14); x.lineTo(14+len, h-14); x.stroke();
    x.fillStyle = "#1F2A22"; x.font = "700 12px system-ui,sans-serif"; x.textAlign = "left"; x.fillText(best[1], 14, h-20);
    if(onMap) pill(MAP_CREDIT[mode], w-6, h-6, "right", 10);
  }
}

function paintRoutes(){
  document.querySelectorAll("canvas[data-route]").forEach(cv=>{
    const id = cv.dataset.route;
    if(id === "live"){ if(live) drawRoute(cv, live.pts, { live:true }); return; }
    if(id === "check"){ if(live) drawRoute(cv, live.pts, {}); return; }
    const w = walks.find(x=>x.id===id);
    if(w) drawRoute(cv, w.path, { mini:cv.dataset.mini==="1", pad:cv.dataset.mini==="1" ? 8 : 26, empty:"No GPS points saved" });
  });
}

const GPS_STATUS = {
  wait:"Looking for GPS...", good:"GPS locked", weak:"Weak GPS signal", nosignal:"No GPS signal yet",
  denied:"Location is blocked", unsupported:"GPS isn't available", paused:"Paused. Tap Resume"
};
function statusText(a){
  const s = GPS_STATUS[a.status] || GPS_STATUS.wait;
  return (a.status==="good" || a.status==="weak") && a.acc ? `${s} · within ${a.acc} m` : s;
}
// Refreshes the numbers on the Activity screen without redrawing the whole page
function updateActivityUI(){
  document.querySelectorAll("[data-live-time]").forEach(el=>{ if(live) el.textContent = fmtDur(Date.now() - live.start); });
  if(!inActivity || !live || actPage !== "live") return;
  const el = Date.now() - live.start, set = (id, v) => { const n = document.getElementById(id); if(n) n.textContent = v; };
  set("actTime", fmtDur(el)); set("actDist", fmtMi(live.dist)); set("actPace", fmtPace(live.dist, el));
  const st = document.getElementById("actStatus");
  if(st){ st.textContent = statusText(live); st.dataset.s = live.status; }
  const q = live.quest && activeFor(live.quest.kind, live.quest.id), g = q && GPS_QUESTS[q.id];
  if(g){
    const needMs = minsFor(q.id)*60000, needM = g.mi*MI;
    set("actTimeTxt", `${fmtDur(Math.min(el, needMs))} of ${fmtDur(needMs)}`);
    set("actDistTxt", `${fmtMi(Math.min(live.dist, needM))} of ${fmtMi(needM)}`);
    const tb = document.getElementById("actTimeBar"), db = document.getElementById("actDistBar");
    if(tb) tb.style.width = Math.min(100, el/needMs*100) + "%";
    if(db) db.style.width = Math.min(100, live.dist/needM*100) + "%";
    if(el >= needMs && live.dist >= needM && !live.goal){ live.goal = true; saveLive(); toast("Goal reached! Tap Finish."); }
  }
}
function paintLive(){
  if(inActivity && actPage === "live"){ updateActivityUI(); paintRoutes(); }
}
setInterval(updateActivityUI, 1000);

function activityView(){
  if(!live){ inActivity = false; return mainView(); }
  const q = live.quest ? qInfo(live.quest.kind, live.quest.id) : null, g = q && GPS_QUESTS[q.id] && activeFor(live.quest.kind, live.quest.id) ? GPS_QUESTS[q.id] : null;
  if(actPage === "check") return activityCheckView(q);
  const el = Date.now() - live.start, needMs = g ? minsFor(q.id)*60000 : 0, needM = g ? g.mi*MI : 0;
  const paused = live.status === "paused";
  return `
  <section class="activity">
    <div class="locker-top"><button class="backlink" data-act="close-activity">‹ Quests</button><h2>Activity</h2></div>
    <p class="act-title">${q ? esc(q.title) : "Free walk"}</p>
    <span class="gps-chip" id="actStatus" data-s="${live.status}">${esc(statusText(live))}</span>
    ${live.status==="denied" ? `<p class="err" role="alert">Questopia needs your location to count this walk. Allow location for this site in your browser settings, then tap Resume.</p>` : ""}
    ${mapToggleHtml()}

async function addFriendByCode(raw){
  const code = raw.trim().toUpperCase().replace(/\s+/g,"");
  const err = document.getElementById("fErr"), input = document.getElementById("fcode");
  const fail = m => { err.textContent = m; input.setAttribute("aria-invalid","true"); return false; };
  err.textContent = ""; input.removeAttribute("aria-invalid");
  if(!code) return fail("Type a friend code first.");
  if(code === state.friendCode) return fail("That's your own code.");
  if(TEST_MODE){
    if(state.friends.includes(code)) return fail("You're already friends.");
    const p = samplePlayer(code);
    if(!p) return fail("Try TEST-RQ02 to test adding by code.");
    state.requests = state.requests.filter(c=>c!==code);
    state.friends.push(code); save(); render();
    toast(`${p.name} is now your friend`);
    return true;
  }
  if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) return fail("Friend codes look like ABCD-1234.");
  if(!cloud.session) return fail("Sign in first to add friends.");
  const btn = document.querySelector("#addForm button"); if(btn) btn.disabled = true;
  try{
    if(!state.syncedAt) await pushCloud();   // your own code has to be saved online before others can find you
    let j = null;
    for(let i=0; i<3; i++){
      j = await rpc("social_request", { friend_code:code });
      if(!(j && j.error==="no_profile")) break;
      await pushCloud(); await new Promise(r=>setTimeout(r,1200));
    }
    if(!j || j.ok === false) return fail(FRIEND_ERRORS[j && j.error] || "That didn't work. Try again.");
    input.value = "";
    await refreshSocial();
    toast(j.result==="accepted" ? "You're now friends!" : "Friend request sent");
    return true;
  }catch(e){ return fail(e.status===404 ? "Friends aren't set up on the server yet." : "Couldn't reach the server. Try again."); }
  finally{ const b2 = document.querySelector("#addForm button"); if(b2) b2.disabled = false; }
}

/* ---------- Challenges ---------- */
/* Most points earned before the end date wins. 1st gets the reward, 2nd half, 3rd a third, nobody else.
   Earning 0 points means no reward. Ties share a place. Test players earn points on a simple timer until real accounts exist. */
const MAX_DAYS = 30;
let draft = null, viewChallenge = null;
function endTs(ch){ const [y,m,d] = ch.end.split("-").map(Number); return new Date(y,m-1,d,23,59,59).getTime(); }
function prizeFor(place, reward){ return place===1 ? reward : place===2 ? Math.floor(reward/2) : place===3 ? Math.floor(reward/3) : 0; }
function ordinal(n){ return n===1 ? "1st" : n===2 ? "2nd" : n===3 ? "3rd" : n+"th"; }
function theirScore(code, ch, at){
  const days = Math.max(0, (Math.min(at, endTs(ch)) - ch.created) / 864e5);
  return Math.floor(days * (15 + hash(code) % 35));
}
function standings(ch, at){
  if(ch.done && ch.results) return ch.results;
  at = at || Date.now();
  const rows = [{ code:"me", name:"You", score:Math.max(0, state.earnedTotal - ch.startTotal) }]
    .concat(ch.players.map(p=>({ code:p.code, name:p.name, score:theirScore(p.code, ch, at) })));
  rows.sort((a,b)=>b.score - a.score);
  rows.forEach((r,i)=>{
    r.place = i>0 && r.score===rows[i-1].score ? rows[i-1].place : i+1;
    r.prize = r.score>0 ? prizeFor(r.place, ch.reward) : 0;
  });
  return rows;
}
// Settles any challenge whose end date has passed. Returns true if one finished.
function finishChallenges(){
  const now = Date.now(); let msg = null;
  (state.challenges||[]).forEach(ch=>{
    if(ch.done || now <= endTs(ch)) return;
    const rows = standings(ch, endTs(ch));
    const me = rows.find(r=>r.code==="me");
    ch.results = rows; ch.done = true;
    if(me.prize > 0) state.points += me.prize; // prizes are not "earned" points, so they can't feed later challenges
    msg = me.prize>0 ? `Challenge over! You placed ${ordinal(me.place)}: +${me.prize} points` : "Challenge over. No reward this time.";
  });
  if(msg){ save(); toast(msg); return true; }
  return false;
}
const fmtDay = str => { const [y,m,d] = str.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
const prizeLine = r => `1st ${prizeFor(1,r)} · 2nd ${prizeFor(2,r)} · 3rd ${prizeFor(3,r)}`;

function challengeRow(ch){
  const rows = standings(ch), me = rows.find(r=>r.code==="me");
  const names = ch.players.map(p=>esc(p.name)).join(", ");
  const sub = ch.done
    ? `Finished · you placed ${ordinal(me.place)}${me.prize ? ` · +${me.prize} pts` : ""}`
    : `Ends ${fmtDay(ch.end)} · you're ${ordinal(me.place)} with ${me.score} pts`;
  return `<li><button class="fbtn" data-act="view-challenge" data-id="${ch.id}">
    <span class="f-txt"><b>vs ${names}</b><span>${sub}</span></span>
    <span class="chev" aria-hidden="true" style="font-size:24px">›</span></button></li>`;
}

function startChallenge(){
  const err = document.getElementById("cErr");
  const fail = m => { err.textContent = m; return false; };
  const picks = [...document.querySelectorAll('input[name="pl"]:checked')].map(i=>i.value);
  if(!picks.length) return fail("Pick at least one friend.");
  const end = document.getElementById("cEnd").value;
  const lo = dayKey(new Date(Date.now()+864e5)), hi = dayKey(new Date(Date.now()+MAX_DAYS*864e5));
  if(!/^\d{4}-\d{2}-\d{2}$/.test(end)) return fail("Pick an end date.");
  if(end < lo) return fail("The end date has to be tomorrow or later.");
  if(end > hi) return fail(`Challenges can last up to ${MAX_DAYS} days.`);
  const reward = Math.max(0, Math.min(500, Math.round((+document.getElementById("rwd").value||0)/10)*10));
  const ch = { id:"c"+Date.now(), created:Date.now(), end, reward, startTotal:state.earnedTotal,
    players: picks.map(c=>{ const p = samplePlayer(c); return { code:c, name:p?p.name:c }; }), done:false };
  state.challenges.unshift(ch); save();
  viewChallenge = ch.id; friendsPage = "challenge"; render(); window.scrollTo(0,0);
  toast("Challenge started!");
  return true;
}

/* ---------- Scavenger Hunts (friends only) ----------
   A player posts a photo of something nearby plus a short hint. Only their accepted friends can see it.
   A friend finds it and sends back a photo. The poster sees that reply and taps Right or Wrong.
   Photos are shrunk and re-saved as small JPEGs on the phone, which also removes any hidden GPS data.
   No map position is ever collected: the hint is just text. */
let inHunts = false, huntPage = "list", huntTab = "find", huntId = null;
let hunts = { mine:[], others:[], loaded:false, busy:false, error:"", sig:"" };
const huntPhotos = new Map();         // "hunt:ID" / "reply:ID" -> full photo (data URL), loaded when needed
let huntDraft = { photo:null, thumb:null, hint:"", agree:false, busy:false, err:"" };
let huntBusy = false, huntNote = "", confirmHuntDelete = false, huntReported = new Set();
const HUNT_PTS = 15, HUNT_OWNER_PTS = 5;
const HUNT_ERRORS = {
  no_profile:"Your account is still saving. Try again in a moment.", bad_hint:"Write a short hint (1 to 80 letters).",
  bad_photo:"That photo didn't work. Try taking it again.", too_many:"You have 10 hunts posted. Delete one to post a new one.",
  slow_down:"You can post 5 hunts a day. Try again tomorrow.", not_found:"That hunt isn't there anymore.",
  waiting:"Your last photo is still waiting for an answer.", already_solved:"You already found this one!",
  too_many_tries:"You used all 5 tries on this hunt."
};
function huntSignedIn(){ return !!(ONLINE && cloud.session); }
function pendingToJudge(){ return (hunts.mine||[]).reduce((n,h)=>n + h.replies.filter(r=>!r.verdict).length, 0); }
const jpegOk = s => typeof s==="string" && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s) && s.length < 260000;
function cleanReply(r){ return { id:Number(r.id)||0, thumb:jpegOk(r.thumb)?r.thumb:"", verdict:r.verdict==="right"||r.verdict==="wrong"?r.verdict:null,
  created:String(r.created||""), name:safeName(r.name) }; }
function cleanHunt(h){ return { id:Number(h.id)||0, hint:String(h.hint||"").slice(0,80), thumb:jpegOk(h.thumb)?h.thumb:"", created:String(h.created||""),
  name:safeName(h.name), replies:(Array.isArray(h.replies)?h.replies:[]).map(cleanReply).filter(r=>r.id) }; }

async function refreshHunts(){
  if(!huntSignedIn() || hunts.busy || cloud.conflict) return;
  hunts.busy = true;
  try{
    const j = await rpc("hunt_list");
    const mine = (j.mine||[]).map(cleanHunt).filter(h=>h.id), others = (j.others||[]).map(cleanHunt).filter(h=>h.id);
    const sig = JSON.stringify([mine, others]), changed = !hunts.loaded || sig !== hunts.sig || hunts.error;
    Object.assign(hunts, { mine, others, loaded:true, error:"", sig });
    claimHuntPoints();
    if(changed) softRender();
  }catch(e){
    hunts.error = e.status===404 ? "Hunts aren't set up on the server yet." : "Couldn't reach the hunts right now.";
    softRender();
  }
  hunts.busy = false;
}
// Points for a Right answer are given once per reply, and remembered so they can't be given twice.
function claimHuntPoints(){
  if(!Array.isArray(state.huntClaimed)) state.huntClaimed = [];
  let gain = 0;
  hunts.others.forEach(h=>h.replies.forEach(r=>{
    if(r.verdict==="right" && !state.huntClaimed.includes(r.id)){ state.huntClaimed.push(r.id); gain += HUNT_PTS; }
  }));
  if(gain){ state.huntClaimed = state.huntClaimed.slice(-300); addPoints(gain); save(); toast(`You found it! +${gain} points`); }
}
async function fetchHuntPhoto(kind, id){
  const key = kind+":"+id;
  if(huntPhotos.has(key)) return;
  huntPhotos.set(key, "");                         // "" = loading
  try{
    const j = await rpc("hunt_photo", { kind, item_id:id });
    huntPhotos.set(key, j && j.ok && jpegOk(j.photo) ? j.photo : "x");
  }catch(e){ huntPhotos.delete(key); return; }
  if(inHunts) softRender();
}
const huntPhotoUrl = (kind, id) => { const v = huntPhotos.get(kind+":"+id); return v && v!=="x" ? v : ""; };

// Make a small, clean JPEG from the photo the player picked
function loadImage(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}
function jpegFrom(img, maxSide, q){
  const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth*s)), h = Math.max(1, Math.round(img.naturalHeight*s));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,w,h); x.drawImage(img, 0, 0, w, h);
  return c.toDataURL("image/jpeg", q);
}
async function makePhotos(file){
  if(!file || !/^image\//.test(file.type||"image/")) throw new Error("not an image");
  const img = await loadImage(file);
  let photo = "", q = .74;
  for(let i=0;i<4;i++){ photo = jpegFrom(img, 960, q); if(photo.length < 230000) break; q -= .12; }
  const thumb = jpegFrom(img, 200, .6);
  if(!jpegOk(photo) || thumb.length > 29000) throw new Error("too big");
  return { photo, thumb };
}

function hunterStatus(h){
  const r = h.replies || [];
  if(r.some(x=>x.verdict==="right")) return ["found", "Found it! +" + HUNT_PTS];
  if(r.some(x=>!x.verdict)) return ["wait", "Waiting for " + h.name];
  if(r.length) return ["wrong", "Wrong. Try again (" + (5 - r.length) + " left)"];
  return ["new", "Not tried yet"];
}

async function huntSendPhoto(kind, file){
  huntNote = "";
  try{
    const ph = await makePhotos(file);
    if(kind==="new"){ huntDraft.photo = ph.photo; huntDraft.thumb = ph.thumb; huntDraft.err = ""; render(); return; }
    huntBusy = true; huntNote = "Sending..."; render();
    const j = await rpc("hunt_reply", { hunt_id:huntId, photo:ph.photo, thumb:ph.thumb });
    huntBusy = false; huntNote = j && j.ok ? "" : (HUNT_ERRORS[j && j.error] || "That didn't work. Try again.");
    await refreshHunts(); render();
  }catch(e){
    huntBusy = false;
    if(kind==="new") huntDraft.err = "That photo didn't work. Try another.";
    else huntNote = "That photo didn't work. Try another.";
    render();
  }
}
async function huntPost(){
  const d = huntDraft; if(d.busy) return;
  d.busy = true; d.err = ""; render();
  try{
    const j = await rpc("hunt_post", { hint:d.hint.trim(), photo:d.photo, thumb:d.thumb });
    d.busy = false;
    if(j && j.ok){ huntDraft = { photo:null, thumb:null, hint:"", agree:false, busy:false, err:"" }; huntPage = "list"; huntTab = "mine"; toast("Hunt posted!"); await refreshHunts(); }
    else d.err = HUNT_ERRORS[j && j.error] || "That didn't work. Try again.";
  }catch(e){ d.busy = false; d.err = "Couldn't reach the server. Try again."; }
  render();
}
async function huntJudge(id, right){
  try{
    const j = await rpc("hunt_judge", { reply_id:id, is_right:right });
    if(j && j.ok){ if(right){ addPoints(HUNT_OWNER_PTS); save(); toast(`Nice! +${HUNT_OWNER_PTS} points for a hunt someone solved`); } }
    else huntNote = HUNT_ERRORS[j && j.error] || "That didn't work.";
  }catch(e){ huntNote = "Couldn't reach the server. Try again."; }
  await refreshHunts(); render();
}
async function huntReport(kind, id){
  try{ await rpc("hunt_report", { kind, item_id:id }); huntReported.add(kind+":"+id); toast("Thanks. We'll take a look."); }
  catch(e){ toast("Couldn't send the report. Try again."); }
  render();
}
async function huntDelete(){
  if(!confirmHuntDelete){ confirmHuntDelete = true; render(); return; }
  try{ await rpc("hunt_delete", { hunt_id:huntId }); }catch(e){ huntNote = "Couldn't delete. Try again."; render(); return; }
  confirmHuntDelete = false; huntPage = "list"; await refreshHunts(); render();
}

/* ---------- GPS Tic-Tac-Toe (one phone) ----------
   A real 3x3 board on the ground. Two players share ONE phone. Stand in the middle square and set the center,
   then take turns: walk onto the square you want, tap Claim, and pass the phone. The top of the board is North.
   Everything stays on the phone: the board's position is saved only in this browser, never sent anywhere. */
const TTT_KEY = "questopia-ttt-v1";
const TTT_SIZES = { s:[15,"50 ft"], m:[25,"80 ft"], l:[40,"130 ft"] };
const TTT_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const TTT_MAX_ACC = 25, TTT_DAILY = 3, TTT_PTS = 10;
function tttFresh(){ return { center:null, size:"m", names:["You","Player 2"], board:Array(9).fill(""), turn:"X", first:"X", over:false, win:null,
  moves:0, practice:false, score:{X:0,O:0,D:0}, paid:{d:"",n:0}, mode:"one", room:null, paidGame:"" }; }
function tttClean(t){
  const f = tttFresh(); if(!t || typeof t !== "object") return f;
  const nm = (v, d) => { const s = String(v == null ? "" : v).replace(/[^A-Za-z0-9 _]/g,"").trim().slice(0,12); return s || d; };
  const c = Array.isArray(t.center) && t.center.length===2 && t.center.every(Number.isFinite) && Math.abs(t.center[0])<=90 && Math.abs(t.center[1])<=180 ? [t.center[0], t.center[1]] : null;
  const board = Array.isArray(t.board) && t.board.length===9 ? t.board.map(v=>v==="X"||v==="O"?v:"") : f.board;
  const moves = board.filter(Boolean).length, sc = t.score || {};
  const n = k => Math.max(0, Math.min(999, Math.floor(Number(sc[k])||0)));
  const out = { center:c, size:TTT_SIZES[t.size] ? t.size : "m", names:[nm(t.names&&t.names[0],"You"), nm(t.names&&t.names[1],"Player 2")],
    board, turn:t.turn==="O"?"O":"X", first:t.first==="O"?"O":"X", over:false, win:null, moves, practice:!!t.practice,
    mode:t.mode==="two"?"two":"one", paidGame:String(t.paidGame||"").slice(0,20),
    room:t.room && /^[A-Z0-9]{5}$/.test(String(t.room.code)) ? { code:String(t.room.code), role:t.room.role==="O"?"O":"X" } : null,
    score:{ X:n("X"), O:n("O"), D:n("D") }, paid:{ d:String(t.paid&&t.paid.d||"").slice(0,10), n:Math.max(0, Math.min(99, Math.floor(Number(t.paid&&t.paid.n)||0))) } };
  const w = tttWinner(board); if(w){ out.over = true; out.win = w; } else if(moves===9) out.over = true;
  return out;
}
function tttWinner(b){ for(const l of TTT_LINES){ if(b[l[0]] && b[l[0]]===b[l[1]] && b[l[0]]===b[l[2]]) return l; } return null; }
let ttt = tttClean(readJSON(TTT_KEY, null));
let inTtt = false, tttPage = "setup", tttPos = null, tttMsg = "", tttWatchId = null, tttRecent = [], tttFlash = "";
function tttSave(){ try{ localStorage.setItem(TTT_KEY, JSON.stringify(ttt)); }catch(e){} }
const tttS = () => TTT_SIZES[ttt.size][0];
const tttName = m => ttt.names[m==="X"?0:1];

function tttStartWatch(){
  if(tttWatchId != null) return;
  if(!("geolocation" in navigator)){ tttPos = null; tttMsg = "GPS isn't available on this device."; return; }
  tttWatchId = navigator.geolocation.watchPosition(tttFix, tttGeoErr, { enableHighAccuracy:true, maximumAge:0, timeout:30000 });
  try{ getWake(); }catch(e){}
}
function tttStopWatch(){
  if(tttWatchId != null){ try{ navigator.geolocation.clearWatch(tttWatchId); }catch(e){} tttWatchId = null; }
  tttPos = null; tttRecent = [];
  if(!live) releaseWake();
}
function tttGeoErr(e){
  tttMsg = e && e.code===1 ? "Location is blocked. Allow location for this site in your browser settings, then reopen this page." :
           "Can't find GPS right now. Go somewhere with a clear view of the sky.";
  if(e && e.code===1) tttPos = null;
  tttPaint();
}
function tttFix(pos){
  const c = pos.coords; if(!c || !Number.isFinite(c.latitude) || !Number.isFinite(c.longitude)) return;
  const acc = Math.max(3, Number(c.accuracy) || 99), now = Date.now();
  tttMsg = "";
  const last = tttRecent[tttRecent.length-1];
  if(last){ const dy = (c.latitude-last.lat)*110574, dx = (c.longitude-last.lon)*111320*Math.cos(rad(c.latitude)); // a big jump means a new place, so forget the old readings
    if(Math.hypot(dx,dy) > 8 + 1.5*acc) tttRecent = []; }
  tttRecent = tttRecent.filter(p=>now - p.t < 3500).concat({ lat:c.latitude, lon:c.longitude, acc, t:now }).slice(-3);
  let sw = 0, la = 0, lo = 0; // steadier dot: more weight on the more accurate readings
  tttRecent.forEach(p=>{ const w = 1/(p.acc*p.acc); sw += w; la += p.lat*w; lo += p.lon*w; });
  tttPos = { lat:la/sw, lon:lo/sw, acc, t:now };
  tttPaint();
}
// Where is a point, in metres east/north of the board's center?
function tttOffset(lat, lon){
  const c = ttt.center; return { x:(lon - c[1]) * 111320 * Math.cos(rad(c[0])), y:(lat - c[0]) * 110574 };
}
function tttCellAt(x, y){ // x east, y north (metres) -> 0..8 or -1
  const S = tttS(), col = Math.floor((x + 1.5*S)/S), row = Math.floor((1.5*S - y)/S);
  return col>=0 && col<3 && row>=0 && row<3 ? row*3 + col : -1;
}
function tttMyCell(){
  if(!ttt.center || !tttPos) return -1;
  const o = tttOffset(tttPos.lat, tttPos.lon); return tttCellAt(o.x, o.y);
}
function tttStatus(){
  if(ttt.practice) return ["good", "Practice mode: tap a square"];
  if(tttMsg) return ["bad", tttMsg];
  if(!tttPos) return ["wait", "Looking for GPS..."];
  if(Date.now() - tttPos.t > 45000) return ["wait", "Waiting for a new GPS reading..."];
  if(tttPos.acc > TTT_MAX_ACC) return ["weak", `Weak GPS (within ${Math.round(tttPos.acc)} m). Wait a moment.`];
  return ["good", `GPS locked · within ${Math.round(tttPos.acc)} m`];
}
function tttSetCenter(){
  if(tttTwo()) return tttSetCenterTwo();
  if(!tttPos || Date.now() - tttPos.t > 45000){ tttMsg = tttMsg || "Still looking for GPS. Wait for GPS locked, then try again."; tttPaint(); return; }
  if(tttPos.acc > TTT_MAX_ACC){ toast("GPS is too fuzzy. Wait for a better signal."); return; }
  ttt.center = [tttPos.lat, tttPos.lon]; tttNewGame(true); ttt.practice = false; tttPage = "play"; tttSave(); render();
}
function tttNewGame(keepScore){
  ttt.board = Array(9).fill(""); ttt.over = false; ttt.win = null; ttt.moves = 0; tttFlash = "";
  ttt.first = keepScore ? ttt.first : (ttt.first==="X" ? "O" : "X"); ttt.turn = ttt.first;
  if(!keepScore) return;
}
function tttPlace(i){
  if(ttt.over || ttt.board[i]) return false;
  ttt.board[i] = ttt.turn; ttt.moves++;
  const w = tttWinner(ttt.board);
  try{ if(navigator.vibrate) navigator.vibrate(w ? [60,40,60] : 40); }catch(e){}
  if(w){ ttt.over = true; ttt.win = w; ttt.score[ttt.turn]++; tttFinish(ttt.turn); }
  else if(ttt.moves===9){ ttt.over = true; ttt.score.D++; tttFinish(null); }
  else ttt.turn = ttt.turn==="X" ? "O" : "X";
  tttSave(); return true;
}
function tttFinish(winner){
  tttFlash = winner ? `${tttName(winner)} (${winner}) wins!` : "It's a draw!";
  if(ttt.practice) return;
  const day = new Date().toISOString().slice(0,10);
  if(ttt.paid.d !== day) ttt.paid = { d:day, n:0 };
  if(ttt.paid.n < TTT_DAILY){ ttt.paid.n++; addPoints(TTT_PTS); save(); toast(`Game finished! +${TTT_PTS} points`); }
}
function tttClaim(){
  if(tttTwo()) return tttClaimTwo();
  if(ttt.over) return;
  const st = tttStatus();
  if(st[0] !== "good"){ tttFlash = st[0]==="weak" ? st[1] : "No GPS reading yet. Wait for GPS locked."; render(); return; }
  const i = tttMyCell();
  if(i < 0){ tttFlash = "You're outside the board. Walk onto a square first."; render(); return; }
  if(ttt.board[i]){ tttFlash = "That square is taken. Walk to an empty one."; render(); return; }
  tttFlash = ""; tttPlace(i); render();
}

/* canvas */
function tttPaint(){
  const cv = document.querySelector("canvas[data-ttt]");
  if(cv) tttDraw(cv);
  const chip = document.getElementById("tttChip");
  if(chip){ const s = tttStatus(); chip.className = "chip-gps " + s[0]; chip.textContent = s[1]; }
  const cb = document.querySelector('[data-act="ttt-claim"]'); if(cb) cb.disabled = ttt.over || (tttTwo() && !tttMyTurn());
}
function tttDraw(cv){
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth || 320, h = w;
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const x = cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h);
  const u = w/5, S = tttS(), g = x.createLinearGradient(0,0,0,h); g.addColorStop(0,"#CFE8C4"); g.addColorStop(1,"#B9DDAE");
  x.fillStyle = g; x.fillRect(0,0,w,h);
  const bx = u, by = u, bs = 3*u, my = ttt.practice ? -1 : tttMyCell();
  x.fillStyle = "rgba(255,255,255,.55)"; x.fillRect(bx,by,bs,bs);
  if(my >= 0){ x.fillStyle = "rgba(46,94,62,.28)"; x.fillRect(bx + (my%3)*u, by + Math.floor(my/3)*u, u, u); }
  x.strokeStyle = "#2E5E3E"; x.lineWidth = 4; x.lineCap = "round";
  for(let i=1;i<3;i++){ x.beginPath(); x.moveTo(bx+i*u, by); x.lineTo(bx+i*u, by+bs); x.stroke(); x.beginPath(); x.moveTo(bx, by+i*u); x.lineTo(bx+bs, by+i*u); x.stroke(); }
  x.lineWidth = 2; x.strokeRect(bx,by,bs,bs);
  ttt.board.forEach((m,i)=>{
    if(!m) return; const cx = bx + (i%3)*u + u/2, cy = by + Math.floor(i/3)*u + u/2, r = u*.3;
    x.lineWidth = Math.max(5, u*.1);
    if(m==="X"){ x.strokeStyle = "#E8446B"; x.beginPath(); x.moveTo(cx-r,cy-r); x.lineTo(cx+r,cy+r); x.moveTo(cx+r,cy-r); x.lineTo(cx-r,cy+r); x.stroke(); }
    else { x.strokeStyle = "#3A86FF"; x.beginPath(); x.arc(cx,cy,r,0,7); x.stroke(); }
  });
  if(ttt.win){ const a = ttt.win[0], b = ttt.win[2], p = i => [bx+(i%3)*u+u/2, by+Math.floor(i/3)*u+u/2];
    x.strokeStyle = "#F5B82E"; x.lineWidth = Math.max(7, u*.13); x.globalAlpha = .9; x.beginPath(); x.moveTo(...p(a)); x.lineTo(...p(b)); x.stroke(); x.globalAlpha = 1; }
  // compass
  x.fillStyle = "#1F2A22"; x.font = "800 13px system-ui,sans-serif"; x.textAlign = "center"; x.fillText("N ↑", w/2, 18);
  // you
  if(!ttt.practice && ttt.center && tttPos){
    const o = tttOffset(tttPos.lat, tttPos.lon), W = 2.5*S;
    let px = o.x/S*u + w/2, py = -o.y/S*u + h/2;
    const out = Math.abs(o.x) > W || Math.abs(o.y) > W;
    px = Math.max(14, Math.min(w-14, px)); py = Math.max(28, Math.min(h-14, py));
    if(!out){ x.beginPath(); x.arc(px,py, Math.min(u*1.2, tttPos.acc/S*u), 0, 7); x.fillStyle = "rgba(58,134,255,.16)"; x.fill(); }
    x.beginPath(); x.arc(px,py,10,0,7); x.fillStyle = "#fff"; x.fill();
    x.beginPath(); x.arc(px,py,7,0,7); x.fillStyle = (tttTwo() ? tttRole() : ttt.turn)==="X" ? "#E8446B" : "#3A86FF"; x.fill();
    if(out){ x.fillStyle = "rgba(255,255,255,.9)"; x.fillRect(w/2-70, h-30, 140, 22); x.fillStyle = "#1F2A22"; x.font = "700 12px system-ui,sans-serif"; x.fillText("You're off the board", w/2, h-14); }
  }
  // scale bar: one square
  x.strokeStyle = "#1F2A22"; x.lineWidth = 3; x.beginPath(); x.moveTo(10, h-12); x.lineTo(10+u, h-12); x.stroke();
  x.fillStyle = "#1F2A22"; x.font = "700 11px system-ui,sans-serif"; x.textAlign = "left"; x.fillText(`1 square = ${S} m (${TTT_SIZES[ttt.size][1]})`, 10, h-18);
}

/* screens */
function tttView(){
  const back = `<div class="locker-top"><button class="backlink" data-act="close-ttt">‹ Quests</button><h2>GPS Tic-Tac-Toe</h2></div>`;
  if(tttTwo()) return tttTwoView(back);
  if(tttPage==="setup" || (!ttt.center && !ttt.practice)){
    const st = tttStatus();
    return `<section class="ttt">${back}${tttModeSeg()}
    <p class="hunt-intro">Make a giant tic-tac-toe board outside and play on <b>one phone</b>. Walk to a square, tap Claim, then hand the phone to the other player.</p>
    <div class="group"><h3>1. Square size</h3>
      <div class="seg" role="group" aria-label="Square size">${Object.keys(TTT_SIZES).map(k=>`<button class="seg-btn" data-act="ttt-size" data-size="${k}" aria-pressed="${ttt.size===k}">${{s:"Small",m:"Medium",l:"Large"}[k]}<small>${TTT_SIZES[k][0]} m · ${TTT_SIZES[k][1]}</small></button>`).join("")}</div>
      <p class="fine">Phone GPS can be off by about 5 to 10 m, so Medium or Large works best. Pick a big open space, like a park or a field.</p>
      <h3 style="margin-top:14px">2. Players</h3>
      <div class="ttt-names"><label><span class="mk x">X</span><input class="text" id="tttN0" maxlength="12" value="${esc(ttt.names[0])}" autocomplete="off"></label>
        <label><span class="mk o">O</span><input class="text" id="tttN1" maxlength="12" value="${esc(ttt.names[1])}" autocomplete="off"></label></div>
      <h3 style="margin-top:14px">3. Set the center</h3>
      <p class="fine" style="margin-top:0">Stand in the <b>middle square</b> and tap the button. The board will be 3 squares wide, with <b>North at the top</b>.</p>
      <p><span id="tttChip" class="chip-gps ${st[0]}">${esc(st[1])}</span></p>
      <button class="btn solid wide" data-act="ttt-center">Set the center here</button>
      <button class="linkbtn" style="margin-top:12px" data-act="ttt-practice">Try it without GPS (practice, no points)</button>
    </div></section>`;
  }
  const turn = ttt.turn, over = ttt.over, st = tttStatus();
  const head = over ? `<div class="ttt-turn over">${esc(tttFlash || "Game over")}</div>`
    : `<div class="ttt-turn"><span class="mk ${turn.toLowerCase()}">${turn}</span><span><b>${esc(tttName(turn))}'s turn</b><small>${ttt.practice ? "Tap a square on the board" : "Walk onto a square, then tap Claim"}</small></span></div>`;
  return `<section class="ttt">${back}
    ${head}
    ${ttt.practice ? `<p class="chip-gps good">Practice mode · no points</p>` : `<p><span id="tttChip" class="chip-gps ${st[0]}">${esc(st[1])}</span></p>`}
    <div class="ttt-board"><canvas data-ttt role="img" aria-label="Tic-tac-toe board"></canvas></div>
    ${!over && tttFlash ? `<p class="err">${esc(tttFlash)}</p>` : ""}
    ${over ? `<button class="btn solid wide" data-act="ttt-new">Play again</button>`
           : ttt.practice ? "" : `<button class="btn solid wide" data-act="ttt-claim">Claim this square</button>`}
    <div class="ttt-score"><div><span class="mk x">X</span><b>${ttt.score.X}</b><small>${esc(ttt.names[0])}</small></div><div><b>${ttt.score.D}</b><small>Draws</small></div><div><span class="mk o">O</span><b>${ttt.score.O}</b><small>${esc(ttt.names[1])}</small></div></div>
    <div class="ttt-row"><button class="btn" data-act="ttt-new">Restart game</button><button class="btn" data-act="ttt-move">${ttt.practice ? "Use GPS" : "Move the board"}</button></div>
    <button class="linkbtn" data-act="ttt-end">End and forget the board's location</button>
    <p class="fine">You earn ${TTT_PTS} points for each finished game, up to ${TTT_DAILY} a day. Keep your screen on and stay in the open. Look out for traffic and stay safe.</p>
  </section>`;
}
/* ---------- Two-phone mode ----------
   One player makes a room and gets a 5-letter code, the friend types the code. Both stand in the MIDDLE square together
   and each phone sets its own board center from its own GPS. That center never leaves the phone. Only the squares
   people claim are sent through the server. */
let tttRoom = null, tttCode = "", tttRoomMsg = "", tttRoomBusy = false, tttPollBusy = false, tttSig = "", tttConfirmReset = false;
const TTT_ROOM_ERRORS = {
  not_found:"No room has that code. Check it and try again.", full:"That room already has two players.", own_room:"That's your own room. Give the code to your friend.",
  slow_down:"Too many wrong codes. Wait 10 minutes and try again.", gone:"This room was closed.", not_your_turn:"It's not your turn yet.",
  taken:"That square is taken.", not_playing:"The game isn't running right now.", busy:"The server is busy. Try again.", no_guest:"Your friend hasn't joined yet."
};
const tttTwo = () => ttt.mode === "two";
const tttRole = () => ttt.room ? ttt.room.role : "X";
const tttMyTurn = () => tttTwo() && !ttt.over && ttt.turn === tttRole();
function tttRoomApply(v){
  if(!v || !v.ok){ return; }
  tttRoom = v; ttt.room = { code:String(v.code).slice(0,5), role:v.role==="O"?"O":"X" };
  ttt.size = TTT_SIZES[v.size] ? v.size : ttt.size;
  const nm = x => String(x||"").replace(/[^A-Za-z0-9 _]/g,"").slice(0,12);
  ttt.names = [nm(v.names && v.names[0]) || "Player 1", nm(v.names && v.names[1]) || "Player 2"];
  ttt.board = String(v.board||".........").slice(0,9).split("").map(c=>c==="X"||c==="O"?c:"");
  ttt.moves = ttt.board.filter(Boolean).length; ttt.turn = v.turn==="O"?"O":"X"; ttt.first = v.first==="O"?"O":"X";
  const sc = v.score || {}; ttt.score = { X:Math.max(0,sc.X|0), O:Math.max(0,sc.O|0), D:Math.max(0,sc.D|0) };
  ttt.over = v.status === "done";
  ttt.win = ttt.over && v.line ? String(v.line).split(",").map(Number).filter(n=>n>=0&&n<9) : null;
  if(ttt.win && ttt.win.length!==3) ttt.win = null;
  if(ttt.over){
    const key = ttt.room.code + ":" + v.game;
    tttFlash = v.winner ? `${tttName(v.winner)} (${v.winner}) wins!` : "It's a draw!";
    if(ttt.paidGame !== key){ ttt.paidGame = key; tttFinish(v.winner==="X"||v.winner==="O" ? v.winner : null); }
  } else if(v.status === "playing") tttFlash = "";
  tttSave();
}
function tttRoomGone(msg){
  tttRoom = null; ttt.room = null; ttt.center = null; ttt.board = Array(9).fill(""); ttt.over = false; ttt.win = null; tttSig = "";
  tttRoomMsg = msg || ""; tttSave(); render();
}
async function tttPoll(){
  if(!inTtt || !tttTwo() || !ttt.room || tttPollBusy || document.hidden || !huntSignedIn()) return;
  tttPollBusy = true;
  try{
    const v = await rpc("ttt_state", { p_code:ttt.room.code });
    if(!v || v.ok === false){ if(v && v.error==="gone") tttRoomGone("Your friend left, or the room closed."); }
    else {
      const sig = JSON.stringify([v.status, v.board, v.turn, v.names, v.score, v.ready, v.game]);
      if(sig !== tttSig){
        tttSig = sig; tttRoomApply(v);
        const a = document.activeElement; if(!(a && a.id==="tttCode")) render();
      }
    }
  }catch(e){ /* keep trying */ }
  tttPollBusy = false;
}
async function tttRoomCall(fn, args, okFn){
  if(tttRoomBusy) return; tttRoomBusy = true; tttRoomMsg = "";
  try{
    const v = await rpc(fn, args);
    if(v && v.ok){ tttSig = ""; tttRoomApply(v); if(okFn) okFn(v); }
    else { tttRoomMsg = TTT_ROOM_ERRORS[v && v.error] || "That didn't work. Try again."; if(v && v.error==="gone") tttRoomGone(tttRoomMsg); }
  }catch(e){ tttRoomMsg = "Couldn't reach the server. Try again."; }
  tttRoomBusy = false; render();
}
const myName = () => String(state.username||"Player").replace(/[^A-Za-z0-9 _]/g,"").slice(0,12) || "Player";
function tttCreateRoom(){ ttt.center = null; tttRoomCall("ttt_create", { p_name:myName(), p_size:ttt.size }); }
function tttJoinRoom(){ ttt.center = null; tttRoomCall("ttt_join", { p_code:tttCode, p_name:myName() }); }
async function tttLeaveRoom(){
  const code = ttt.room && ttt.room.code;
  tttRoom = null; ttt.room = null; ttt.center = null; tttSig = ""; tttCode = ""; tttSave(); render();
  if(code){ try{ await rpc("ttt_leave", { p_code:code }); }catch(e){} }
}
function tttIAmReady(){ return !!(tttRoom && tttRoom.ready && tttRoom.ready[tttRole()==="X"?0:1]); }
function tttSetCenterTwo(){
  if(!tttPos || Date.now() - tttPos.t > 45000){ tttMsg = tttMsg || "Still looking for GPS. Wait for GPS locked, then try again."; tttPaint(); return; }
  if(tttPos.acc > TTT_MAX_ACC){ toast("GPS is too fuzzy. Wait for a better signal."); return; }
  ttt.center = [tttPos.lat, tttPos.lon]; tttSave();
  tttRoomCall("ttt_ready", { p_code:ttt.room.code });
}
async function tttClaimTwo(){
  if(ttt.over) return;
  if(!tttMyTurn()){ tttFlash = `It's ${tttName(ttt.turn)}'s turn. Wait for them.`; render(); return; }
  const st = tttStatus();
  if(st[0] !== "good"){ tttFlash = st[0]==="weak" ? st[1] : "No GPS reading yet. Wait for GPS locked."; render(); return; }
  if(!ttt.center){ tttFlash = "Stand in the middle square and tap Reset my center first."; render(); return; }
  const i = tttMyCell();
  if(i < 0){ tttFlash = "You're outside the board. Walk onto a square first."; render(); return; }
  if(ttt.board[i]){ tttFlash = "That square is taken. Walk to an empty one."; render(); return; }
  if(tttRoomBusy) return; tttRoomBusy = true; tttFlash = "";
  try{
    const v = await rpc("ttt_move", { p_code:ttt.room.code, p_cell:i });
    if(v && v.ok){ tttSig = ""; tttRoomApply(v); try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){} }
    else { tttFlash = TTT_ROOM_ERRORS[v && v.error] || "That didn't work."; if(v && v.error==="gone"){ tttRoomBusy = false; return tttRoomGone(tttFlash); } }
  }catch(e){ tttFlash = "Couldn't reach the server. Try again."; }
  tttRoomBusy = false; render();
}
function tttModeSeg(){
  return `<div class="seg" role="group" aria-label="How many phones">
    <button class="seg-btn" data-act="ttt-mode" data-mode="one" aria-pressed="${!tttTwo()}">One phone<small>Share this phone</small></button>
    <button class="seg-btn" data-act="ttt-mode" data-mode="two" aria-pressed="${tttTwo()}">Two phones<small>Join with a code</small></button></div>`;
}
function tttTwoView(back){
  const head = `<section class="ttt">${back}${tttModeSeg()}`;
  const err = tttRoomMsg ? `<p class="err">${esc(tttRoomMsg)}</p>` : "";
  if(!huntSignedIn()) return `${head}
    <div class="group"><h3>Sign in to play on two phones</h3><p>Two-phone games use a room code, so both players need an online account.</p>
      ${ONLINE ? `<button class="btn solid wide" data-act="open-account">Sign in</button>` : `<p class="demo-note">Online accounts aren't set up yet.</p>`}</div></section>`;
  if(!ttt.room || !tttRoom) return `${head}
    <p class="hunt-intro">Each player uses their <b>own phone</b>. Make a room and share the code, or type your friend's code.</p>
    <div class="group"><h3>Make a room</h3>
      <div class="seg" role="group" aria-label="Square size">${Object.keys(TTT_SIZES).map(k=>`<button class="seg-btn" data-act="ttt-size" data-size="${k}" aria-pressed="${ttt.size===k}">${{s:"Small",m:"Medium",l:"Large"}[k]}<small>${TTT_SIZES[k][0]} m · ${TTT_SIZES[k][1]}</small></button>`).join("")}</div>
      <button class="btn solid wide" data-act="ttt-create" ${tttRoomBusy?"disabled":""}>Make a room</button></div>
    <div class="group"><h3>Join a friend's room</h3>
      <input class="text code-in" id="tttCode" maxlength="5" placeholder="Enter the code" value="${esc(tttCode)}" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn wide" data-act="ttt-join" ${tttCode.length===5 && !tttRoomBusy ? "" : "disabled"}>Join</button></div>
    ${err}</section>`;
  const code = ttt.room.code, st = tttRoom.status;
  if(st === "waiting") return `${head}
    <div class="group"><h3>Your room code</h3>
      <div class="room-code" aria-label="Room code ${esc(code.split("").join(" "))}">${esc(code)}</div>
      <p class="fine" style="text-align:center">Tell your friend this code. On their phone: Questopia, menu, GPS Tic-Tac-Toe, Two phones, then Join.</p>
      <p style="text-align:center"><span class="chip-gps wait">Waiting for your friend to join...</span></p>
      <button class="btn wide" data-act="ttt-leave">Cancel room</button></div>${err}</section>`;
  if(st === "setup"){
    const gs = tttStatus(), me = tttIAmReady(), other = tttName(tttRole()==="X" ? "O" : "X");
    return `${head}
    <div class="group"><h3>${esc(ttt.names[0])} (X) vs ${esc(ttt.names[1])} (O)</h3>
      <p><b>Both of you stand in the middle square together</b>, then each tap the button on your own phone. The board is 3 squares wide with <b>North at the top</b>. Your location stays on your phone.</p>
      ${me ? `<p style="text-align:center"><span class="chip-gps wait">Waiting for ${esc(other)} to set the center...</span></p>`
           : `<p><span id="tttChip" class="chip-gps ${gs[0]}">${esc(gs[1])}</span></p>
              <button class="btn solid wide" data-act="ttt-center">Set the center here</button>`}
      <button class="linkbtn" style="margin-top:12px" data-act="ttt-leave">Leave room</button></div>${err}</section>`;
  }
  // playing or done
  const turn = ttt.turn, over = ttt.over, mine = tttMyTurn(), role = tttRole(), gs = tttStatus();
  const headTurn = over ? `<div class="ttt-turn over">${esc(tttFlash || "Game over")}</div>`
    : `<div class="ttt-turn"><span class="mk ${turn.toLowerCase()}">${turn}</span><span><b>${mine ? "Your turn" : esc(tttName(turn)) + "'s turn"}</b><small>${mine ? "Walk onto a square, then tap Claim" : "Waiting for them to claim a square..."}</small></span></div>`;
  return `${head}
    ${headTurn}
    <p><span id="tttChip" class="chip-gps ${gs[0]}">${esc(gs[1])}</span> <span class="chip-gps">You are ${role}</span></p>
    <div class="ttt-board"><canvas data-ttt role="img" aria-label="Tic-tac-toe board"></canvas></div>
    ${!over && tttFlash ? `<p class="err">${esc(tttFlash)}</p>` : ""}${err}
    ${over ? `<button class="btn solid wide" data-act="ttt-rematch">Play again</button>`
           : `<button class="btn solid wide" data-act="ttt-claim" ${mine ? "" : "disabled"}>Claim this square</button>`}
    <div class="ttt-score"><div><span class="mk x">X</span><b>${ttt.score.X}</b><small>${esc(ttt.names[0])}</small></div><div><b>${ttt.score.D}</b><small>Draws</small></div><div><span class="mk o">O</span><b>${ttt.score.O}</b><small>${esc(ttt.names[1])}</small></div></div>
    <div class="ttt-row"><button class="btn" data-act="ttt-reset-center">${tttConfirmReset ? "Tap again" : "Reset my center"}</button><button class="btn" data-act="ttt-leave">Leave room</button></div>
    <p class="fine">Reset your center only if the board drifted: stand in the middle square first. You earn ${TTT_PTS} points for each finished game, up to ${TTT_DAILY} a day.</p>
  </section>`;
}

function tttOpen(){
  inTtt = true; tttMsg = ""; tttFlash = "";
  tttPage = ttt.center ? "play" : "setup";
  if(tttTwo() && ttt.room) tttPoll();
  if(!ttt.practice || tttTwo()) tttStartWatch();
}
function tttClose(){ inTtt = false; tttStopWatch(); }

function render(){
  if(!inShop && (tryTitle || Object.keys(tryGear).length)){ clearTryOn(); setAvatar(); } // try-on never outlives the Shop
  const welcome = !state.username;
  document.getElementById("app").innerHTML =
    welcome ? welcomeView() : editing ? editorView() : inAccount ? accountView() : inAdmin ? adminView() : inActivity ? activityView() : inWalks ? walksView() : inHunts ? huntsView() : inTtt ? tttView() : inLocker ? lockerView() : inShop ? shopView()
    : friendsPage==="requests" ? requestsView() : friendsPage==="profile" ? profileView()
    : friendsPage==="friend-locker" ? friendLockerView() : friendsPage==="new-challenge" ? newChallengeView() : friendsPage==="challenge" ? challengeView()
    : friendsPage ? friendsView() : mainView();
  if(!welcome && !editing && (inActivity || inWalks) && document.querySelector("canvas[data-route]")) paintRoutes();
  if(!welcome && !editing && inTtt) tttPaint();
  if(!welcome && !editing && friendsPage) renderFriendAvatars();
  if(!welcome && editing) updateEditorUI();
  if(welcome){ const i = document.getElementById("uname"); if(i) i.focus(); }
  if(!welcome && !editing && (inLocker || inShop || friendsPage==="friend-locker")) renderThumbs();
  draw(performance.now());
}

/* ---------- Events ---------- */
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && menuOpen){ menuOpen=false; render(); } });
document.addEventListener("click", e=>{
  if(menuOpen && !e.target.closest(".menu-panel, .menu-btn")){ menuOpen=false; render(); return; } // tap outside closes the menu
  if(e.target.closest("p.note") && !inLocker && !inShop && !friendsPage && !editing){ // 5 quick taps on the footer note opens Admin
    const now = Date.now(); noteTaps = noteTaps.filter(t=>now-t<3000).concat(now);
    if(noteTaps.length>=5){ noteTaps=[]; inAdmin=true; render(); window.scrollTo(0,0); }
    return;
  }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act==="set"){ setLookValue(el.dataset.key, el.dataset.val); }
  else if(act==="random"){ randomLook(); }
  else if(act==="map-mode"){ setMapMode(el.dataset.mode); render(); }
  else if(act==="toggle-menu"){ menuOpen=!menuOpen; render(); }
  else if(act==="start-activity"){ startGpsQuest(el.dataset.kind, el.dataset.id); }
  else if(act==="open-activity"){ openActivity(); }
  else if(act==="close-activity"){ inActivity=false; confirmDiscard=false; render(); window.scrollTo(0,0); }
  else if(act==="resume-gps"){ startWatch(); render(); }
  else if(act==="finish-activity"){ finishActivity(); }
  else if(act==="resume-activity"){ resumeActivity(); }
  else if(act==="save-nocredit"){ concludeActivity(actResult || { ok:false, why:[], credit:false, quest:null }, false); }
  else if(act==="discard-activity"){
    if(!confirmDiscard){ confirmDiscard = true; render(); return; } // first tap asks to confirm
    if(live && live.quest && activeFor(live.quest.kind, live.quest.id)) cancelQuest(); else discardLive();
    confirmDiscard = false; render(); window.scrollTo(0,0);
  }
  else if(act==="start-free-walk"){ startFreeWalk(); }
  else if(act==="open-hunts"){ menuOpen=false; inHunts=true; huntPage="list"; render(); window.scrollTo(0,0); refreshHunts(); }
  else if(act==="close-hunts"){ inHunts=false; render(); window.scrollTo(0,0); }
  else if(act==="hunt-back"){ huntPage="list"; huntNote=""; render(); window.scrollTo(0,0); refreshHunts(); }
  else if(act==="hunt-tab"){ huntTab = el.dataset.tab==="mine" ? "mine" : "find"; render(); }
  else if(act==="hunt-new"){ huntPage="new"; render(); window.scrollTo(0,0); }
  else if(act==="open-hunt"){ openHuntView(Number(el.dataset.id)); render(); window.scrollTo(0,0); }
  else if(act==="hunt-post"){ huntPost(); }
  else if(act==="judge"){ huntJudge(Number(el.dataset.id), el.dataset.right==="1"); }
  else if(act==="load-reply"){ fetchHuntPhoto("reply", Number(el.dataset.id)); }
  else if(act==="report-hunt"){ huntReport(el.dataset.kind==="reply" ? "reply" : "hunt", Number(el.dataset.id)); }
  else if(act==="delete-hunt"){ huntDelete(); }
  else if(act==="open-ttt"){ menuOpen=false; tttOpen(); render(); window.scrollTo(0,0); }
  else if(act==="close-ttt"){ tttClose(); render(); window.scrollTo(0,0); }
  else if(act==="ttt-mode"){ const m = el.dataset.mode==="two" ? "two" : "one"; if(m!==ttt.mode){ if(tttTwo()) tttLeaveRoom(); ttt.mode = m; ttt.practice = false; ttt.center = tttTwo() ? null : ttt.center; tttRoomMsg = ""; tttSave(); if(m==="one") tttNewGame(true); render(); } }
  else if(act==="ttt-create"){ tttCreateRoom(); }
  else if(act==="ttt-join"){ if(tttCode.length===5) tttJoinRoom(); }
  else if(act==="ttt-leave"){ tttLeaveRoom(); }
  else if(act==="ttt-rematch"){ tttRoomCall("ttt_rematch", { p_code:ttt.room.code }); }
  else if(act==="ttt-reset-center"){ if(!tttConfirmReset){ tttConfirmReset = true; render(); } else { tttConfirmReset = false; if(tttPos && tttPos.acc <= TTT_MAX_ACC){ ttt.center = [tttPos.lat, tttPos.lon]; tttSave(); toast("Center reset here"); } else toast("Wait for GPS locked first."); render(); } }
  else if(act==="ttt-size"){ ttt.size = TTT_SIZES[el.dataset.size] ? el.dataset.size : "m"; tttSave(); render(); }
  else if(act==="ttt-center"){ tttSetCenter(); }
  else if(act==="ttt-claim"){ tttClaim(); }
  else if(act==="ttt-new"){ tttNewGame(false); tttSave(); render(); }
  else if(act==="ttt-move"){ ttt.practice=false; ttt.center=null; tttNewGame(true); tttPage="setup"; tttSave(); tttStartWatch(); render(); }
  else if(act==="ttt-practice"){ ttt.practice=true; tttNewGame(true); tttPage="play"; tttStopWatch(); tttSave(); render(); }
  else if(act==="ttt-end"){ tttStopWatch(); ttt = Object.assign(tttFresh(), { names:ttt.names }); tttSave(); tttPage="setup"; render(); tttStartWatch(); }
  else if(act==="open-walks"){ menuOpen=false; inWalks=true; walksPage="list"; confirmDelete=null; render(); window.scrollTo(0,0); }
  else if(act==="close-walks"){ inWalks=false; confirmDelete=null; render(); window.scrollTo(0,0); }
  else if(act==="walks-list"){ walksPage="list"; confirmDelete=null; render(); window.scrollTo(0,0); }
  else if(act==="view-walk"){ viewWalkId=el.dataset.id; walksPage="detail"; confirmDelete=null; render(); window.scrollTo(0,0); }
  else if(act==="delete-walk"){
    if(confirmDelete !== el.dataset.id){ confirmDelete = el.dataset.id; render(); return; }
    walks = walks.filter(w=>w.id!==el.dataset.id); saveWalks(); confirmDelete = null; walksPage = "list"; render(); window.scrollTo(0,0);
  }
  else if(act==="delete-all-walks"){
    if(confirmDelete !== "all"){ confirmDelete = "all"; render(); return; }
    walks = []; saveWalks(); confirmDelete = null; render();
  }
  else if(act==="open-locker"){ menuOpen=false; inLocker=true; pendingBuy=null; render(); window.scrollTo(0,0); }
  else if(act==="close-locker"){ inLocker=false; pendingBuy=null; render(); window.scrollTo(0,0); }
  else if(act==="open-account"){ inAccount=true; render(); window.scrollTo(0,0); }
  else if(act==="close-account"){ inAccount=false; render(); window.scrollTo(0,0); }
  else if(act==="sign-in"){ signInWith(el.dataset.provider); }
  else if(act==="sign-out"){ signOut(); render(); }
  else if(act==="save-now"){ cloud.status = "Saving..."; render(); pushCloud(); }
  else if(act==="use-cloud"){ adoptCloud(cloud.conflict.row); }
  else if(act==="use-local"){ cloud.conflict = null; state.syncedAt = null; pushCloud().then(()=>render()); }
  else if(act==="close-admin"){ inAdmin=false; render(); window.scrollTo(0,0); }
  else if(act==="admin-out"){ adminSession=null; saveAdminSession(); render(); }
  else if(act==="ev-start" || act==="ev-stop"){
    const err = document.getElementById("aErr"); err.textContent = "";
    const stop = act==="ev-stop";
    const days = +document.getElementById("evLen").value;
    const until = stop || !days ? null : new Date(Date.now()+days*864e5).toISOString();
    el.disabled = true;
    saveEvent(stop ? 1 : +document.getElementById("evMult").value, until, stop ? "" : document.getElementById("evBanner").value.trim())
      .then(()=>{ render(); toast(stop ? "Event turned off" : "Event is live for everyone"); })
      .catch(e=>{ el.disabled=false; const x=document.getElementById("aErr"); if(x) x.textContent=e.message; if(!adminSession) render(); });
  }
  else if(act==="open-shop"){ menuOpen=false; inShop=true; pendingBuy=null; shopCart=[]; cartConfirm=false; clearTryOn(); render(); window.scrollTo(0,0); }
  else if(act==="close-shop"){ inShop=false; pendingBuy=null; shopCart=[]; cartConfirm=false; clearTryOn(); setAvatar(); render(); window.scrollTo(0,0); }
  else if(act==="try"){ toggleTry(el.dataset.cat, el.dataset.id); }
  else if(act==="try-reset"){ clearTryOn(); setAvatar(); render(); }
  else if(act==="cart"){ toggleCart(el.dataset.cat, el.dataset.id); }
  else if(act==="cart-clear"){ shopCart=[]; cartConfirm=false; render(); }
  else if(act==="cart-buy"){ buyCart(); }
  else if(act==="open-friends"){ menuOpen=false; friendsPage="list"; render(); window.scrollTo(0,0); refreshSocial(); }
  else if(act==="close-friends"){ friendsPage=null; render(); window.scrollTo(0,0); }
  else if(act==="friends-page"){ friendsPage = el.dataset.page || "list"; pendingRemove=false; render(); window.scrollTo(0,0); refreshSocial(); }
  else if(act==="view-friend"){ viewCode = el.dataset.code; pendingRemove=false; friendsPage="profile"; render(); window.scrollTo(0,0); }
  else if(act==="copy-code"){
    try { navigator.clipboard.writeText(state.friendCode).then(()=>toast("Code copied"), ()=>toast("Copy it by hand: "+state.friendCode)); }
    catch(_){ toast("Copy it by hand: "+state.friendCode); }
  }
  else if(act==="accept"){
    const c = el.dataset.code, p = playerByCode(c);
    if(TEST_MODE){
      state.requests = state.requests.filter(x=>x!==c);
      if(!state.friends.includes(c)) state.friends.push(c);
      save(); render(); if(p) toast(`${p.name} is now your friend`);
    } else if(p){
      el.disabled = true;
      socialAct("social_respond", { request_id:p.id, accept:true }).then(ok=>{ if(ok){ toast(`${p.name} is now your friend`); } else el.disabled = false; });
    }
  }
  else if(act==="test-request"){
    const next = SAMPLE_PLAYERS.find(p=>p.code!=="TEST-FRND" && !state.friends.includes(p.code) && !state.requests.includes(p.code));
    if(!next){ toast("No more test players left."); return; }
    state.requests.push(next.code); save(); render(); toast(`${next.name} sent you a request`);
  }
  else if(act==="friend-locker"){ viewCode = el.dataset.code; fLockCat = "titles"; friendsPage = "friend-locker"; render(); window.scrollTo(0,0); }
  else if(act==="fcat"){ fLockCat = el.dataset.cat; render(); }
  else if(act==="new-challenge"){ draft = { code: el.dataset.code }; friendsPage = "new-challenge"; render(); window.scrollTo(0,0); }
  else if(act==="view-challenge"){ viewChallenge = el.dataset.id; friendsPage = "challenge"; render(); window.scrollTo(0,0); }
  else if(act==="test-end"){
    const ch = state.challenges.find(c=>c.id===el.dataset.id);
    if(ch){ ch.end = dayKey(new Date(Date.now()-864e5)); finishChallenges(); render(); }
  }
  else if(act==="decline"){
    if(TEST_MODE){ state.requests = state.requests.filter(x=>x!==el.dataset.code); save(); render(); }
    else { const p = playerByCode(el.dataset.code); if(p){ el.disabled = true; socialAct("social_respond", { request_id:p.id, accept:false }).then(ok=>{ if(!ok) el.disabled = false; }); } }
  }
  else if(act==="cancel-req"){ el.disabled = true; socialAct("social_remove", { request_id:+el.dataset.id }).then(ok=>{ if(!ok) el.disabled = false; }); }
  else if(act==="challenge-soon"){ toast("Challenges with friends are coming soon!"); }
  else if(act==="remove-friend"){
    if(!pendingRemove){ pendingRemove=true; render(); return; }
    const rp = playerByCode(el.dataset.code);
    if(TEST_MODE) state.friends = state.friends.filter(x=>x!==el.dataset.code);
    pendingRemove=false; friendsPage="list";
    if(TEST_MODE){ save(); render(); window.scrollTo(0,0); }
    else if(rp){ socialAct("social_remove", { request_id:rp.id }).then(ok=>{ render(); window.scrollTo(0,0); if(ok) toast("Friend removed"); }); }
    else { render(); window.scrollTo(0,0); }
  }
  else if(act==="cat"){ lockCat = el.dataset.cat; pendingBuy=null; render(); }
  else if(act==="item"){ itemAction(el.dataset.cat, el.dataset.id); }
  else if(act==="done"){
    if(!applyName()) return;
    state.look = getLook(); save(); editing=false; render(); window.scrollTo(0,0);
  }
  else if(act==="open-editor"){ editing=true; render(); window.scrollTo(0,0); }
  else if(act==="tab"){ tab = el.dataset.tab; render(); }
  else if(act==="toggle"){ toggle(el.dataset.kind, el.dataset.id); }
  else if(act==="start"){ startQuest(el.dataset.kind, el.dataset.id); }
  else if(act==="cancel"){ cancelQuest(); }
  else if(act==="log"){
    const id = el.dataset.id;
    if(GPS_QUESTS[id]){ toast("This one needs an Activity. Tap Start Activity."); return; }
    if(!timerDone("season", id)) return;
    state.active = null;
    state.season.last = Object.assign(state.season.last||{}, { [id]: dayKey() });
    bumpSeason(id, 1); save(); render();
  }
});
document.addEventListener("submit", e=>{
  if(e.target.id === "adminLogin"){
    e.preventDefault();
    const err = document.getElementById("aErr"); err.textContent = "";
    adminSignIn(document.getElementById("aEmail").value.trim(), document.getElementById("aPass").value)
      .then(()=>render()).catch(x=>{ err.textContent = x.message; });
    return;
  }
  if(e.target.id === "challengeForm"){ e.preventDefault(); startChallenge(); return; }
  if(e.target.id === "addForm"){ e.preventDefault(); addFriendByCode(document.getElementById("fcode").value); return; }
  if(e.target.id !== "nameForm") return;
  e.preventDefault();
  if(applyName()) render();
});
document.addEventListener("input", e=>{
  if(e.target.id === "rwd"){
    const v = +e.target.value;
    document.getElementById("rwdVal").textContent = v;
    document.getElementById("prizes").textContent = prizeLine(v);
    return;
  }
  if(e.target.id === "uname"){
    e.target.removeAttribute("aria-invalid");
    const err = document.getElementById("unameErr"); if(err) err.textContent = "";
    return;
  }
  const el = e.target.closest("input[data-key]");
  if(el) setLookValue(el.dataset.key, el.value);
});
document.addEventListener("pointerdown", e=>{
  const cv = e.target.closest('canvas[data-mode="full"]'); if(!cv) return;
  drag = { x:e.clientX }; lastInteract = performance.now();
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener("pointermove", e=>{
  if(!drag) return;
  userYaw += (e.clientX - drag.x) * .012; drag.x = e.clientX;
  lastInteract = performance.now();
  if(REDUCED) draw(lastInteract);
});
const endDrag = ()=>{ drag = null; lastInteract = performance.now(); };
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ ensureFresh(); finishChallenges(); render(); refreshEvent(); if(cloud.session && !cloud.conflict){ syncCloud(); refreshSocial(); } } });

// Re-draw after the shared settings load, unless someone is typing
function refreshEvent(){
  const sig = () => JSON.stringify([eventMult(), eventSettings.banner, eventSettings.until]);
  const before = sig();
  loadEvent().then(ok=>{
    const a = document.activeElement;
    if(ok && sig() !== before && !(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) render();
  });
}
setInterval(()=>{ if(!document.hidden && ONLINE) refreshEvent(); }, 300000);
if(state.username && nameBlocked(state.username)){ state.username = ""; state.renameNotice = true; save(); } // an old name that wouldn't pass now
handleOAuthReturn().then(()=>{ if(cloud.session) syncCloud().then(()=>{ render(); refreshSocial(); refreshHunts(); }); else render(); });
setInterval(()=>{ if(!document.hidden && cloud.session && !cloud.conflict) syncCloud(); }, 120000);
setInterval(()=>{ if(!document.hidden && cloud.session && !cloud.conflict) refreshSocial(); }, 45000);
document.addEventListener("input", e=>{
  if(e.target.id==="tttCode"){ tttCode = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5); e.target.value = tttCode; const b = document.querySelector('[data-act="ttt-join"]'); if(b) b.disabled = tttCode.length!==5; }
  if(e.target.id==="tttN0" || e.target.id==="tttN1"){ const i = e.target.id==="tttN1" ? 1 : 0; ttt.names[i] = e.target.value.replace(/[^A-Za-z0-9 _]/g,"").slice(0,12) || (i ? "Player 2" : "You"); tttSave(); }
});
// practice mode: tap a square on the board
document.addEventListener("click", e=>{
  const cv = e.target.closest && e.target.closest("canvas[data-ttt]"); if(!cv || !ttt.practice || ttt.over) return;
  const r = cv.getBoundingClientRect(), u = r.width/5, cx = Math.floor((e.clientX - r.left)/u) - 1, cy = Math.floor((e.clientY - r.top)/u) - 1;
  if(cx>=0 && cx<3 && cy>=0 && cy<3 && tttPlace(cy*3+cx)) render();
});
setInterval(tttPoll, 2000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && inTtt && tttTwo()) tttPoll(); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && inTtt && tttWatchId != null) { try{ getWake(); }catch(e){} } });

document.addEventListener("input", e=>{
  if(e.target.id==="huntHint"){ huntDraft.hint = e.target.value; syncHuntPostBtn(); }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="huntAgree"){ huntDraft.agree = t.checked; syncHuntPostBtn(); }
  else if(t.dataset && t.dataset.huntFile){ const f = t.files && t.files[0]; t.value = ""; if(f) huntSendPhoto(t.dataset.huntFile, f); }
});
function syncHuntPostBtn(){
  const b = document.querySelector('[data-act="hunt-post"]');
  if(b) b.disabled = !(huntDraft.photo && huntDraft.hint.trim() && huntDraft.agree && !huntDraft.busy);
}
setInterval(()=>{ if(!document.hidden && cloud.session && !cloud.conflict && (inHunts || !hunts.loaded || pendingToJudge())) refreshHunts(); }, 45000);
 // new friend requests show up on their own
refreshEvent();
finishChallenges();
render();
if(HAS3D && !REDUCED) requestAnimationFrame(loop);
</script>
