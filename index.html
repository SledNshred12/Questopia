<meta name="description" content="Questopia: daily, weekly and season quests that get you off the screen and outside, with points to spend on your avatar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --field:#F1F6EA;
  --paper:#FCFEF9;
  --moss:#2E5E3E;
  --moss-dark:#1E4029;
  --sun:#F5B82E;
  --sun-soft:#FFEBB8;
  --sky:#CFE8F5;
  --ink:#1F2A22;
  --muted:#5D6B60;
  --line:#D9E3D0;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--field);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.5;
  min-height:100vh;
}
.sky{
  position:absolute;inset:0 0 auto 0;height:260px;z-index:0;
  background:linear-gradient(var(--sky),var(--field));
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3,.big-name{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-0.01em;font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--moss);outline-offset:2px;border-radius:8px}
canvas{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{display:flex;align-items:center;gap:12px}
.me{
  display:block;width:72px;height:72px;border-radius:50%;border:0;padding:5px;flex:none;
  background:var(--moss);box-shadow:0 2px 8px rgba(30,64,41,.18);
}
.me-in{
  display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:linear-gradient(#DDF0FA,#EEF6E2);border:2px solid var(--paper);
}
.me canvas,.me svg{width:100%;height:100%}

/* Locker button on the quest screen */
.locker-btn{
  display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;text-align:left;
  background:var(--paper);border:2px solid var(--moss);border-radius:16px;padding:10px 14px;color:var(--moss-dark);
}
.locker-btn:hover{background:#E6F0DC}
.locker-btn svg{width:28px;height:28px;flex:none}
.lb-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.lb-txt b{font-family:var(--display);font-size:19px}
.lb-txt span{font-size:13px;color:var(--muted)}
.locker-btn .chev{font-size:26px;line-height:1}
.menu-btn{
  position:relative;flex:none;width:46px;height:46px;border-radius:14px;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper);border:2px solid var(--moss);color:var(--moss-dark);
}
.points-bar{
  margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--moss);color:#fff;border-radius:16px;padding:8px 16px;
}
.pb-label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;opacity:.95}
.pb-label svg{width:22px;height:22px;flex:none}
.points-bar b{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.menu-btn:hover,.menu-btn[aria-expanded="true"]{background:#E6F0DC}
.menu-btn svg{width:24px;height:24px}
.menu-btn .count-badge{position:absolute;top:-8px;right:-8px}
.menu-panel{
  margin-top:14px;padding:12px;background:var(--paper);border:1px solid var(--line);
  border-radius:20px;box-shadow:0 6px 20px rgba(30,64,41,.14);
}
.menu-panel .locker-btn{margin-top:10px;background:var(--field)}
.menu-panel .locker-btn:first-child{margin-top:0}
.menu-panel .locker-btn:hover{background:#E6F0DC}
.brand{flex:1;min-width:0}
.brand h1{font-size:25px;font-weight:800;color:var(--moss-dark);overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.brand p{margin:3px 0 0;font-size:15px;line-height:1.25;font-weight:600;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
@media (max-width:380px){ .top .me{width:62px;height:62px} .brand h1{font-size:23px} }
.points{
  background:var(--moss);color:#fff;border-radius:999px;
  padding:8px 16px;font-family:var(--display);font-weight:800;font-size:22px;
  line-height:1;text-align:center;flex:none;
}
.points small{display:block;font-family:var(--body);font-weight:600;font-size:11px;opacity:.85;margin-top:3px}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:22px 0 14px;
  background:var(--paper);border:1px solid var(--line);padding:5px;border-radius:16px}
.tab{
  border:0;background:transparent;border-radius:12px;padding:10px 4px;
  font-weight:600;color:var(--muted);
}
.tab[aria-selected="true"]{background:var(--moss);color:#fff}

/* Panel */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 18px 6px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:22px}
.panel-head span{font-size:14px;color:var(--muted)}
.quests{list-style:none;margin:8px 0 0;padding:0}
.quest{
  display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;
  padding:16px 0;border-top:1px solid var(--line);
}
.quest:first-child{border-top:0}
.q-title{font-weight:600}
.q-meta{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:14px;color:var(--muted)}
.pts{background:var(--sun-soft);color:#6B4A00;border-radius:999px;padding:1px 10px;font-weight:600;font-size:13px}
.btn{
  border:2px solid var(--moss);background:var(--paper);color:var(--moss-dark);
  border-radius:12px;padding:9px 16px;font-weight:600;min-width:96px;
  transition:transform .08s ease,background .15s ease;
}
.btn:hover{background:#E6F0DC}
.btn:active{transform:scale(.96)}
.btn.solid{background:var(--moss);color:#fff}
.btn.solid:hover{background:var(--moss-dark)}
.quest.done .btn{background:var(--moss);color:#fff}
.quest.done .q-title{color:var(--muted)}
.bar{grid-column:1/-1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .3s ease}
.auto{font-size:13px;color:var(--muted);min-width:96px;text-align:right}
.badge{width:1.1em;height:1.1em;vertical-align:-.2em;margin-right:5px}
.note{margin:18px 4px 0;font-size:14px;color:var(--muted);text-align:center}

/* Avatar editor */
.editor h2{font-size:34px;font-weight:800;color:var(--moss-dark);margin-top:18px}
.editor > p{color:var(--muted);margin:8px 0 16px}
.stage{
  position:sticky;top:8px;z-index:4;height:300px;
  background:linear-gradient(#DDF0FA,#EEF6E2);
  border:2px solid var(--paper);border-radius:22px;
  box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(30,64,41,.12);
  display:flex;justify-content:center;overflow:hidden;
}
.stage canvas{height:100%;width:auto;aspect-ratio:1;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage svg{height:100%;width:auto;aspect-ratio:1}
.stage .hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--muted)}
.nameplate{
  position:absolute;left:10px;top:10px;max-width:calc(100% - 130px);
  background:rgba(252,254,249,.9);border:1px solid var(--line);border-radius:12px;padding:6px 12px;
}
.nameplate b{display:block;font-family:var(--display);font-size:18px;line-height:1.15;color:var(--moss-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nameplate span{display:block;font-size:13px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage .rand{
  position:absolute;right:10px;top:10px;min-width:0;padding:6px 12px;font-size:14px;border-width:2px;
}
.group{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px 16px 6px;margin-top:14px}
.group > h3{font-size:20px;margin-bottom:6px}
.row{margin:0 0 14px}
.row-label{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 8px}
.swatches,.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{
  position:relative;width:40px;height:40px;border-radius:50%;padding:0;
  border:3px solid var(--paper);box-shadow:0 0 0 1px #B9C6AE;
}
.sw[aria-pressed="true"],.sw.custom.active{box-shadow:0 0 0 3px var(--moss)}
.sw.custom{
  display:block;cursor:pointer;
  background:conic-gradient(#e44,#ec4,#4c6,#4ad,#a5e,#e44);
}
.sw.custom::after{
  content:"+";position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.sw.custom.active::after{content:""}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw.custom:focus-within{outline:3px solid var(--moss);outline-offset:2px}
.chip{
  border:2px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;
}
.chip[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#fff}
.editor .done,.welcome .done{width:100%;margin-top:18px;padding:14px;font-size:18px}
.welcome > .wordmark{
  margin:18px 0 0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-0.01em;
  color:var(--moss);
}
.welcome h2{font-size:34px;font-weight:800;color:var(--moss-dark);margin-top:4px}
.welcome > p{color:var(--muted);margin:8px 0 22px}
.welcome form{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}
.text{
  width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--field);
  border:2px solid var(--line);border-radius:12px;padding:12px 14px;
}
.text:focus{outline:3px solid var(--moss);outline-offset:1px;border-color:var(--moss)}
.text[aria-invalid="true"]{border-color:#B3261E}
.err{margin:8px 0 0;min-height:1.4em;font-size:14px;color:#B3261E;font-weight:600}

/* Locker */
.locker-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.locker-top h2{flex:1;font-size:30px;font-weight:800;color:var(--moss-dark)}
.backlink{background:none;border:0;color:var(--moss-dark);font-weight:600;padding:6px 4px;font-size:16px}
.locker-top .points{font-size:20px;padding:6px 14px}
.dock{position:sticky;top:8px;z-index:4;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.shop .dock .stage{height:170px}
.np{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);
  border-radius:18px;padding:8px 12px;box-shadow:0 6px 16px rgba(30,64,41,.1);
}
.np .me{width:56px;height:56px;padding:4px}
.np-txt{min-width:0}
.np-txt b{display:block;font-family:var(--display);font-size:19px;line-height:1.15;color:var(--moss-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-txt span{display:block;font-size:14px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .stage{position:relative;top:auto;height:200px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .chip{flex:none;white-space:nowrap}
.cat-note{margin:6px 2px 0;font-size:14px;color:var(--muted)}
.items{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.items.one{grid-template-columns:1fr}
.item{
  background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px;
  display:flex;flex-direction:column;gap:8px;
}
.item.equipped{border-color:var(--moss)}
.item.row{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.item-name{display:block;font-family:var(--display);font-size:17px;line-height:1.2}
.item-meta{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.item .btn{width:100%;min-width:0;padding:8px 10px;font-size:15px}
.item.row .btn{width:auto;min-width:120px;flex:none}
.item .btn:disabled:not(.solid){opacity:.55;cursor:not-allowed}
.item .btn.solid:disabled{opacity:1;cursor:default}
/* Activities and My Walks */
.q-meta{flex-wrap:wrap;gap:4px 10px}
.q-meta span{white-space:nowrap}
.gps-tag{display:inline-block;padding:1px 8px;border-radius:999px;background:#DDF0D0;color:#1F5A2B;font-size:12px;font-weight:700}
.activity-banner{
  width:100%;margin-top:12px;display:flex;align-items:center;gap:10px;text-align:left;
  background:var(--sun);color:#3a2800;border:2px solid #B9801A;border-radius:16px;padding:10px 14px;font-weight:700;
}
.activity-banner .ab-txt{flex:1}
.activity-banner .chev{font-size:24px;line-height:1}
.rec{width:12px;height:12px;border-radius:50%;background:#E0312B;flex:none;animation:recpulse 1.4s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.rec{animation:none}}
.act-title{font-family:var(--display);font-size:22px;line-height:1.2;color:var(--moss-dark);margin:2px 2px 8px}
.gps-chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;background:var(--sun-soft);color:#6B4A00}
.gps-chip::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.gps-chip[data-s="good"]{background:#DDF0D0;color:#1F5A2B}
.gps-chip[data-s="denied"],.gps-chip[data-s="unsupported"]{background:#FBE0DD;color:#8A1F17}
.route-map{margin-top:12px;border-radius:20px;overflow:hidden;border:2px solid var(--moss);background:var(--paper);aspect-ratio:4/3}
.route-map canvas{width:100%;height:100%;display:block}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats3 > div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.stats3 small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.stats3 b{display:block;font-family:var(--display);font-size:22px;line-height:1.2;color:var(--moss-dark)}
.goal{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.goal-row{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.goal-row:not(:first-child){margin-top:12px}
.goal .bar{margin-top:6px}
.act-btns{display:grid;gap:10px;margin-top:16px}
.act-btns .btn{width:100%;padding:13px;font-size:18px}
.wide-btn{width:100%;margin-top:12px;padding:13px;font-size:18px}
.check-list{margin:0;padding-left:20px;font-weight:600}
.check-list li + li{margin-top:6px}
.result{margin-top:4px;padding:12px 14px;border-radius:16px;background:var(--sun-soft);border:1px solid var(--sun);color:#4A3200;display:flex;justify-content:space-between;align-items:center;gap:10px}
.result b{font-family:var(--display);font-size:20px}
.result.ok{background:#DDF0D0;border-color:#7CC35A;color:#1F5A2B}
.mini-route{flex:none;width:64px;height:64px;border-radius:14px;overflow:hidden;border:2px solid var(--moss)}
.mini-route canvas{width:100%;height:100%;display:block}
.walk-row .f-txt span{white-space:normal}
.map-key{display:flex;align-items:center;gap:6px;margin:8px 4px 0}
.kdot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.kdot.k1{background:#3E8E5A}
.kdot.k2{background:#E8446B;margin-left:10px}
/* Shop: try on and cart */
.item-btns{display:grid;gap:8px}
.item.row .item-btns{flex:none;min-width:150px}
.item .btn[data-act="try"][aria-pressed="true"]{background:var(--sun);border-color:#B9801A;color:#3a2800}
.item.trying{border-color:var(--sun)}
.item.carted{border-color:var(--moss);box-shadow:0 0 0 2px var(--sun-soft)}
.try-bar{min-width:0;display:flex;align-items:center;gap:10px;background:var(--sun-soft);border:1px solid var(--sun);border-radius:14px;padding:6px 6px 6px 12px;font-size:14px;color:#4A3200}
.try-bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.try-bar .btn{flex:none;min-width:0;padding:5px 12px;font-size:14px;border-color:#B9801A;background:var(--paper)}
.cart-bar{
  position:sticky;bottom:10px;z-index:6;margin-top:18px;display:flex;align-items:center;gap:8px;
  background:var(--moss-dark);color:#fff;border-radius:18px;padding:10px 10px 10px 14px;
  box-shadow:0 8px 24px rgba(20,44,28,.35);
}
.cart-txt{flex:1;min-width:0;line-height:1.25}
.cart-txt b{display:block;font-family:var(--display);font-size:17px}
.cart-txt span{display:block;font-size:13px;opacity:.9}
.cart-bar .btn{flex:none;min-width:0;padding:8px 12px;font-size:15px}
.cart-bar .btn.clear{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.cart-bar .btn.buy{background:var(--sun);border-color:var(--sun);color:#3a2800;font-weight:800}
.cart-bar .btn.buy:disabled{opacity:.55;cursor:not-allowed}
.thumb{
  aspect-ratio:1;border-radius:12px;overflow:hidden;background:linear-gradient(#DDF0FA,#EEF6E2);
}
.thumb canvas{width:100%;height:100%}
.thumb-fallback{display:grid;place-items:center;text-align:center;padding:8px;font-weight:600;color:var(--muted)}
.ring-sample{width:84px;height:84px;margin:4px auto 0;padding:6px}

/* Quest timers */
.btn.timer{background:var(--sun-soft);border-color:var(--sun);color:#6B4A00;font-variant-numeric:tabular-nums;opacity:1}
.btn.timer:disabled{cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}
/* Challenges */
.pick{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:600}
.pick input{width:22px;height:22px;accent-color:var(--moss)}
.chal-form .row-label{margin-top:18px}
.chal-form .row-label:first-child{margin-top:4px}
.chal-form .text{font-size:16px;text-transform:none}
.range{width:100%;accent-color:var(--moss);height:36px}
.prizes{margin:4px 2px 0;font-size:14px;font-weight:600;color:var(--muted)}
.chal-form .go{width:100%;margin-top:10px;padding:14px;font-size:18px}
.chal-sum{display:flex;justify-content:space-between;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.chal-sum b{font-family:var(--display);font-size:20px;color:var(--moss-dark)}
.chal-sum span{color:var(--muted);font-weight:600;font-size:14px}
.challenge .prizes{margin:10px 2px 12px}
.stand{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.stand.mine{border:2px solid var(--moss)}
.place{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sun-soft);color:#6B4A00;font:800 17px/34px var(--display);text-align:center}
.stand .pts{flex:none}
/* Friends */
.locker-btn + .locker-btn{margin-top:10px}
.event-banner{margin-top:16px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#FFE9A8,#FFD166);border:2px solid var(--sun);border-radius:16px;padding:10px 14px;color:#4A3200}
.event-banner b{font-family:var(--display);font-size:20px}
.event-banner span{font-size:14px;font-weight:600}
.event-banner + .locker-btn{margin-top:10px}
.pts.bonus{background:var(--sun);color:#3a2800}
.admin .group{margin-top:14px}
.admin select{font:inherit;font-size:16px}
.admin .btn.big{width:100%;margin-top:10px;padding:14px;font-size:18px}
.acct-line{margin:6px 4px 0;text-align:center;font-size:14px;color:var(--muted)}
.seg{display:flex;gap:4px;padding:4px;margin-top:12px;background:var(--paper);border:2px solid var(--moss);border-radius:14px}
.seg-btn{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.seg-btn[aria-pressed="true"]{background:var(--moss);color:#fff}
.map-credit a{color:var(--moss);font-weight:700}
.seg+.map-credit{margin:6px 2px 0}
.seg+.map-credit+.route-map,.seg+.route-map{margin-top:8px}

.hunt-intro{margin:6px 0 0;color:var(--muted);font-size:15px}
.hunt-list{display:grid;gap:10px;margin-top:12px}
.hunt-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px;cursor:pointer}
.hunt-card img,.hunt-card .hph{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.hc-txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.hc-txt b{font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.hc-txt small{color:var(--muted);font-size:13px}
.hchip{display:inline-block;align-self:flex-start;background:var(--line);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}
.hchip.found{background:#D6F0DC;color:#1E4029}.hchip.wait{background:var(--sun-soft);color:#6B4A00}.hchip.wrong{background:#FBE0DD;color:#8C1D14}
.hchip-row{margin:10px 0 0}
.hunt-big{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:18px;border:2px solid var(--moss);background:#111;margin-top:12px}
.hunt-big.ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.hunt-big.ph img.blur{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(8px);opacity:.6}
.hunt-big.ph span{position:relative;background:rgba(255,255,255,.88);padding:4px 12px;border-radius:10px}
.hunt-hint{font-size:18px;font-weight:700;margin:10px 2px 0;overflow-wrap:anywhere}
.hunt-by{margin:4px 2px 0;color:var(--muted)}
.hsub{margin:18px 0 0}
.thread{display:grid;gap:12px;margin-top:10px}
.reply{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px}
.reply img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.reply.mine{display:block}
.reply.mine img.hunt-big{width:100%;height:auto;border-radius:18px;margin-top:8px}
.rtxt{display:flex;flex-direction:column;gap:2px}
.verdict{display:block;font-weight:700;font-size:14.5px;margin-top:6px}
.verdict.right{color:#1E6B34}.verdict.wrong{color:#B3261E}.verdict.wait{color:#6B4A00}
.ask{margin:12px 0 6px;font-weight:700;font-size:16px}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hunt-rules{margin:10px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.agree{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-weight:600;font-size:15px}
.agree input{margin-top:3px;width:20px;height:20px;flex:none}
.pick{display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.ttt .seg-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:6px 2px}
.ttt .seg-btn small{font-weight:600;font-size:11.5px;opacity:.85}
.ttt .btn.wide{width:100%;margin-top:12px;text-align:center;padding:13px;font-size:17px}
.room-code{font-family:var(--display);font-weight:800;font-size:56px;letter-spacing:.18em;text-align:center;color:var(--moss-dark);background:var(--sun-soft);border-radius:18px;padding:12px 0 12px .18em;margin:10px 0}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-weight:800;font-size:22px;text-align:center}
.ttt-names{display:grid;gap:8px;margin-top:8px}
.ttt-names label{display:flex;align-items:center;gap:10px}
.ttt-names .text{flex:1;min-width:0}
.mk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;flex:none}
.mk.x{background:#E8446B}.mk.o{background:#3A86FF}
.chip-gps{display:inline-block;margin:10px 0 0;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px;background:var(--line);color:var(--ink)}
.chip-gps.good{background:#D6F0DC;color:#1E4029}.chip-gps.weak,.chip-gps.wait{background:var(--sun-soft);color:#6B4A00}.chip-gps.bad{background:#FBE0DD;color:#8C1D14}
.ttt-turn{display:flex;align-items:center;gap:12px;margin-top:8px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:18px}
.ttt-turn b{display:block;font-size:18px}.ttt-turn small{display:block;color:var(--muted);font-size:13.5px}
.ttt-turn.over{justify-content:center;font-family:var(--display);font-size:24px;font-weight:800;color:var(--moss-dark);background:var(--sun-soft)}
.ttt-board{margin-top:10px;border-radius:20px;overflow:hidden;border:2px solid var(--moss);aspect-ratio:1/1}
.ttt-board canvas{width:100%;height:100%;display:block;touch-action:manipulation}
.ttt-score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.ttt-score>div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ttt-score b{font-family:var(--display);font-size:24px;line-height:1.1;color:var(--moss-dark)}
.ttt-score small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ttt-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fine{font-size:13px;color:var(--muted);margin:12px 0 0}
.account .group p{margin:8px 0 12px}
.hunts .btn.wide,.account .btn.wide{width:100%;margin-top:10px;text-align:center;padding:13px;font-size:17px}
.account .stat{font-family:var(--display);font-size:18px;color:var(--moss-dark);margin:0 0 4px}
.admin .stat{font-family:var(--display);font-size:22px;color:var(--moss-dark)}
.tag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;background:var(--sun);color:#3a2800;font:700 11px/18px var(--body);vertical-align:2px;text-transform:uppercase;letter-spacing:.04em}
.friends .locker-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.friends .locker-top .backlink{justify-self:start}
.friends .locker-top h2{flex:none;text-align:center}
.count-badge{
  flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:999px;
  background:#E0312B;color:#fff;font:800 13px/22px var(--display);text-align:center;
  box-shadow:0 0 0 2px var(--paper);
}
.demo-note{margin:0 0 12px;padding:8px 12px;border-radius:12px;background:var(--sun-soft);color:#6B4A00;font-size:14px;font-weight:600}
.code-card{background:var(--paper);border:2px solid var(--moss);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.code-card > div{flex:1;min-width:0}
.code-card small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.code-card b{display:block;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:28px;letter-spacing:.08em;color:var(--moss-dark)}
.code-card .btn{min-width:0;padding:8px 14px}
.add-friend{display:flex;gap:8px;margin-top:12px}
.add-friend .text{flex:1;min-width:0;font-size:16px;text-transform:uppercase}
.add-friend .btn{min-width:0}
.pending-btn{margin-top:12px}
.sec-title{font-size:20px;margin:20px 2px 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec-title span{font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted)}
.flist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.fbtn,.freq{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:8px 12px;
}
.fbtn:hover{background:#E6F0DC}
.fbtn .me,.freq .me{width:56px;height:56px;padding:4px}
.f-txt{flex:1;min-width:0}
.f-txt b{display:block;font-family:var(--display);font-size:19px;line-height:1.15;color:var(--moss-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-txt span{display:block;font-size:14px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.freq .btn{min-width:0;padding:7px 12px;font-size:15px}
.freq .acts{display:flex;gap:6px;flex:none}
.empty{color:var(--muted);text-align:center;padding:18px 8px;background:var(--paper);border:1px dashed var(--line);border-radius:16px}
.profile{text-align:center}
.profile .stage{position:relative;top:auto;height:300px}
.profile .big-name{font-family:var(--display);font-size:30px;font-weight:800;color:var(--moss-dark);margin-top:14px}
.profile .big-title{font-size:16px;font-weight:600;color:var(--muted);margin-top:2px}
.profile .facts{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.fpts{flex:none;font-family:var(--display);font-size:15px;padding:3px 12px}
.profile .facts .fpts{background:var(--sun-soft);color:#6B4A00;border:1px solid var(--sun);font-size:15px;font-weight:700}
.profile .facts span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.pbtns{display:grid;gap:12px;justify-items:center;margin-top:20px}
.pbtns .btn{min-width:200px}
.pbtns .btn.solid{margin-top:0}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;
  transition:transform .25s ease,opacity .25s ease;pointer-events:none;z-index:9;
}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}

<body>
<div class="sky" aria-hidden="true"></div>
<div class="wrap">
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Avatar options ---------- */
const OPTS = {
  skin:[["Porcelain","#F8DCC6"],["Fair","#F0C6A1"],["Sand","#D9A27C"],["Olive","#BF9266"],
        ["Tan","#C68B5E"],["Brown","#9A6340"],["Deep","#6B4028"],["Ebony","#4A2C1E"]],
  hairColor:[["Black","#1A1210"],["Dark brown","#3B2415"],["Brown","#6B4423"],["Auburn","#8A3B1F"],
        ["Ginger","#C8601E"],["Blonde","#D9A441"],["Platinum","#EDE3C0"],["Grey","#A9A9AD"],
        ["Blue","#3B6FD6"],["Pink","#E86AA6"],["Green","#3E9E5A"],["Purple","#7A4FC8"]],
  eyeColor:[["Brown","#4B2E1E"],["Hazel","#8A6A2F"],["Green","#3E9E5A"],["Blue","#3B7BD6"],
        ["Grey","#7C8794"],["Violet","#8A4FC8"]],
  shirt:[["Red","#D64545"],["Orange","#E8742B"],["Yellow","#F2C12E"],["Green","#4FA36A"],
        ["Teal","#2F9AA0"],["Blue","#3B6FB6"],["Navy","#26365A"],["Purple","#7A4FC8"],
        ["Pink","#E86AA6"],["White","#F4F4F0"],["Grey","#6B7280"],["Black","#26282C"]],
  pants:[["Navy","#2B3A55"],["Black","#26282C"],["Grey","#59606B"],["Khaki","#C9A66B"],
        ["Brown","#6B4A2F"],["Olive","#5C6B3A"],["Denim","#4A6FA5"],["Maroon","#7A2B3A"]],
  shoes:[["White","#F0F0F0"],["Black","#26282C"],["Brown","#5A3E2B"],["Red","#D64545"],
        ["Blue","#3B6FD6"],["Green","#3E8E5A"],["Yellow","#F2C12E"],["Pink","#F08AB5"]]
};
const HAIR_TYPES = [["short","Short"],["curly","Curly"],["bun","Bun"],["long","Long"],["ponytail","Ponytail"],["buzz","Buzz"],["bald","Bald"]];
const EYE_TYPES  = [["round","Round"],["wide","Wide"],["happy","Happy"],["sleepy","Sleepy"],["sparkle","Sparkle"]];
/* ---------- Locker items: [id, name, cost in points]. Cost 0 means everyone has it. ---------- */
const CATS = [
  { key:"titles",  label:"Titles",         slot:"title"   },
  { key:"glasses", label:"Glasses",        slot:"glasses" },
  { key:"shirts",  label:"Shirts",         slot:"shirt"   },
  { key:"pants",   label:"Pants",          slot:"pants"   },
  { key:"hats",    label:"Hats",           slot:"hat"     },
  { key:"borders", label:"Profile border", slot:"border"  }
];
const CATALOG = {
  titles:[ ["since","Touching Grass since",0], ["rookie","Rookie Explorer",0], ["sprout","Sprout",50],
           ["fresh","Fresh Air Fan",75], ["trail","Trail Walker",100], ["sun","Sun Chaser",150],
           ["leaf","Leaf Spotter",150], ["dodger","Screen Dodger",250], ["grass","Grass Toucher",400],
           ["fall2026","Fall 2026 Finisher",-1],
           ["trailblazer","Trailblazer",300,"shop"], ["legend","Outdoor Legend",650,"shop"] ], // -1 means it can't be bought, only earned in the season
  glasses:[ ["none","No glasses",0], ["round","Round specs",60], ["square","Square frames",60],
            ["shades","Sunglasses",120], ["neon","Neon shades",200],
            ["goggles","Aviator goggles",200,"shop"], ["visor","Cyber visor",300,"shop"] ],
  shirts:[ ["tee","T-shirt",0], ["long","Long sleeve",80], ["striped","Striped tee",120],
           ["hoodie","Hoodie",200], ["vest","Explorer vest",250],
           ["cape","Hero cape",350,"shop"] ],
  pants:[ ["long","Long pants",0], ["shorts","Shorts",60], ["cargo","Cargo pants",120], ["overalls","Overalls",220],
         ["track","Track pants",250,"shop"] ],
  hats:[ ["none","No hat",0], ["cap","Cap",80], ["beanie","Beanie",100], ["bucket","Bucket hat",140], ["sun","Sun hat",180],
         ["headphones","Headphones",180,"shop"], ["wizard","Wizard hat",280,"shop"], ["crown","Gold crown",500,"shop"] ],
  borders:[ ["moss","Moss",0], ["sun","Sunshine",100], ["sky","Sky",100], ["leafy","Leafy",200],
            ["sunset","Sunset",300], ["rainbow","Rainbow",500],
            ["inferno","Inferno",350,"shop"], ["galaxy","Galaxy",450,"shop"], ["gold","Pure gold",650,"shop"] ]
};
const DEFAULT_GEAR = { glasses:"none", shirt:"tee", pants:"long", hat:"none", border:"moss" };
const BORDER_CSS = {
  moss:"#2E5E3E", sun:"#F5B82E", sky:"#3FA0E8",
  leafy:"repeating-conic-gradient(#2E5E3E 0 12deg,#7CC35A 12deg 24deg)",
  sunset:"linear-gradient(135deg,#FF8A3D,#E8446B,#7A4FC8)",
  rainbow:"conic-gradient(#ff4d4d,#ffb84d,#f2ee4d,#4dd35a,#4db8ff,#9a5dff,#ff4d4d)",
  inferno:"conic-gradient(#FF3B1F,#FF9F1C,#FFE066,#FF9F1C,#FF3B1F,#C41E0E,#FF3B1F)",
  galaxy:"conic-gradient(#1B1464,#6A2FB8,#2D8CFF,#B84FD6,#1B1464,#0B0A3A,#1B1464)",
  gold:"conic-gradient(#8A6A1F,#F5D76E,#B8892B,#FFF1A8,#8A6A1F,#D9B24A,#8A6A1F)"
};
const ringBg = id => BORDER_CSS[id] || BORDER_CSS.moss;
const catByKey = key => CATS.find(c=>c.key===key);
const findItem = (catKey, id) => CATALOG[catKey].find(i=>i[0]===id);
// Titles are a cosmetic shown under the username. Everyone starts with "since": Touching Grass since <year joined>.
const titleName = id => {
  const it = findItem("titles", id);
  if(!it || id==="since") return `Touching Grass since ${state.joined || new Date().getFullYear()}`;
  return it[1];
};
const itemName = (catKey, id) => catKey==="titles" ? titleName(id) : (findItem(catKey,id)||[])[1] || id;
// Season champion titles show a gold badge next to the name.
const BADGE_TITLES = new Set(["fall2026","legend"]);
const BADGE_SVG = `<svg class="badge" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F5B82E" stroke="#B9801A" stroke-width="2"/><path d="M12 6.5l1.7 3.6 3.9.5-2.9 2.7.8 3.9L12 15.3 8.5 17.2l.8-3.9-2.9-2.7 3.9-.5z" fill="#fff"/></svg>`;
const titleHtml = id => (BADGE_TITLES.has(id) ? BADGE_SVG : "") + esc(titleName(id));
const GROUPS = [
  { title:"Body", rows:[ {key:"skin", label:"Skin color", kind:"color"} ] },
  { title:"Hair", rows:[ {key:"hairType", label:"Hair type", kind:"type", list:HAIR_TYPES},
                         {key:"hairColor", label:"Hair color", kind:"color"} ] },
  { title:"Eyes", rows:[ {key:"eyeType", label:"Eye type", kind:"type", list:EYE_TYPES},
                         {key:"eyeColor", label:"Eye color", kind:"color"} ] },
  { title:"Outfit", rows:[ {key:"shirt", label:"Shirt", kind:"color"},
                           {key:"pants", label:"Pants", kind:"color"},
                           {key:"shoes", label:"Shoes", kind:"color"} ] }
];
const DEFAULT_LOOK = {
  skin:"#C68B5E", hairType:"short", hairColor:"#3B2415",
  eyeType:"round", eyeColor:"#4B2E1E",
  shirt:"#4FA36A", pants:"#2B3A55", shoes:"#F0F0F0"
};
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 3D avatar (Three.js, built from simple shapes) ---------- */
let R=null, scene=null, camFull=null, camHead=null, avatarGroup=null, cams={};
// Shop try-on: items being previewed on the avatar. Never saved, and cleared when you leave the Shop.
let tryGear = {}, tryTitle = null;
function viewGear(){ return Object.assign(getGear(), tryGear); }

function mat(c){ return new THREE.MeshStandardMaterial({ color:c, roughness:.8, metalness:0 }); }
function part(geo, m, x, y, z){
  const o = new THREE.Mesh(geo, m); o.position.set(x||0, y||0, z||0); return o;
}

function addEyes(g, look){
  const iris = mat(look.eyeColor), dark = mat("#1F2A22"), white = mat("#FFFFFF");
  const arcColor = new THREE.Color(look.eyeColor).lerp(new THREE.Color("#1F2A22"), .55);
  for(const s of [-1,1]){
    const x = s*.125, y = 1.58, z = .325;
    const E = (geo, m, dx, dy, dz, sx, sy, sz)=>{
      const o = part(geo, m, x+dx, y+dy, z+dz); o.scale.set(sx,sy,sz); g.add(o); return o;
    };
    const ball = r => new THREE.SphereGeometry(r,14,12);
    switch(look.eyeType){
      case "wide":
        E(ball(.062), white, 0,0,0, 1,1.2,.55);
        E(ball(.042), iris, 0,0,.016, 1,1.2,.5);
        E(ball(.022), dark, 0,0,.027, 1,1.2,.5);
        E(ball(.013), white, .014,.02,.04, 1,1,.6);
        break;
      case "happy": {
        const arc = new THREE.Mesh(new THREE.TorusGeometry(.05,.014,8,16,Math.PI), mat(arcColor.getStyle()));
        arc.position.set(x, y-.015, z+.012); g.add(arc);
        break; }
      case "sleepy":
        E(ball(.05), iris, 0,-.004,0, 1,.55,.6);
        E(ball(.026), dark, 0,-.004,.012, 1,.6,.5);
        E(new THREE.BoxGeometry(.12,.02,.02), dark, 0,.024,.014, 1,1,1);
        break;
      case "sparkle":
        E(ball(.062), iris, 0,0,0, 1,1.25,.6);
        E(ball(.032), dark, 0,0,.016, 1,1.25,.5);
        E(ball(.02), white, .02,.028,.036, 1,1,.6);
        E(ball(.01), white, -.016,-.02,.034, 1,1,.6);
        break;
      default: // round
        E(ball(.05), iris, 0,0,0, 1,1.25,.6);
        E(ball(.028), dark, 0,0,.012, 1,1.25,.5);
        E(ball(.014), white, .014,.02,.03, 1,1,.6);
    }
  }
}

function addGlasses(g, kind){
  if(kind==="none") return;
  if(kind==="goggles"){
    const brass = mat("#B8862B");
    const lens = new THREE.MeshStandardMaterial({ color:"#F2B84B", roughness:.2, metalness:.2, transparent:true, opacity:.55 });
    for(const s of [-1,1]){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(.092,.024,10,26), brass);
      ring.position.set(s*.125,1.58,.372); g.add(ring);
      g.add(part(new THREE.CircleGeometry(.09,24), lens, s*.125,1.58,.372));
    }
    g.add(part(new THREE.BoxGeometry(.08,.03,.03), brass, 0,1.585,.372));
    // strap around the sides and back of the head, left open at the front
    const strap = new THREE.Mesh(new THREE.TorusGeometry(.372,.02,8,40,Math.PI*2-1.3), mat("#6B4A2F"));
    strap.rotation.x = Math.PI/2;
    const sg = new THREE.Group(); sg.rotation.y = -(.65+Math.PI/2); sg.position.y = 1.585; sg.add(strap); g.add(sg); // turn the gap to the front
    return;
  }
  if(kind==="visor"){
    const lens = new THREE.MeshStandardMaterial({ color:"#0B3A4A", emissive:"#19E3FF", emissiveIntensity:.7, roughness:.2, transparent:true, opacity:.6 });
    const frame = mat("#15181C");
    g.add(part(new THREE.BoxGeometry(.5,.11,.025), lens, 0,1.585,.374));
    g.add(part(new THREE.BoxGeometry(.52,.016,.03), frame, 0,1.645,.374));
    g.add(part(new THREE.BoxGeometry(.52,.016,.03), frame, 0,1.525,.374));
    for(const s of [-1,1]){
      const arm = part(new THREE.BoxGeometry(.014,.02,.374), frame, s*.3,1.585,.2);
      arm.rotation.y = -s*.4; g.add(arm);
    }
    return;
  }
  const round = kind==="round", dark = kind==="shades" || kind==="neon";
  const frame = mat(kind==="neon" ? "#FF3D9A" : kind==="shades" ? "#15181C" : "#26282C");
  const lens = new THREE.MeshStandardMaterial({
    color: kind==="neon" ? "#2B1A4A" : dark ? "#0F1114" : "#CFE8F5",
    roughness:.2, metalness:.1, transparent:!dark, opacity: dark ? 1 : .22
  });
  const y = 1.58, z = .375;
  for(const s of [-1,1]){
    const x = s*.125;
    if(round){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(.085,.013,8,26), frame);
      ring.position.set(x,y,z); g.add(ring);
      g.add(part(new THREE.CircleGeometry(.084,24), lens, x,y,z));
    } else {
      const w=.2, h=.15, t=.016;
      g.add(part(new THREE.BoxGeometry(w,t,t), frame, x,y+h/2,z));
      g.add(part(new THREE.BoxGeometry(w,t,t), frame, x,y-h/2,z));
      g.add(part(new THREE.BoxGeometry(t,h,t), frame, x-w/2,y,z));
      g.add(part(new THREE.BoxGeometry(t,h,t), frame, x+w/2,y,z));
      g.add(part(dark ? new THREE.BoxGeometry(w,h,.02) : new THREE.PlaneGeometry(w,h), lens, x,y,z));
    }
    // temple arm running back to the ear
    const arm = part(new THREE.BoxGeometry(.014,.014,.374), frame, s*.2825, y-.002, .2025);
    arm.rotation.y = -s*.4; g.add(arm);
  }
  g.add(part(new THREE.BoxGeometry(.08,.014,.014), frame, 0, y+(round?.02:.05), z));
}

function addHat(g, kind){
  if(kind==="none") return;
  if(kind==="crown"){
    const gold = new THREE.MeshStandardMaterial({ color:"#F2C12E", roughness:.3, metalness:.6, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(.27,.25,.13,24,1,true), gold, 0,1.9,0));
    for(let i=0;i<5;i++){
      const a = i/5*Math.PI*2;
      const sp = part(new THREE.ConeGeometry(.05,.15,10), gold, .27*Math.sin(a), 2.02, .27*Math.cos(a)); g.add(sp);
      g.add(part(new THREE.SphereGeometry(.022,8,6), mat(i%2?"#D64545":"#3B7BD6"), .27*Math.sin(a), 2.11, .27*Math.cos(a)));
    }
    const velvet = part(new THREE.SphereGeometry(.25,18,10,0,Math.PI*2,0,Math.PI/2), mat("#8A1F3A"), 0,1.9,0);
    velvet.scale.y = .55; g.add(velvet);
  }
  if(kind==="wizard"){
    const pm = mat("#5B3FA8");
    g.add(part(new THREE.ConeGeometry(.37,.75,26), pm, 0,2.12,-.02));
    const brimMat = new THREE.MeshStandardMaterial({ color:"#5B3FA8", roughness:.8, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(.62,.62,.04,32), brimMat, 0,1.75,0));
    const band = new THREE.Mesh(new THREE.TorusGeometry(.375,.03,8,32), mat("#F2C12E"));
    band.rotation.x = Math.PI/2; band.position.set(0,1.79,0); g.add(band);
    for(const [x,y,z] of [[.0,2.0,.3],[.14,2.2,.2],[-.1,2.3,.12]])
      g.add(part(new THREE.SphereGeometry(.03,8,6), mat("#F2C12E"), x,y,z));
  }
  if(kind==="headphones"){
    const band = new THREE.Mesh(new THREE.TorusGeometry(.405,.024,8,32,Math.PI), mat("#26282C"));
    band.position.set(0,1.55,0); g.add(band);
    for(const s of [-1,1]){
      const cup = part(new THREE.CylinderGeometry(.11,.11,.09,20), mat("#FF3D9A"), s*.4,1.54,0);
      cup.rotation.z = Math.PI/2; g.add(cup);
      const pad = part(new THREE.CylinderGeometry(.1,.1,.03,20), mat("#26282C"), s*.36,1.54,0);
      pad.rotation.z = Math.PI/2; g.add(pad);
    }
  }
  if(kind==="cap"){
    // The dome sits just outside the head (radius .385 vs .36) and its front rim clears the eyes.
    const cm = mat("#D64545");
    const cg = new THREE.Group(); cg.position.set(0,1.644,0); cg.rotation.x = -.12;

function buildHuman(look, gear){
  gear = Object.assign({}, DEFAULT_GEAR, gear || {});
  const g = new THREE.Group();
  const skin = mat(look.skin), hair = mat(look.hairColor), top = mat(look.shirt),
        bot = mat(look.pants), shoe = mat(look.shoes);
  const hsl = {}; new THREE.Color(look.shirt).getHSL(hsl);
  const pantsLight = {}; new THREE.Color(look.pants).getHSL(pantsLight);
  const darkPants = mat(new THREE.Color(look.pants).multiplyScalar(.78).getStyle());
  const darkShirt = mat(new THREE.Color(look.shirt).multiplyScalar(.8).getStyle());

  // Ground shadow
  const sh = new THREE.Mesh(new THREE.CircleGeometry(.55, 28),
    new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:.14 }));
  sh.rotation.x = -Math.PI/2; sh.position.y = .005; g.add(sh);

  // Legs and shoes
  for(const s of [-1,1]){
    const leg = new THREE.Group(); leg.position.set(s*.13, .62, 0);
    if(gear.pants==="shorts"){
      leg.add(part(new THREE.CylinderGeometry(.095,.09,.5,14), skin, 0,-.25,0));
      leg.add(part(new THREE.CylinderGeometry(.126,.12,.27,14), bot, 0,-.135,0));
    } else {
      leg.add(part(new THREE.CylinderGeometry(.118,.108,.5,14), bot, 0,-.25,0));
    }
    if(gear.pants==="track"){
      const st = part(new THREE.BoxGeometry(.014,.5,.06), mat(pantsLight.l>.55 ? "#26282C" : "#FFFFFF"), s*.112,-.25,0);
      leg.add(st);
    }
    if(gear.pants==="cargo"){
      const pocket = part(new THREE.BoxGeometry(.09,.15,.03), darkPants, s*.093,-.17,.091);
      pocket.rotation.y = s*.8; leg.add(pocket);
      leg.add(part(new THREE.CylinderGeometry(.112,.112,.05,14), darkPants, 0,-.465,0));
    }
    const foot = part(new THREE.SphereGeometry(.12,16,12), shoe, 0,-.53,.05);
    foot.scale.set(1,.65,1.6); leg.add(foot);
    g.add(leg);
  }

  // Hips and torso (shirt styles change the torso, sleeves and extras)
  g.add(part(new THREE.CylinderGeometry(.27,.27,.22,22), bot, 0,.61,0)); // stays inside the shirt above the hem
  const hood = gear.shirt==="hoodie", longSleeve = gear.shirt==="long" || hood;
  const k = hood ? 1.07 : 1;
  const rAt = y => (.29 - (y-.59)*(.04/.62)) * k;
  g.add(part(new THREE.CylinderGeometry(.25*k,.29*k,.62,22), top, 0,.9,0));
  if(gear.shirt==="striped"){
    const stripe = mat(hsl.l > .6 ? "#26365A" : "#FFFFFF");
    for(const y of [.68,.82,.96,1.1]){
      g.add(part(new THREE.CylinderGeometry(rAt(y+.03)+.004, rAt(y-.03)+.004, .06, 22), stripe, 0,y,0));
    }
  }
  if(gear.shirt==="vest"){
    const vm = new THREE.MeshStandardMaterial({ color:"#B8A06A", roughness:.85, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(rAt(1.17)+.016, rAt(.62)+.016, .56, 24, 1, true, .3, Math.PI*2-.6), vm, 0,.895,0));
    const pk = mat("#8F7A48");
    for(const s of [-1,1]) g.add(part(new THREE.BoxGeometry(.1,.1,.03), pk, s*.14,.78,rAt(.78)+.03));
  }
  if(gear.shirt==="cape"){
    const cp = new THREE.MeshStandardMaterial({ color:"#C0392B", roughness:.7, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(.31,.42,.82,20,1,true,Math.PI-1.05,2.1), cp, 0,.82,0));
    const cl = part(new THREE.TorusGeometry(.15,.04,8,20), cp, 0,1.215,.02); cl.rotation.x = Math.PI/2; g.add(cl);
    g.add(part(new THREE.SphereGeometry(.036,10,8), mat("#F2C12E"), 0,1.19,.262));
  }
  if(hood){
    const collar = part(new THREE.TorusGeometry(.15,.05,8,20), top, 0,1.215,.02);
    collar.rotation.x = Math.PI/2; g.add(collar);
    const hd = part(new THREE.SphereGeometry(.19,16,12), top, 0,1.2,-.2);
    hd.scale.set(1.25,.95,.7); g.add(hd);
    for(const s of [-1,1]) g.add(part(new THREE.CylinderGeometry(.009,.009,.16,6), mat("#FFFFFF"), s*.05,1.1,rAt(1.1)+.008));
    g.add(part(new THREE.BoxGeometry(.3,.13,.03), darkShirt, 0,.74,rAt(.74)+.012));
  }
  if(gear.pants==="overalls"){
    g.add(part(new THREE.BoxGeometry(.34,.3,.04), bot, 0,.96,rAt(.96)+.012));
    const btn = mat("#F2C12E");
    for(const s of [-1,1]){
      g.add(part(new THREE.BoxGeometry(.06,.22,.03), bot, s*.13,1.12,rAt(1.12)+.01));
      g.add(part(new THREE.BoxGeometry(.06,.22,.03), bot, s*.13,1.0,-(rAt(1.0)+.01)));
      g.add(part(new THREE.BoxGeometry(.06,.03,.5), bot, s*.13,1.225,0));
      g.add(part(new THREE.SphereGeometry(.024,10,8), btn, s*.13,1.09,rAt(1.09)+.03));
    }
  }

  // Neck
  g.add(part(new THREE.CylinderGeometry(.1,.11,.16,14), skin, 0,1.25,0));

  // Arms
  const sleeveL = longSleeve ? .46 : .2, sleeveR = hood ? 1.1 : 1;
  for(const s of [-1,1]){
    g.add(part(new THREE.SphereGeometry(.105*k,14,12), top, s*.3*k,1.12,0));
    const arm = new THREE.Group(); arm.position.set(s*.32*k,1.13,0); arm.rotation.z = s*.12;
    arm.add(part(new THREE.CylinderGeometry(.07,.065,.5,12), skin, 0,-.28,0));
    arm.add(part(new THREE.CylinderGeometry(.088*sleeveR,.082*sleeveR,sleeveL,12), top, 0,-sleeveL/2,0));
    arm.add(part(new THREE.SphereGeometry(.08,14,12), skin, 0,-.55,0));
    g.add(arm);
  }

  // Head, ears, nose, cheeks, smile
  const head = part(new THREE.SphereGeometry(.36,32,24), skin, 0,1.55,0);
  head.scale.set(1,1.04,1); g.add(head);
  const blush = new THREE.Color(look.skin).lerp(new THREE.Color("#D9534F"), .35);
  for(const s of [-1,1]){
    const ear = part(new THREE.SphereGeometry(.07,12,10), skin, s*.36,1.54,0);
    ear.scale.set(.5,1,.8); g.add(ear);
    const ch = part(new THREE.SphereGeometry(.055,10,8), mat(blush), s*.2,1.48,.285);
    ch.scale.set(1,.7,.35); g.add(ch);
  }
  const nose = part(new THREE.SphereGeometry(.045,10,8), skin, 0,1.52,.35);
  nose.scale.set(1,.9,.9); g.add(nose);
  const smile = new THREE.Mesh(new THREE.TorusGeometry(.06,.013,8,20,Math.PI), mat("#5A2A25"));
  smile.rotation.z = Math.PI; smile.position.set(0,1.48,.35); g.add(smile);

  addEyes(g, look);
  addGlasses(g, gear.glasses);

  // Hair (the top of the hair is hidden under hats)
  const hatOn = gear.hat !== "none";
  const t = look.hairType;
  if(t!=="bald"){
    const hg = new THREE.Group(); hg.position.set(0,1.56,-.01); hg.rotation.x = -.45;
    const buzz = t==="buzz";
    hg.add(new THREE.Mesh(
      new THREE.SphereGeometry(buzz?.372:.385,28,16,0,Math.PI*2,0,Math.PI*(buzz?.44:.5)), hair));
    if(t==="short" && !hatOn){
      const f = part(new THREE.SphereGeometry(.15,16,12), hair, .05,1.69,.26);
      f.scale.set(1.5,.45,.8); f.rotation.z = .1; g.add(f);
    }
    if(t==="curly"){
      for(const [pol, n] of [[.25,1],[.7,6],[1.1,9],[1.3,10]]){
        if(hatOn && pol<1.2) continue;
        for(let i=0;i<n;i++){
          const az = n===1 ? 0 : (i/n)*Math.PI*2 + pol;
          const x = .37*Math.sin(pol)*Math.sin(az), y = .37*Math.cos(pol), z = .37*Math.sin(pol)*Math.cos(az);
          if(pol>.9 && z>.08) continue; // keep the face clear
          hg.add(part(new THREE.SphereGeometry(.13,12,10), hair, x,y,z));
        }
      }
    }
    if(t==="bun" && !hatOn) hg.add(part(new THREE.SphereGeometry(.15,16,12), hair, 0,.4,-.14));
    g.add(hg);
    if(t==="long"){
      const back = part(new THREE.SphereGeometry(.38,20,16), hair, 0,1.25,-.2);
      back.scale.set(1,1.6,.55); g.add(back);
    }
    if(t==="ponytail"){
      const tail = part(new THREE.SphereGeometry(.11,14,12), hair, 0,1.4,-.47);
      tail.scale.set(1,2.6,1); tail.rotation.x = -.25; g.add(tail);
      const band = new THREE.Mesh(new THREE.TorusGeometry(.075,.025,8,16), mat("#E86AA6"));
      band.position.set(0,1.62,-.4); band.rotation.x = Math.PI/2 - .5; g.add(band);
    }
  }
  addHat(g, gear.hat);
  return g;
}

function disposeGroup(g){
  g.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material) o.material.dispose();
  });
}
function setAvatar(){ // rebuilds the 3D avatar from the saved look and equipped items
  if(!HAS3D) return;
  if(avatarGroup){ scene.remove(avatarGroup); disposeGroup(avatarGroup); }
  avatarGroup = buildHuman(getLook(), viewGear());
  scene.add(avatarGroup);
}

    return true;
  }catch(e){ return false; }
}

/* Rotation: drag the full view to turn the avatar; it sways gently when left alone */
let userYaw = .3, swayAmp = 1, lastInteract = -1e9, drag = null;
function draw(t){
  if(!HAS3D || !avatarGroup) return;
  const views = document.querySelectorAll("canvas[data-avatar]");
  if(!views.length) return;
  const idle = !drag && t - lastInteract > 2000;
  swayAmp += ((idle?1:0) - swayAmp) * .06;
  views.forEach(cv=>{
    const headShot = cv.dataset.mode==="head";
    avatarGroup.rotation.y = headShot
      ? (REDUCED ? .2 : Math.sin(t/900)*.35)
      : userYaw + (REDUCED ? 0 : Math.sin(t/1400)*.5*swayAmp);
    avatarGroup.position.y = REDUCED ? 0 : Math.sin(t/450)*.012;
    R.render(scene, headShot ? camHead : camFull);
    const ctx = cv.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(R.domElement,0,0,cv.width,cv.height);
  });
}

const pad = n => String(n).padStart(2,"0");

function weekKey(){
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay()+6) % 7)); // Monday start

}
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function pick(pool,key,n){
  const r = rng(hash(key)), a = pool.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,n);
}

// New "sb_publishable_" keys are not JWTs, so they go in apikey only. Old anon keys also go in Authorization.
const sbHeaders = tok => {
  const h = { apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" };
  if(tok) h.Authorization = "Bearer " + tok;
  else if(!/^sb_/.test(SUPABASE_ANON_KEY)) h.Authorization = "Bearer " + SUPABASE_ANON_KEY;
  return h;
};
async function loadEvent(){
  if(!ONLINE) return false;
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1&select=points_multiplier,until,banner`, { headers:sbHeaders() });
    if(!r.ok) return false;
    const rows = await r.json();
    if(Array.isArray(rows) && rows[0]){
      const row = rows[0];
      eventSettings = { mult:Math.min(5, Math.max(1, Number(row.points_multiplier)||1)), until:row.until ? Date.parse(row.until) : null, banner:row.banner||"" };
    }
    return true;
  }catch(e){ return false; }
}
// 1 when no event is running, otherwise the bonus multiplier (until the end time, if there is one)
function eventMult(){
  const e = eventSettings;
  return e.mult > 1 && (!e.until || Date.now() < e.until) ? e.mult : 1;
}
const payFor = base => Math.round(base * eventMult());
const payKey = (kind, id) => kind==="season" ? "season:"+id : `${kind}:${id}:${kind==="daily" ? state.daily.key : state.weekly.key}`;

try { cloud.session = JSON.parse(localStorage.getItem("questopia-session") || "null"); } catch(e){}
function storeSession(){ try{ cloud.session ? localStorage.setItem("questopia-session", JSON.stringify(cloud.session)) : localStorage.removeItem("questopia-session"); }catch(e){} }
const siteUrl = () => location.origin + location.pathname;
function signInWith(provider){ if(ONLINE) location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=${provider}&redirect_to=${encodeURIComponent(siteUrl())}`; }
async function userToken(){
  const ses = cloud.session; if(!ses) return null;
  if(ses.expires_at && Date.now()/1000 > ses.expires_at - 60){
    try{
      const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method:"POST",
        headers:{ apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" }, body:JSON.stringify({ refresh_token:ses.refresh_token }) });
      const j = await r.json();
      if(!r.ok || !j.access_token) throw new Error("refresh failed");
      cloud.session = Object.assign({}, ses, { access_token:j.access_token, refresh_token:j.refresh_token || ses.refresh_token,
        expires_at: j.expires_at || Math.floor(Date.now()/1000) + (j.expires_in || 3600) });
      storeSession();
    }catch(e){ cloud.session = null; storeSession(); return null; }
  }
  return cloud.session.access_token;
}
async function sbFetch(path, opts){
  const tok = await userToken(); if(!tok) throw new Error("signed out");
  opts = opts || {};
  return fetch(`${SUPABASE_URL}${path}`, Object.assign({}, opts, { headers:Object.assign(sbHeaders(tok), opts.headers || {}) }));
}
const hasProgress = () => !!state.username && ((state.earnedTotal||0) > 0 || state.owned.length > 0 || state.friends.length > 1);
async function getCloudRow(){
  const r = await sbFetch(`/rest/v1/profiles?select=username,friend_code,state,updated_at&user_id=eq.${cloud.session.user.id}`);
  if(!r.ok) throw new Error("load failed");
  const rows = await r.json();
  return rows[0] || null;
}
async function pushCloud(){
  if(!cloud.session || cloud.busy || cloud.conflict) return;
  cloud.busy = true;
  try{
    for(let i=0; i<6; i++){
      const ts = new Date().toISOString();
      const body = Object.assign({}, state); delete body.dirty; delete body.syncedAt;
      const r = await sbFetch(`/rest/v1/profiles?on_conflict=user_id`, { method:"POST",
        headers:{ Prefer:"resolution=merge-duplicates,return=minimal" },
        body:JSON.stringify({ user_id:cloud.session.user.id, username:state.username, friend_code:state.friendCode, state:body, updated_at:ts }) });
      if(r.status===409){ state.friendCode = makeCode(); save(true); continue; } // friend code already taken
      if(r.ok){ state.syncedAt = ts; state.dirty = false; save(true); cloud.status = "Saved online"; cloud.savedAt = Date.now(); }
      else cloud.status = "Couldn't save online";
      break;
    }
  }catch(e){ cloud.status = "Couldn't save online"; }
  cloud.busy = false;
  if(inAccount) render();
}
function queueCloudSave(){ clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 4000); }
// Replace this device's save with the online one
function adoptCloud(row){
  const cs = Object.assign({}, row.state, { dirty:false, syncedAt:row.updated_at });
  try{ localStorage.setItem(KEY, JSON.stringify(cs)); }catch(e){}
  location.reload();
}
// Check the online save: load it, upload ours, or ask which to keep
async function syncCloud(){
  if(!ONLINE || !cloud.session) return;
  try{
    const row = await getCloudRow();
    if(!row || !row.state || !row.state.username){ if(state.username) await pushCloud(); return; }
    const same = state.syncedAt && Date.parse(row.updated_at) === Date.parse(state.syncedAt);
    if(same){ if(state.dirty) await pushCloud(); return; }
    if(!hasProgress() || (state.syncedAt && !state.dirty)) return adoptCloud(row);
    cloud.conflict = { row }; inAccount = true; render();
  }catch(e){ cloud.status = "Couldn't reach the online save"; }
}
// Back from Google/Apple: the address holds the sign-in tokens
async function handleOAuthReturn(){
  if(!ONLINE || !/access_token|error_description/.test(location.hash)) return;
  const p = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname + location.search);
  const at = p.get("access_token");
  if(!at){ cloud.status = "Sign-in didn't finish. Try again."; inAccount = true; return; }
  try{
    const u = await (await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers:sbHeaders(at) })).json();
    const meta = u.user_metadata || {};
    cloud.session = { access_token:at, refresh_token:p.get("refresh_token"),
      expires_at:+p.get("expires_at") || Math.floor(Date.now()/1000) + (+p.get("expires_in") || 3600),
      user:{ id:u.id, email:u.email, name:meta.full_name || meta.name || u.email } };
    storeSession();
    inAccount = true;
    await syncCloud();
    if(!cloud.conflict) cloud.status = "Saved online";
  }catch(e){ cloud.status = "Sign-in didn't finish. Try again."; inAccount = true; }
}
function signOut(){ cloud.session = null; cloud.conflict = null; cloud.status = ""; storeSession(); state.dirty = false; save(true); resetSocial(); }

/* ---------- Live friends (online) ----------
   The server only hands out a friend's name, title, avatar, unlocked items and points, and only to accepted friends.
   Everything that comes back is checked here again before it is drawn. */
let social = { friends:[], incoming:[], outgoing:[], byCode:{}, loaded:false, busy:false, error:"", sig:"" };
function resetSocial(){ social = { friends:[], incoming:[], outgoing:[], byCode:{}, loaded:false, busy:false, error:"", sig:"" }; }
const HEX = /^#[0-9a-fA-F]{6}$/;
const safeName = n => { const v = String(n == null ? "" : n).slice(0,20); return v && /^[A-Za-z0-9_]+$/.test(v) && !nameBlocked(v) ? v : "Player"; };
function cleanPlayer(r){
  r = r || {};
  const rl = r.look || {}, rg = r.gear || {}, look = {}, gear = {};
  for(const k of ["skin","hairColor","eyeColor","shirt","pants","shoes"]) look[k] = HEX.test(rl[k]) ? rl[k] : DEFAULT_LOOK[k];
  look.hairType = HAIR_TYPES.some(h=>h[0]===rl.hairType) ? rl.hairType : DEFAULT_LOOK.hairType;
  look.eyeType = EYE_TYPES.some(h=>h[0]===rl.eyeType) ? rl.eyeType : DEFAULT_LOOK.eyeType;
  for(const c of CATS) if(c.slot!=="title") gear[c.slot] = CATALOG[c.key].some(i=>i[0]===rg[c.slot]) ? rg[c.slot] : DEFAULT_GEAR[c.slot];
  return {
    id: Number(r.id) || 0,
    code: /^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(r.code) ? r.code : "",
    name: safeName(r.name),
    title: CATALOG.titles.some(i=>i[0]===r.title) ? r.title : "since",
    joined: Number.isInteger(r.joined) && r.joined >= 2020 && r.joined <= 2100 ? r.joined : new Date().getFullYear(),
    look, gear,
    points: Number.isFinite(r.points) ? Math.min(10000000, Math.max(0, Math.floor(r.points))) : null, // only accepted friends come with points
    owned: Array.isArray(r.owned) ? r.owned.filter(x=>typeof x==="string" && x.length<40).slice(0,300) : []
  };
}
async function rpc(fn, args){
  const r = await sbFetch(`/rest/v1/rpc/${fn}`, { method:"POST", body:JSON.stringify(args || {}) });
  if(!r.ok){ const e = new Error("rpc " + r.status); e.status = r.status; throw e; }
  return r.json();
}
// Re-draw after new friend data arrives, unless the player is in the middle of typing
function softRender(){

  if(!state.username || editing || inAccount || inAdmin || (a && /^(INPUT|TEXTAREA)$/.test(a.tagName))) return;
  render();
}
async function refreshSocial(){
  if(!ONLINE || !cloud.session || social.busy || cloud.conflict) return;
  social.busy = true;
  try{
    const j = await rpc("social_list");
    const friends = (j.friends||[]).map(cleanPlayer).filter(p=>p.code);
    const incoming = (j.incoming||[]).map(cleanPlayer).filter(p=>p.code);
    const outgoing = (j.outgoing||[]).map(o=>({ id:Number(o.id)||0, code:String(o.code||"").slice(0,9), name:safeName(o.name) }));
    const sig = JSON.stringify([friends, incoming, outgoing]);
    const changed = !social.loaded || sig !== social.sig || social.error;
    const byCode = {}; incoming.forEach(p=>byCode[p.code]=p); friends.forEach(p=>byCode[p.code]=p);
    Object.assign(social, { friends, incoming, outgoing, byCode, loaded:true, error:"", sig });
    if(changed) softRender();
  }catch(e){
    social.error = e.status===404 ? "Friends aren't set up on the server yet." : "Couldn't reach your friends right now.";
    if(!social.loaded) softRender();
  }
  social.busy = false;
}
const FRIEND_ERRORS = {

function ensureFresh(){
  if(state.daily.key !== dayKey()) state.daily = { key:dayKey(), done:[] };
  if(state.weekly.key !== weekKey()) state.weekly = { key:weekKey(), done:[] };
  if(!state.season || state.season.id !== SEASON.id) state.season = { id:SEASON.id, counts:{}, claimed:[] };
  // forget payout records for days and weeks that are over
  state.paid = state.paid || {};
  for(const k of Object.keys(state.paid)){
    const [kind,, key] = k.split(":");
    if((kind==="daily" && key!==state.daily.key) || (kind==="weekly" && key!==state.weekly.key)) delete state.paid[k];
  }
  save();
}

let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}
function seasonQuestIds(){ return SEASON.quests.filter(q=>q.auto!=="season").map(q=>q.id); }
function seasonDoneCount(){ return seasonQuestIds().filter(id=>state.season.claimed.includes(id)).length; }
// Finishing every season quest earns the season's champion title (kept for good once earned).
function checkSeasonComplete(quiet){
  const key = "title:"+SEASON.titleId;
  if(seasonDoneCount() === seasonQuestIds().length && !state.owned.includes(key)){
    state.owned.push(key);
    if(!quiet) toast(`${SEASON.name} complete! New title unlocked.`);
  }
}
function bumpSeason(id, delta){
  const q = SEASON.quests.find(x=>x.id===id); if(!q || q.auto==="season") return;
  const s = state.season;
  s.counts[id] = Math.max(0, Math.min(q.target, (s.counts[id]||0) + delta));
  const claimed = s.claimed.includes(id);
  if(s.counts[id] >= q.target && !claimed){
    const amt = payFor(q.pts);
    state.paid["season:"+id] = amt; addPoints(amt);
    toast(`Season quest done! +${amt}`);
    checkSeasonComplete();
  } else if(s.counts[id] < q.target && claimed){
    s.claimed = s.claimed.filter(x=>x!==id);
    addPoints(-(state.paid["season:"+id] ?? q.pts)); delete state.paid["season:"+id];
  }
}
// Points from quests also count toward challenges (earnedTotal never goes down when you spend points).
function addPoints(n){
  state.points = Math.max(0, state.points + n);
  state.earnedTotal = (state.earnedTotal||0) + n;
}
function qInfo(kind, id){
  return kind==="season" ? SEASON.quests.find(q=>q.id===id) : (kind==="daily"?DAILY_POOL:WEEKLY_POOL).find(q=>q.id===id);
}
const bucketKey = kind => kind==="daily" ? state.daily.key : kind==="weekly" ? state.weekly.key : SEASON.id;
// The running quest, or null. A quest from an earlier day, week or season is dropped.
function runningQuest(){
  const a = state.active;
  if(a && a.key !== bucketKey(a.kind)){ state.active = null; return null; }
  return a || null;
}
function activeFor(kind, id){ const a = runningQuest(); return a && a.kind===kind && a.id===id ? a : null; }
function leftMs(a){
  const now = Date.now();
  if(a.start > now){ a.start = now; save(); } // clock set backwards: the timer restarts instead of finishing early
  return Math.max(0, a.start + a.mins*60000 - now);
}
function fmtLeft(ms){
  const t = Math.ceil(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), sec = t%60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
function startQuest(kind, id){
  const q = qInfo(kind, id); if(!q) return false;
  const cur = runningQuest();
  if(cur){ const cq = qInfo(cur.kind, cur.id); toast(`Finish or cancel "${cq?cq.title:"your quest"}" first.`); return false; }
  if(kind==="season" && ONCE_A_DAY.has(id) && (state.season.last||{})[id]===dayKey()){ toast("Nice! Come back tomorrow for the next one."); return false; }
  state.active = { kind, id, key:bucketKey(kind), start:Date.now(), mins:minsFor(id) };
  save(); render();
  return true;
}
function cancelQuest(){
  if(live && live.quest) discardLive(); // cancelling a walk quest also stops and throws away its GPS tracking
  state.active = null; save(); render();
}
// Returns true when the timer for this quest is up; otherwise says why not.
function timerDone(kind, id){
  const a = activeFor(kind, id);
  if(!a){ toast("Tap Start first."); return false; }
  if(leftMs(a) > 0){ toast("Keep going! The timer isn't done yet."); return false; }
  return true;
}
function questButton(kind, id, done, logAct){
  const act = logAct ? "log" : "toggle";
  if(done) return logAct
    ? `<button class="btn" disabled>Done</button>`
    : `<button class="btn" data-act="toggle" data-kind="${kind}" data-id="${id}" aria-pressed="true">Done</button>`;
  const a = activeFor(kind, id);
  if(GPS_QUESTS[id]){ // walk and hike quests: done through a GPS Activity, not a plain timer
    return a ? `<button class="btn solid" data-act="open-activity">Open Activity</button>`
             : `<button class="btn solid" data-act="start-activity" data-kind="${kind}" data-id="${id}">Start Activity</button>`;
  }
  if(!a) return `<button class="btn" data-act="start" data-kind="${kind}" data-id="${id}">Start</button>`;
  const l = leftMs(a);
  if(l > 0) return `<button class="btn timer" disabled data-countdown="${kind}:${id}" aria-label="Time left">${fmtLeft(l)}</button>`;
  return `<button class="btn solid" data-act="${act}" data-kind="${kind}" data-id="${id}">Complete</button>`;
}
function questMeta(kind, q){
  const a = activeFor(kind, q.id);
  return `<span>${minsFor(q.id)>=60 ? minsFor(q.id)/60+" hr" : minsFor(q.id)+" min"}</span>` +
    (GPS_QUESTS[q.id] ? `<span class="gps-tag">GPS · ${GPS_QUESTS[q.id].mi} mi</span>` : "") +
    (a ? `<button class="linkbtn" data-act="cancel">Cancel</button>` : "");
}
function toggle(kind, id){
  const pool = kind==="daily" ? DAILY_POOL : WEEKLY_POOL;
  const q = pool.find(x=>x.id===id); if(!q) return;
  const bucket = state[kind];
  if(bucket.done.includes(id)){
    // Undoing takes the points back, so it isn't allowed once they've been spent in the Locker.
    const pk = payKey(kind, id), paid = state.paid[pk] ?? q.pts;
    let back = paid;
    const s6 = SEASON.quests.find(x=>x.id==="s6");
    if(kind==="daily" && state.season.claimed.includes("s6") && (state.season.counts.s6||0) >= s6.target) back += state.paid["season:s6"] ?? s6.pts;
    if(state.points < back){ toast("Those points are already spent."); return; }
    bucket.done = bucket.done.filter(x=>x!==id);
    addPoints(-paid); delete state.paid[pk];
    if(kind==="daily") bumpSeason("s6",-1);
  } else {
    if(GPS_QUESTS[id]){ toast("This one needs an Activity. Tap Start Activity."); return; } // walk quests are only completed by a finished GPS Activity
    if(!timerDone(kind, id)) return;
    state.active = null;
    bucket.done.push(id);
    const amt = payFor(q.pts);
    state.paid[payKey(kind, id)] = amt;
    addPoints(amt);
    toast(amt > q.pts ? `+${amt} points (${eventMult()}x bonus!)` : `+${amt} points`);
    if(kind==="daily") bumpSeason("s6",1);
  }
  save(); render();
}

/* Name filter: blocks swear words, slurs, sexual words, names that pretend to be the game's staff, and phone numbers.
   It also catches number swaps like sh1t and stretched letters like fuuuck. No filter is perfect, so add words to the lists below any time. */
const NAME_ANYWHERE = ["fuck","shit","bitch","slut","whore","porn","pussy","asshole","dumbass","jackass","bastard","hitler","penis","vagina","dildo",
  "blowjob","handjob","cumshot","jizz","molest","paedo","killyourself","dickhead","twat","wanker","cocksucker","nigga","nigger","niggr","faggot","retard","kkk","motherfucker"];
const NAME_RAW_ONLY = new Set(["nigga","nigger","niggr","kkk","faggot"]);           // checked as typed, so "Niger" is fine
const NAME_WORDS = new Set(["ass","arse","dick","cock","cum","tit","tits","boobs","sex","sexy","anal","fag","fags","rape","raped","rapes","rapist","hoe","kys",
  "fck","fuk","fcuk","pedo","horny","nude","nudes","naked","nazi","nazis","cunt","cunts","tranny","dyke","spic","chink","gook","kike","coon","negro","paki","homo","slag","niger"]); // "niger" only as its own word, so Nigeria and Nigerian are fine
const NAME_RESERVED_WORDS = new Set(["admin","staff","support","official","moderator","administrator"]);
const LEET = { "0":"o","1":"i","3":"e","4":"a","5":"s","7":"t" };
const leet = t => t.toLowerCase().replace(/[013457]/g, c=>LEET[c]).replace(/[^a-z]/g, "");
const squeeze = t => t.replace(/(.)\1+/g, "$1");
function nameBlocked(raw){
  const v = String(raw).trim().replace(/^@/, "");
  const flat = leet(v.replace(/_/g, ""));                        // the whole name, letters only
  const flatSq = squeeze(flat);
  for(const w of NAME_ANYWHERE){
    if(NAME_RAW_ONLY.has(w) ? flat.includes(w) : flatSq.includes(squeeze(w))) return true;
  }
  if(flat.includes("questopia")) return true;
  // whole words: split on underscores and capital letters, ignore numbers on the ends
  const tokens = v.split("_").flatMap(t => t.split(/(?<=[a-z0-9])(?=[A-Z])/));
  for(const t of tokens){
    const core = leet(t.replace(/^\d+|\d+$/g, ""));
    if(NAME_WORDS.has(core) || NAME_WORDS.has(squeeze(core)) || NAME_RESERVED_WORDS.has(core)) return true;
  }
  return false;
}
/* Usernames: 3 to 20 letters, numbers or underscores. Shown to friends, so they go through the name filter. */
function nameCheck(raw){
  const v = String(raw).trim().replace(/^@/, "");
  if(!/^[A-Za-z0-9_]{3,20}$/.test(v)) return { ok:false, msg:"Use 3 to 20 letters, numbers or underscores." };
  if(/\d{7,}/.test(v)) return { ok:false, msg:"Please don't put a phone number in your name." };
  if(nameBlocked(v)) return { ok:false, msg:"That name isn't allowed. Try a different one." };
  return { ok:true, value:v };
}
function applyName(){
  const inp = document.getElementById("uname"), err = document.getElementById("unameErr");
  if(!inp) return true;
  const r = nameCheck(inp.value);
  if(!r.ok){
    err.textContent = r.msg; inp.setAttribute("aria-invalid","true"); inp.focus();
    return false;

  state.username = r.value; delete state.renameNotice;
  if(!state.joined) state.joined = new Date().getFullYear();
  save();
  return true;
}

function itemAction(catKey, id){
  const cat = catByKey(catKey), item = findItem(catKey, id); if(!item) return;
  const key = cat.slot+":"+id, cost = item[2];
  if(isOwned(cat.slot, id)){ equip(cat.slot, id); pendingBuy = null; }
  else if(cost < 0){ toast(`Finish every ${SEASON.name} quest to earn this.`); return; }
  else if(state.points < cost){ toast(`You need ${cost - state.points} more points.`); return; }
  else if(pendingBuy !== key){ pendingBuy = key; render(); return; } // first tap asks to confirm
  else {
    state.points -= cost; state.owned.push(key); equip(cat.slot, id); pendingBuy = null;
    toast(`Unlocked ${itemName(catKey, id)}`);

function itemCard(cat, it){
  const id = it[0], cost = it[2], slot = cat.slot;
  const owned = isOwned(slot, id), equipped = equippedId(slot) === id;
  const pending = pendingBuy === slot+":"+id;
  let label, cls = "btn", dis = "";
  if(equipped){ label = "Equipped"; cls += " solid"; dis = " disabled"; }
  else if(owned){ label = "Equip"; }
  else if(cost < 0){ label = "Locked"; dis = " disabled"; }
  else if(state.points < cost){ label = `${cost} pts`; dis = " disabled"; }
  else if(pending){ label = `Spend ${cost} pts?`; cls += " solid"; }
  else { label = `Unlock · ${cost} pts`; }
  const meta = owned ? (cost===0 ? "Free" : cost<0 ? "Earned" : "Unlocked")
    : cost<0 ? `Finish every ${SEASON.name} quest`
    : (state.points<cost ? `Need ${cost-state.points} more points` : `${cost} points`);
  const name = (cat.key==="titles" ? titleHtml(id) : esc(itemName(cat.key, id))) + (it[3] ? `<span class="tag">Special</span>` : "");
  const btn = `<button class="${cls}" data-act="item" data-cat="${cat.key}" data-id="${id}"${dis}>${label}</button>`;
  if(cat.key==="titles"){
    return `<li class="item row ${equipped?"equipped":""}"><div><span class="item-name">${name}</span><span class="item-meta">${meta}</span></div>${btn}</li>`;
  }
  return `<li class="item ${equipped?"equipped":""}">${thumbHtml(cat,id)}<div><span class="item-name">${name}</span><span class="item-meta">${meta}</span></div>${btn}</li>`;
}

/* Shop: special cosmetics you can only get here. Once bought they show up in the Locker too. */
let inShop = false;
let shopCart = [], cartConfirm = false; // shopCart: "slot:id" keys picked for "Buy all"
const catBySlot = slot => CATS.find(c=>c.slot===slot);
// The cart as a list, dropping anything that was bought or removed in the meantime
function cartItems(){
  shopCart = shopCart.filter(k=>{
    const slot = k.split(":")[0], id = k.split(":")[1], cat = catBySlot(slot), it = cat && findItem(cat.key, id);
    return !!it && !!it[3] && it[2] > 0 && !isOwned(slot, id);
  });
  return shopCart.map(k=>{ const slot = k.split(":")[0], id = k.split(":")[1], cat = catBySlot(slot); return { cat, id, cost:findItem(cat.key,id)[2] }; });
}
function triedNames(){
  const names = Object.keys(tryGear).map(slot=>itemName(catBySlot(slot).key, tryGear[slot]));
  if(tryTitle) names.push(itemName("titles", tryTitle));
  return names;
}
function clearTryOn(){ tryGear = {}; tryTitle = null; }
function toggleTry(catKey, id){
  const cat = catByKey(catKey); if(!cat || !findItem(catKey, id)) return;
  if(cat.slot==="title") tryTitle = tryTitle===id ? null : id;
  else if(tryGear[cat.slot]===id) delete tryGear[cat.slot];
  else tryGear[cat.slot] = id;
  setAvatar(); render();
}
function toggleCart(catKey, id){
  const cat = catByKey(catKey), it = cat && findItem(catKey, id);
  if(!it || !it[3] || it[2] <= 0 || isOwned(cat.slot, id)) return;
  const key = cat.slot+":"+id, i = shopCart.indexOf(key);
  if(i < 0) shopCart.push(key); else shopCart.splice(i, 1);
  cartConfirm = false; render();
}
function buyCart(){
  const items = cartItems(); if(!items.length) return;
  const total = items.reduce((n,x)=>n+x.cost, 0);
  if(state.points < total){ toast(`You need ${total - state.points} more points.`); return; }
  if(!cartConfirm){ cartConfirm = true; render(); return; } // first tap asks to confirm
  state.points -= total;
  items.forEach(x=>{ state.owned.push(x.cat.slot+":"+x.id); equip(x.cat.slot, x.id); });
  // if you were trying something on, that is what you end up wearing
  Object.keys(tryGear).forEach(slot=>{ if(items.some(x=>x.cat.slot===slot && x.id===tryGear[slot])) equip(slot, tryGear[slot]); });
  if(tryTitle && items.some(x=>x.cat.slot==="title" && x.id===tryTitle)) equip("title", tryTitle);
  const first = items[0];
  shopCart = []; cartConfirm = false; clearTryOn();
  toast(items.length===1 ? `Unlocked ${itemName(first.cat.key, first.id)}` : `Unlocked ${items.length} items`);
  save(); setAvatar(); render();
}
function shopItemCard(cat, it){
  const id = it[0], cost = it[2], slot = cat.slot;
  if(isOwned(slot, id)) return itemCard(cat, it); // bought already: Equip / Equipped as usual
  const trying = slot==="title" ? tryTitle===id : tryGear[slot]===id, carted = shopCart.includes(slot+":"+id);
  const name = (cat.key==="titles" ? titleHtml(id) : esc(itemName(cat.key, id))) + `<span class="tag">Special</span>`;
  const btns = `<div class="item-btns">
      <button class="btn" data-act="try" data-cat="${cat.key}" data-id="${id}" aria-pressed="${trying}">${trying ? "Trying on ✓" : "Try on"}</button>
      <button class="btn${carted ? " solid" : ""}" data-act="cart" data-cat="${cat.key}" data-id="${id}" aria-pressed="${carted}">${carted ? "In cart ✓" : "Add to cart"}</button>
    </div>`;
  const cls = `item${carted ? " carted" : ""}${trying ? " trying" : ""}`;
  if(cat.key==="titles") return `<li class="${cls} row"><div><span class="item-name">${name}</span><span class="item-meta">${cost} points</span></div>${btns}</li>`;
  return `<li class="${cls}">${thumbHtml(cat,id)}<div><span class="item-name">${name}</span><span class="item-meta">${cost} points</span></div>${btns}</li>`;
}
function shopView(){
  const sections = CATS.map(cat=>({ cat, items:CATALOG[cat.key].filter(it=>it[3]) })).filter(x=>x.items.length);
  const total = sections.reduce((n,x)=>n+x.items.length, 0);

  return `
