<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Questopia</title>
<meta name="description" content="Questopia: daily, weekly and season quests that get you off the screen and outside, with points to spend on your avatar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --field:#F1F6EA;
  --paper:#FCFEF9;
  --moss:#2E5E3E;
  --moss-dark:#1E4029;
  --sun:#F5B82E;
  --sun-soft:#FFEBB8;
  --sky:#CFE8F5;
  --ink:#1F2A22;
  --muted:#5D6B60;
  --line:#D9E3D0;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--field);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.5;
  min-height:100vh;
}
.sky{
  position:absolute;inset:0 0 auto 0;height:260px;z-index:0;
  background:linear-gradient(var(--sky),var(--field));
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3,.big-name{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-0.01em;font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--moss);outline-offset:2px;border-radius:8px}
canvas{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{display:flex;align-items:center;gap:12px}
.me{
  display:block;width:72px;height:72px;border-radius:50%;border:0;padding:5px;flex:none;
  background:var(--moss);box-shadow:0 2px 8px rgba(30,64,41,.18);
}
.me-in{
  display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:linear-gradient(#DDF0FA,#EEF6E2);border:2px solid var(--paper);
}
.me canvas,.me svg{width:100%;height:100%}

/* Locker button on the quest screen */
.locker-btn{
  display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;text-align:left;
  background:var(--paper);border:2px solid var(--moss);border-radius:16px;padding:10px 14px;color:var(--moss-dark);
}
.locker-btn:hover{background:#E6F0DC}
.locker-btn svg{width:28px;height:28px;flex:none}
.lb-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.lb-txt b{font-family:var(--display);font-size:19px}
.lb-txt span{font-size:13px;color:var(--muted)}
.locker-btn .chev{font-size:26px;line-height:1}
.brand{flex:1;min-width:0}
.brand h1{font-size:26px;font-weight:800;color:var(--moss-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.points{
  background:var(--moss);color:#fff;border-radius:999px;
  padding:8px 16px;font-family:var(--display);font-weight:800;font-size:22px;
  line-height:1;text-align:center;flex:none;
}
.points small{display:block;font-family:var(--body);font-weight:600;font-size:11px;opacity:.85;margin-top:3px}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:22px 0 14px;
  background:var(--paper);border:1px solid var(--line);padding:5px;border-radius:16px}
.tab{
  border:0;background:transparent;border-radius:12px;padding:10px 4px;
  font-weight:600;color:var(--muted);
}
.tab[aria-selected="true"]{background:var(--moss);color:#fff}

/* Panel */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 18px 6px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:22px}
.panel-head span{font-size:14px;color:var(--muted)}
.quests{list-style:none;margin:8px 0 0;padding:0}
.quest{
  display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;
  padding:16px 0;border-top:1px solid var(--line);
}
.quest:first-child{border-top:0}
.q-title{font-weight:600}
.q-meta{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:14px;color:var(--muted)}
.pts{background:var(--sun-soft);color:#6B4A00;border-radius:999px;padding:1px 10px;font-weight:600;font-size:13px}
.btn{
  border:2px solid var(--moss);background:var(--paper);color:var(--moss-dark);
  border-radius:12px;padding:9px 16px;font-weight:600;min-width:96px;
  transition:transform .08s ease,background .15s ease;
}
.btn:hover{background:#E6F0DC}
.btn:active{transform:scale(.96)}
.btn.solid{background:var(--moss);color:#fff}
.btn.solid:hover{background:var(--moss-dark)}
.quest.done .btn{background:var(--moss);color:#fff}
.quest.done .q-title{color:var(--muted)}
.bar{grid-column:1/-1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .3s ease}
.auto{font-size:13px;color:var(--muted);min-width:96px;text-align:right}
.badge{width:1.1em;height:1.1em;vertical-align:-.2em;margin-right:5px}
.note{margin:18px 4px 0;font-size:14px;color:var(--muted);text-align:center}

/* Avatar editor */
.editor h2{font-size:34px;font-weight:800;color:var(--moss-dark);margin-top:18px}
.editor > p{color:var(--muted);margin:8px 0 16px}
.stage{
  position:sticky;top:8px;z-index:4;height:300px;
  background:linear-gradient(#DDF0FA,#EEF6E2);
  border:2px solid var(--paper);border-radius:22px;
  box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(30,64,41,.12);
  display:flex;justify-content:center;overflow:hidden;
}
.stage canvas{height:100%;width:auto;aspect-ratio:1;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage svg{height:100%;width:auto;aspect-ratio:1}
.stage .hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--muted)}
.nameplate{
  position:absolute;left:10px;top:10px;max-width:calc(100% - 130px);
  background:rgba(252,254,249,.9);border:1px solid var(--line);border-radius:12px;padding:6px 12px;
}
.nameplate b{display:block;font-family:var(--display);font-size:18px;line-height:1.15;color:var(--moss-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nameplate span{display:block;font-size:13px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage .rand{
  position:absolute;right:10px;top:10px;min-width:0;padding:6px 12px;font-size:14px;border-width:2px;
}
.group{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px 16px 6px;margin-top:14px}
.group > h3{font-size:20px;margin-bottom:6px}
.row{margin:0 0 14px}
.row-label{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 8px}
.swatches,.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{
  position:relative;width:40px;height:40px;border-radius:50%;padding:0;
  border:3px solid var(--paper);box-shadow:0 0 0 1px #B9C6AE;
}
.sw[aria-pressed="true"],.sw.custom.active{box-shadow:0 0 0 3px var(--moss)}
.sw.custom{
  display:block;cursor:pointer;
  background:conic-gradient(#e44,#ec4,#4c6,#4ad,#a5e,#e44);
}
.sw.custom::after{
  content:"+";position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.sw.custom.active::after{content:""}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw.custom:focus-within{outline:3px solid var(--moss);outline-offset:2px}
.chip{
  border:2px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;
}
.chip[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#fff}
.editor .done,.welcome .done{width:100%;margin-top:18px;padding:14px;font-size:18px}
.welcome > .wordmark{
  margin:18px 0 0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-0.01em;
  color:var(--moss);
}
.welcome h2{font-size:34px;font-weight:800;color:var(--moss-dark);margin-top:4px}
.welcome > p{color:var(--muted);margin:8px 0 22px}
.welcome form{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}
.text{
  width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--field);
  border:2px solid var(--line);border-radius:12px;padding:12px 14px;
}
.text:focus{outline:3px solid var(--moss);outline-offset:1px;border-color:var(--moss)}
.text[aria-invalid="true"]{border-color:#B3261E}
.err{margin:8px 0 0;min-height:1.4em;font-size:14px;color:#B3261E;font-weight:600}

/* Locker */
.locker-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.locker-top h2{flex:1;font-size:30px;font-weight:800;color:var(--moss-dark)}
.backlink{background:none;border:0;color:var(--moss-dark);font-weight:600;padding:6px 4px;font-size:16px}
.locker-top .points{font-size:20px;padding:6px 14px}
.dock{position:sticky;top:8px;z-index:4;display:grid;gap:8px}
.np{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);
  border-radius:18px;padding:8px 12px;box-shadow:0 6px 16px rgba(30,64,41,.1);
}
.np .me{width:56px;height:56px;padding:4px}
.np-txt{min-width:0}
.np-txt b{display:block;font-family:var(--display);font-size:19px;line-height:1.15;color:var(--moss-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-txt span{display:block;font-size:14px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .stage{position:relative;top:auto;height:200px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .chip{flex:none;white-space:nowrap}
.cat-note{margin:6px 2px 0;font-size:14px;color:var(--muted)}
.items{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.items.one{grid-template-columns:1fr}
.item{
  background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px;
  display:flex;flex-direction:column;gap:8px;
}
.item.equipped{border-color:var(--moss)}
.item.row{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.item-name{display:block;font-family:var(--display);font-size:17px;line-height:1.2}
.item-meta{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.item .btn{width:100%;min-width:0;padding:8px 10px;font-size:15px}
.item.row .btn{width:auto;min-width:120px;flex:none}
.item .btn:disabled:not(.solid){opacity:.55;cursor:not-allowed}
.item .btn.solid:disabled{opacity:1;cursor:default}
.thumb{
  aspect-ratio:1;border-radius:12px;overflow:hidden;background:linear-gradient(#DDF0FA,#EEF6E2);
}
.thumb canvas{width:100%;height:100%}
.thumb-fallback{display:grid;place-items:center;text-align:center;padding:8px;font-weight:600;color:var(--muted)}
.ring-sample{width:84px;height:84px;margin:4px auto 0;padding:6px}

/* Quest timers */
.btn.timer{background:var(--sun-soft);border-color:var(--sun);color:#6B4A00;font-variant-numeric:tabular-nums;opacity:1}
.btn.timer:disabled{cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}
/* Challenges */
.pick{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:600}
.pick input{width:22px;height:22px;accent-color:var(--moss)}
.chal-form .row-label{margin-top:18px}
.chal-form .row-label:first-child{margin-top:4px}
.chal-form .text{font-size:16px;text-transform:none}
.range{width:100%;accent-color:var(--moss);height:36px}
.prizes{margin:4px 2px 0;font-size:14px;font-weight:600;color:var(--muted)}
.chal-form .go{width:100%;margin-top:10px;padding:14px;font-size:18px}
.chal-sum{display:flex;justify-content:space-between;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.chal-sum b{font-family:var(--display);font-size:20px;color:var(--moss-dark)}
.chal-sum span{color:var(--muted);font-weight:600;font-size:14px}
.challenge .prizes{margin:10px 2px 12px}
.stand{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.stand.mine{border:2px solid var(--moss)}
.place{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sun-soft);color:#6B4A00;font:800 17px/34px var(--display);text-align:center}
.stand .pts{flex:none}
/* Friends */
.locker-btn + .locker-btn{margin-top:10px}
.event-banner{margin-top:16px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#FFE9A8,#FFD166);border:2px solid var(--sun);border-radius:16px;padding:10px 14px;color:#4A3200}
.event-banner b{font-family:var(--display);font-size:20px}
.event-banner span{font-size:14px;font-weight:600}
.event-banner + .locker-btn{margin-top:10px}
.pts.bonus{background:var(--sun);color:#3a2800}
.admin .group{margin-top:14px}
.admin select{font:inherit;font-size:16px}
.admin .btn.big{width:100%;margin-top:10px;padding:14px;font-size:18px}
.acct-line{margin:6px 4px 0;text-align:center;font-size:14px;color:var(--muted)}
.fine{font-size:13px;color:var(--muted);margin:12px 0 0}
.account .group p{margin:8px 0 12px}
.account .btn.wide{width:100%;margin-top:10px;padding:13px;font-size:17px}
.account .stat{font-family:var(--display);font-size:18px;color:var(--moss-dark);margin:0 0 4px}
.admin .stat{font-family:var(--display);font-size:22px;color:var(--moss-dark)}
.tag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;background:var(--sun);color:#3a2800;font:700 11px/18px var(--body);vertical-align:2px;text-transform:uppercase;letter-spacing:.04em}
.friends .locker-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.friends .locker-top .backlink{justify-self:start}
.friends .locker-top h2{flex:none;text-align:center}
.count-badge{
  flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:999px;
  background:#E0312B;color:#fff;font:800 13px/22px var(--display);text-align:center;
  box-shadow:0 0 0 2px var(--paper);
}
.demo-note{margin:0 0 12px;padding:8px 12px;border-radius:12px;background:var(--sun-soft);color:#6B4A00;font-size:14px;font-weight:600}
.code-card{background:var(--paper);border:2px solid var(--moss);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.code-card > div{flex:1;min-width:0}
.code-card small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.code-card b{display:block;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:28px;letter-spacing:.08em;color:var(--moss-dark)}
.code-card .btn{min-width:0;padding:8px 14px}
.add-friend{display:flex;gap:8px;margin-top:12px}
.add-friend .text{flex:1;min-width:0;font-size:16px;text-transform:uppercase}
.add-friend .btn{min-width:0}
.pending-btn{margin-top:12px}
.sec-title{font-size:20px;margin:20px 2px 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec-title span{font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted)}
.flist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fbtn,.freq{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:8px 12px;
}
.fbtn:hover{background:#E6F0DC}
.fbtn .me,.freq .me{width:56px;height:56px;padding:4px}
.f-txt{flex:1;min-width:0}
.f-txt b{display:block;font-family:var(--display);font-size:19px;line-height:1.15;color:var(--moss-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-txt span{display:block;font-size:14px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.freq .btn{min-width:0;padding:7px 12px;font-size:15px}
.freq .acts{display:flex;gap:6px;flex:none}
.empty{color:var(--muted);text-align:center;padding:18px 8px;background:var(--paper);border:1px dashed var(--line);border-radius:16px}
.profile{text-align:center}
.profile .stage{position:relative;top:auto;height:300px}
.profile .big-name{font-family:var(--display);font-size:30px;font-weight:800;color:var(--moss-dark);margin-top:14px}
.profile .big-title{font-size:16px;font-weight:600;color:var(--muted);margin-top:2px}
.profile .facts{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.profile .facts span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.pbtns{display:grid;gap:12px;justify-items:center;margin-top:20px}
.pbtns .btn{min-width:200px}
.pbtns .btn.solid{margin-top:0}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;
  transition:transform .25s ease,opacity .25s ease;pointer-events:none;z-index:9;
}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="wrap">
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Avatar options ---------- */
const OPTS = {
  skin:[["Porcelain","#F8DCC6"],["Fair","#F0C6A1"],["Sand","#D9A27C"],["Olive","#BF9266"],
        ["Tan","#C68B5E"],["Brown","#9A6340"],["Deep","#6B4028"],["Ebony","#4A2C1E"]],
  hairColor:[["Black","#1A1210"],["Dark brown","#3B2415"],["Brown","#6B4423"],["Auburn","#8A3B1F"],
        ["Ginger","#C8601E"],["Blonde","#D9A441"],["Platinum","#EDE3C0"],["Grey","#A9A9AD"],
        ["Blue","#3B6FD6"],["Pink","#E86AA6"],["Green","#3E9E5A"],["Purple","#7A4FC8"]],
  eyeColor:[["Brown","#4B2E1E"],["Hazel","#8A6A2F"],["Green","#3E9E5A"],["Blue","#3B7BD6"],
        ["Grey","#7C8794"],["Violet","#8A4FC8"]],
  shirt:[["Red","#D64545"],["Orange","#E8742B"],["Yellow","#F2C12E"],["Green","#4FA36A"],
        ["Teal","#2F9AA0"],["Blue","#3B6FB6"],["Navy","#26365A"],["Purple","#7A4FC8"],
        ["Pink","#E86AA6"],["White","#F4F4F0"],["Grey","#6B7280"],["Black","#26282C"]],
  pants:[["Navy","#2B3A55"],["Black","#26282C"],["Grey","#59606B"],["Khaki","#C9A66B"],
        ["Brown","#6B4A2F"],["Olive","#5C6B3A"],["Denim","#4A6FA5"],["Maroon","#7A2B3A"]],
  shoes:[["White","#F0F0F0"],["Black","#26282C"],["Brown","#5A3E2B"],["Red","#D64545"],
        ["Blue","#3B6FD6"],["Green","#3E8E5A"],["Yellow","#F2C12E"],["Pink","#F08AB5"]]
};
const HAIR_TYPES = [["short","Short"],["curly","Curly"],["bun","Bun"],["long","Long"],["ponytail","Ponytail"],["buzz","Buzz"],["bald","Bald"]];
const EYE_TYPES  = [["round","Round"],["wide","Wide"],["happy","Happy"],["sleepy","Sleepy"],["sparkle","Sparkle"]];
/* ---------- Locker items: [id, name, cost in points]. Cost 0 means everyone has it. ---------- */
const CATS = [
  { key:"titles",  label:"Titles",         slot:"title"   },

/* ---------- 3D avatar (Three.js, built from simple shapes) ---------- */
let R=null, scene=null, camFull=null, camHead=null, avatarGroup=null, cams={};

function mat(c){ return new THREE.MeshStandardMaterial({ color:c, roughness:.8, metalness:0 }); }
function part(geo, m, x, y, z){
  const o = new THREE.Mesh(geo, m); o.position.set(x||0, y||0, z||0); return o;
}

function addEyes(g, look){
  const iris = mat(look.eyeColor), dark = mat("#1F2A22"), white = mat("#FFFFFF");
  const arcColor = new THREE.Color(look.eyeColor).lerp(new THREE.Color("#1F2A22"), .55);
  for(const s of [-1,1]){
    const x = s*.125, y = 1.58, z = .325;
    const E = (geo, m, dx, dy, dz, sx, sy, sz)=>{
      const o = part(geo, m, x+dx, y+dy, z+dz); o.scale.set(sx,sy,sz); g.add(o); return o;
    };
    const ball = r => new THREE.SphereGeometry(r,14,12);
    switch(look.eyeType){
      case "wide":
        E(ball(.062), white, 0,0,0, 1,1.2,.55);
        E(ball(.042), iris, 0,0,.016, 1,1.2,.5);
        E(ball(.022), dark, 0,0,.027, 1,1.2,.5);
        E(ball(.013), white, .014,.02,.04, 1,1,.6);
        break;
      case "happy": {
        const arc = new THREE.Mesh(new THREE.TorusGeometry(.05,.014,8,16,Math.PI), mat(arcColor.getStyle()));
        arc.position.set(x, y-.015, z+.012); g.add(arc);
        break; }
      case "sleepy":
        E(ball(.05), iris, 0,-.004,0, 1,.55,.6);
        E(ball(.026), dark, 0,-.004,.012, 1,.6,.5);
        E(new THREE.BoxGeometry(.12,.02,.02), dark, 0,.024,.014, 1,1,1);
        break;
      case "sparkle":
        E(ball(.062), iris, 0,0,0, 1,1.25,.6);
        E(ball(.032), dark, 0,0,.016, 1,1.25,.5);
        E(ball(.02), white, .02,.028,.036, 1,1,.6);
        E(ball(.01), white, -.016,-.02,.034, 1,1,.6);
        break;
      default: // round
        E(ball(.05), iris, 0,0,0, 1,1.25,.6);
        E(ball(.028), dark, 0,0,.012, 1,1.25,.5);
        E(ball(.014), white, .014,.02,.03, 1,1,.6);
    }
  }
}

function addGlasses(g, kind){
  if(kind==="none") return;
  if(kind==="goggles"){
    const brass = mat("#B8862B");
    const lens = new THREE.MeshStandardMaterial({ color:"#F2B84B", roughness:.2, metalness:.2, transparent:true, opacity:.55 });
    for(const s of [-1,1]){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(.092,.024,10,26), brass);
      ring.position.set(s*.125,1.58,.372); g.add(ring);
      g.add(part(new THREE.CircleGeometry(.09,24), lens, s*.125,1.58,.372));
    }
    g.add(part(new THREE.BoxGeometry(.08,.03,.03), brass, 0,1.585,.372));
    // strap around the sides and back of the head, left open at the front
    const strap = new THREE.Mesh(new THREE.TorusGeometry(.372,.02,8,40,Math.PI*2-1.3), mat("#6B4A2F"));
    strap.rotation.x = Math.PI/2;
    const sg = new THREE.Group(); sg.rotation.y = -(.65+Math.PI/2); sg.position.y = 1.585; sg.add(strap); g.add(sg); // turn the gap to the front
    return;
  }
  if(kind==="visor"){
    const lens = new THREE.MeshStandardMaterial({ color:"#0B3A4A", emissive:"#19E3FF", emissiveIntensity:.7, roughness:.2, transparent:true, opacity:.6 });
    const frame = mat("#15181C");
    g.add(part(new THREE.BoxGeometry(.5,.11,.025), lens, 0,1.585,.374));
    g.add(part(new THREE.BoxGeometry(.52,.016,.03), frame, 0,1.645,.374));
    g.add(part(new THREE.BoxGeometry(.52,.016,.03), frame, 0,1.525,.374));
    for(const s of [-1,1]){
      const arm = part(new THREE.BoxGeometry(.014,.02,.374), frame, s*.3,1.585,.2);
      arm.rotation.y = -s*.4; g.add(arm);
    }
    return;
  }
  const round = kind==="round", dark = kind==="shades" || kind==="neon";
  const frame = mat(kind==="neon" ? "#FF3D9A" : kind==="shades" ? "#15181C" : "#26282C");
  const lens = new THREE.MeshStandardMaterial({
    color: kind==="neon" ? "#2B1A4A" : dark ? "#0F1114" : "#CFE8F5",
    roughness:.2, metalness:.1, transparent:!dark, opacity: dark ? 1 : .22
  });
  const y = 1.58, z = .375;
  for(const s of [-1,1]){
    const x = s*.125;
    if(round){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(.085,.013,8,26), frame);
      ring.position.set(x,y,z); g.add(ring);
      g.add(part(new THREE.CircleGeometry(.084,24), lens, x,y,z));
    } else {
      const w=.2, h=.15, t=.016;
      g.add(part(new THREE.BoxGeometry(w,t,t), frame, x,y+h/2,z));
      g.add(part(new THREE.BoxGeometry(w,t,t), frame, x,y-h/2,z));
      g.add(part(new THREE.BoxGeometry(t,h,t), frame, x-w/2,y,z));
      g.add(part(new THREE.BoxGeometry(t,h,t), frame, x+w/2,y,z));
      g.add(part(dark ? new THREE.BoxGeometry(w,h,.02) : new THREE.PlaneGeometry(w,h), lens, x,y,z));
    }
    // temple arm running back to the ear
    const arm = part(new THREE.BoxGeometry(.014,.014,.374), frame, s*.2825, y-.002, .2025);
    arm.rotation.y = -s*.4; g.add(arm);
  }
  g.add(part(new THREE.BoxGeometry(.08,.014,.014), frame, 0, y+(round?.02:.05), z));
}

function addHat(g, kind){
  if(kind==="none") return;
  if(kind==="crown"){
    const gold = new THREE.MeshStandardMaterial({ color:"#F2C12E", roughness:.3, metalness:.6, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(.27,.25,.13,24,1,true), gold, 0,1.9,0));
    for(let i=0;i<5;i++){
      const a = i/5*Math.PI*2;
      const sp = part(new THREE.ConeGeometry(.05,.15,10), gold, .27*Math.sin(a), 2.02, .27*Math.cos(a)); g.add(sp);
      g.add(part(new THREE.SphereGeometry(.022,8,6), mat(i%2?"#D64545":"#3B7BD6"), .27*Math.sin(a), 2.11, .27*Math.cos(a)));
    }
    const velvet = part(new THREE.SphereGeometry(.25,18,10,0,Math.PI*2,0,Math.PI/2), mat("#8A1F3A"), 0,1.9,0);
    velvet.scale.y = .55; g.add(velvet);
  }
  if(kind==="wizard"){
    const pm = mat("#5B3FA8");
    g.add(part(new THREE.ConeGeometry(.37,.75,26), pm, 0,2.12,-.02));
    const brimMat = new THREE.MeshStandardMaterial({ color:"#5B3FA8", roughness:.8, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(.62,.62,.04,32), brimMat, 0,1.75,0));
    const band = new THREE.Mesh(new THREE.TorusGeometry(.375,.03,8,32), mat("#F2C12E"));
    band.rotation.x = Math.PI/2; band.position.set(0,1.79,0); g.add(band);
    for(const [x,y,z] of [[.0,2.0,.3],[.14,2.2,.2],[-.1,2.3,.12]])
      g.add(part(new THREE.SphereGeometry(.03,8,6), mat("#F2C12E"), x,y,z));
  }
  if(kind==="headphones"){
    const band = new THREE.Mesh(new THREE.TorusGeometry(.405,.024,8,32,Math.PI), mat("#26282C"));
    band.position.set(0,1.55,0); g.add(band);
    for(const s of [-1,1]){
      const cup = part(new THREE.CylinderGeometry(.11,.11,.09,20), mat("#FF3D9A"), s*.4,1.54,0);
      cup.rotation.z = Math.PI/2; g.add(cup);
      const pad = part(new THREE.CylinderGeometry(.1,.1,.03,20), mat("#26282C"), s*.36,1.54,0);
      pad.rotation.z = Math.PI/2; g.add(pad);
    }
  }
  if(kind==="cap"){
    // The dome sits just outside the head (radius .385 vs .36) and its front rim clears the eyes.
    const cm = mat("#D64545");
    const cg = new THREE.Group(); cg.position.set(0,1.644,0); cg.rotation.x = -.12;
    const dome = new THREE.Mesh(new THREE.SphereGeometry(.385,28,16,0,Math.PI*2,0,Math.PI*.5), cm);
    dome.scale.y = .9; cg.add(dome);
    const pivot = new THREE.Group(); pivot.position.set(0,0,.30); pivot.rotation.x = .2; // visor droops at the front
    pivot.add(part(new THREE.CylinderGeometry(.46,.46,.03,28,1,false,-Math.PI/2,Math.PI), cm, 0,0,-.30));
    cg.add(pivot);
    g.add(cg);
  }
  if(kind==="beanie"){
    const bg = new THREE.Group(); bg.position.set(0,1.6,0); bg.rotation.x = -.3;
    bg.add(new THREE.Mesh(new THREE.SphereGeometry(.41,28,16,0,Math.PI*2,0,Math.PI*.45), mat("#3B6FD6")));
    const cuff = new THREE.Mesh(new THREE.TorusGeometry(.405,.05,10,30), mat("#2B4F9E"));
    cuff.rotation.x = Math.PI/2; cuff.position.y = .064; bg.add(cuff);
    bg.add(part(new THREE.SphereGeometry(.09,14,12), mat("#FFFFFF"), 0,.43,0));
    g.add(bg);
  }
  if(kind==="bucket"){
    const m = mat("#8FA66B");
    g.add(part(new THREE.CylinderGeometry(.37,.405,.2,28), m, 0,1.78,0));
    const dome = part(new THREE.SphereGeometry(.37,24,10,0,Math.PI*2,0,Math.PI/2), m, 0,1.88,0);
    dome.scale.set(1,.5,1); g.add(dome);
    const brimMat = new THREE.MeshStandardMaterial({ color:"#8FA66B", roughness:.8, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(.42,.6,.06,28,1,true), brimMat, 0,1.7,0));
  }
  if(kind==="sun"){
    const straw = mat("#E3C27A");
    g.add(part(new THREE.CylinderGeometry(.36,.39,.17,28), straw, 0,1.77,0));
    const dome = part(new THREE.SphereGeometry(.36,24,10,0,Math.PI*2,0,Math.PI/2), straw, 0,1.855,0);
    dome.scale.set(1,.45,1); g.add(dome);
    const brimMat = new THREE.MeshStandardMaterial({ color:"#E3C27A", roughness:.9, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(.4,.82,.05,36,1,true), brimMat, 0,1.69,0));
    const ribbon = new THREE.Mesh(new THREE.TorusGeometry(.385,.02,8,32), mat("#D64545"));
    ribbon.rotation.x = Math.PI/2; ribbon.position.y = 1.72; g.add(ribbon);
  }
}

function buildHuman(look, gear){
  gear = Object.assign({}, DEFAULT_GEAR, gear || {});
  const g = new THREE.Group();
  const skin = mat(look.skin), hair = mat(look.hairColor), top = mat(look.shirt),
        bot = mat(look.pants), shoe = mat(look.shoes);
  const hsl = {}; new THREE.Color(look.shirt).getHSL(hsl);
  const pantsLight = {}; new THREE.Color(look.pants).getHSL(pantsLight);
  const darkPants = mat(new THREE.Color(look.pants).multiplyScalar(.78).getStyle());
  const darkShirt = mat(new THREE.Color(look.shirt).multiplyScalar(.8).getStyle());

  // Ground shadow
  const sh = new THREE.Mesh(new THREE.CircleGeometry(.55, 28),
    new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:.14 }));
  sh.rotation.x = -Math.PI/2; sh.position.y = .005; g.add(sh);

  // Legs and shoes
  for(const s of [-1,1]){
    const leg = new THREE.Group(); leg.position.set(s*.13, .62, 0);
    if(gear.pants==="shorts"){
      leg.add(part(new THREE.CylinderGeometry(.095,.09,.5,14), skin, 0,-.25,0));
      leg.add(part(new THREE.CylinderGeometry(.126,.12,.27,14), bot, 0,-.135,0));
    } else {
      leg.add(part(new THREE.CylinderGeometry(.118,.108,.5,14), bot, 0,-.25,0));
    }
    if(gear.pants==="track"){
      const st = part(new THREE.BoxGeometry(.014,.5,.06), mat(pantsLight.l>.55 ? "#26282C" : "#FFFFFF"), s*.112,-.25,0);
      leg.add(st);
    }
    if(gear.pants==="cargo"){
      const pocket = part(new THREE.BoxGeometry(.09,.15,.03), darkPants, s*.093,-.17,.091);
      pocket.rotation.y = s*.8; leg.add(pocket);
      leg.add(part(new THREE.CylinderGeometry(.112,.112,.05,14), darkPants, 0,-.465,0));
    }
    const foot = part(new THREE.SphereGeometry(.12,16,12), shoe, 0,-.53,.05);
    foot.scale.set(1,.65,1.6); leg.add(foot);
    g.add(leg);
  }

  // Hips and torso (shirt styles change the torso, sleeves and extras)
  g.add(part(new THREE.CylinderGeometry(.27,.27,.22,22), bot, 0,.61,0)); // stays inside the shirt above the hem
  const hood = gear.shirt==="hoodie", longSleeve = gear.shirt==="long" || hood;
  const k = hood ? 1.07 : 1;
  const rAt = y => (.29 - (y-.59)*(.04/.62)) * k;
  g.add(part(new THREE.CylinderGeometry(.25*k,.29*k,.62,22), top, 0,.9,0));
  if(gear.shirt==="striped"){
    const stripe = mat(hsl.l > .6 ? "#26365A" : "#FFFFFF");
    for(const y of [.68,.82,.96,1.1]){
      g.add(part(new THREE.CylinderGeometry(rAt(y+.03)+.004, rAt(y-.03)+.004, .06, 22), stripe, 0,y,0));
    }
  }
  if(gear.shirt==="vest"){
    const vm = new THREE.MeshStandardMaterial({ color:"#B8A06A", roughness:.85, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(rAt(1.17)+.016, rAt(.62)+.016, .56, 24, 1, true, .3, Math.PI*2-.6), vm, 0,.895,0));
    const pk = mat("#8F7A48");
    for(const s of [-1,1]) g.add(part(new THREE.BoxGeometry(.1,.1,.03), pk, s*.14,.78,rAt(.78)+.03));
  }
  if(gear.shirt==="cape"){
    const cp = new THREE.MeshStandardMaterial({ color:"#C0392B", roughness:.7, side:THREE.DoubleSide });
    g.add(part(new THREE.CylinderGeometry(.31,.42,.82,20,1,true,Math.PI-1.05,2.1), cp, 0,.82,0));
    const cl = part(new THREE.TorusGeometry(.15,.04,8,20), cp, 0,1.215,.02); cl.rotation.x = Math.PI/2; g.add(cl);
    g.add(part(new THREE.SphereGeometry(.036,10,8), mat("#F2C12E"), 0,1.19,.262));
  }
  if(hood){
    const collar = part(new THREE.TorusGeometry(.15,.05,8,20), top, 0,1.215,.02);
    collar.rotation.x = Math.PI/2; g.add(collar);
    const hd = part(new THREE.SphereGeometry(.19,16,12), top, 0,1.2,-.2);
    hd.scale.set(1.25,.95,.7); g.add(hd);
    for(const s of [-1,1]) g.add(part(new THREE.CylinderGeometry(.009,.009,.16,6), mat("#FFFFFF"), s*.05,1.1,rAt(1.1)+.008));
    g.add(part(new THREE.BoxGeometry(.3,.13,.03), darkShirt, 0,.74,rAt(.74)+.012));
  }
  if(gear.pants==="overalls"){
    g.add(part(new THREE.BoxGeometry(.34,.3,.04), bot, 0,.96,rAt(.96)+.012));
    const btn = mat("#F2C12E");
    for(const s of [-1,1]){
      g.add(part(new THREE.BoxGeometry(.06,.22,.03), bot, s*.13,1.12,rAt(1.12)+.01));
      g.add(part(new THREE.BoxGeometry(.06,.22,.03), bot, s*.13,1.0,-(rAt(1.0)+.01)));
      g.add(part(new THREE.BoxGeometry(.06,.03,.5), bot, s*.13,1.225,0));
      g.add(part(new THREE.SphereGeometry(.024,10,8), btn, s*.13,1.09,rAt(1.09)+.03));
    }
  }

  // Neck
  g.add(part(new THREE.CylinderGeometry(.1,.11,.16,14), skin, 0,1.25,0));

  // Arms
  const sleeveL = longSleeve ? .46 : .2, sleeveR = hood ? 1.1 : 1;
  for(const s of [-1,1]){
    g.add(part(new THREE.SphereGeometry(.105*k,14,12), top, s*.3*k,1.12,0));
    const arm = new THREE.Group(); arm.position.set(s*.32*k,1.13,0); arm.rotation.z = s*.12;
    arm.add(part(new THREE.CylinderGeometry(.07,.065,.5,12), skin, 0,-.28,0));
    arm.add(part(new THREE.CylinderGeometry(.088*sleeveR,.082*sleeveR,sleeveL,12), top, 0,-sleeveL/2,0));
    arm.add(part(new THREE.SphereGeometry(.08,14,12), skin, 0,-.55,0));
    g.add(arm);
  }

  // Head, ears, nose, cheeks, smile
  const head = part(new THREE.SphereGeometry(.36,32,24), skin, 0,1.55,0);
  head.scale.set(1,1.04,1); g.add(head);
  const blush = new THREE.Color(look.skin).lerp(new THREE.Color("#D9534F"), .35);
  for(const s of [-1,1]){
    const ear = part(new THREE.SphereGeometry(.07,12,10), skin, s*.36,1.54,0);
    ear.scale.set(.5,1,.8); g.add(ear);
    const ch = part(new THREE.SphereGeometry(.055,10,8), mat(blush), s*.2,1.48,.285);
    ch.scale.set(1,.7,.35); g.add(ch);
  }
  const nose = part(new THREE.SphereGeometry(.045,10,8), skin, 0,1.52,.35);
  nose.scale.set(1,.9,.9); g.add(nose);
  const smile = new THREE.Mesh(new THREE.TorusGeometry(.06,.013,8,20,Math.PI), mat("#5A2A25"));
  smile.rotation.z = Math.PI; smile.position.set(0,1.48,.35); g.add(smile);

  addEyes(g, look);
  addGlasses(g, gear.glasses);

  // Hair (the top of the hair is hidden under hats)
  const hatOn = gear.hat !== "none";
  const t = look.hairType;
  if(t!=="bald"){
    const hg = new THREE.Group(); hg.position.set(0,1.56,-.01); hg.rotation.x = -.45;
    const buzz = t==="buzz";
    hg.add(new THREE.Mesh(
      new THREE.SphereGeometry(buzz?.372:.385,28,16,0,Math.PI*2,0,Math.PI*(buzz?.44:.5)), hair));
    if(t==="short" && !hatOn){
      const f = part(new THREE.SphereGeometry(.15,16,12), hair, .05,1.69,.26);
      f.scale.set(1.5,.45,.8); f.rotation.z = .1; g.add(f);
    }
    if(t==="curly"){
      for(const [pol, n] of [[.25,1],[.7,6],[1.1,9],[1.3,10]]){
        if(hatOn && pol<1.2) continue;
        for(let i=0;i<n;i++){
          const az = n===1 ? 0 : (i/n)*Math.PI*2 + pol;
          const x = .37*Math.sin(pol)*Math.sin(az), y = .37*Math.cos(pol), z = .37*Math.sin(pol)*Math.cos(az);
          if(pol>.9 && z>.08) continue; // keep the face clear
          hg.add(part(new THREE.SphereGeometry(.13,12,10), hair, x,y,z));
        }
      }
    }
    if(t==="bun" && !hatOn) hg.add(part(new THREE.SphereGeometry(.15,16,12), hair, 0,.4,-.14));
    g.add(hg);
    if(t==="long"){
      const back = part(new THREE.SphereGeometry(.38,20,16), hair, 0,1.25,-.2);
      back.scale.set(1,1.6,.55); g.add(back);
    }
    if(t==="ponytail"){
      const tail = part(new THREE.SphereGeometry(.11,14,12), hair, 0,1.4,-.47);
      tail.scale.set(1,2.6,1); tail.rotation.x = -.25; g.add(tail);
      const band = new THREE.Mesh(new THREE.TorusGeometry(.075,.025,8,16), mat("#E86AA6"));
      band.position.set(0,1.62,-.4); band.rotation.x = Math.PI/2 - .5; g.add(band);
    }
  }
  addHat(g, gear.hat);
  return g;
}

/* Rotation: drag the full view to turn the avatar; it sways gently when left alone */
let userYaw = .3, swayAmp = 1, lastInteract = -1e9, drag = null;
function draw(t){
  if(!HAS3D || !avatarGroup) return;
  const views = document.querySelectorAll("canvas[data-avatar]");
  if(!views.length) return;
  const idle = !drag && t - lastInteract > 2000;
  swayAmp += ((idle?1:0) - swayAmp) * .06;
  views.forEach(cv=>{
    const headShot = cv.dataset.mode==="head";
    avatarGroup.rotation.y = headShot
      ? (REDUCED ? .2 : Math.sin(t/900)*.35)
      : userYaw + (REDUCED ? 0 : Math.sin(t/1400)*.5*swayAmp);
    avatarGroup.position.y = REDUCED ? 0 : Math.sin(t/450)*.012;
    R.render(scene, headShot ? camHead : camFull);
    const ctx = cv.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(R.domElement,0,0,cv.width,cv.height);
  });
}

function weekKey(){

function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function pick(pool,key,n){
  const r = rng(hash(key)), a = pool.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,n);
}

/* ---------- Actions ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}
function seasonQuestIds(){ return SEASON.quests.filter(q=>q.auto!=="season").map(q=>q.id); }
function seasonDoneCount(){ return seasonQuestIds().filter(id=>state.season.claimed.includes(id)).length; }
// Finishing every season quest earns the season's champion title (kept for good once earned).
function checkSeasonComplete(quiet){
  const key = "title:"+SEASON.titleId;
  if(seasonDoneCount() === seasonQuestIds().length && !state.owned.includes(key)){
    state.owned.push(key);
    if(!quiet) toast(`${SEASON.name} complete! New title unlocked.`);
  }
}
function bumpSeason(id, delta){
  const q = SEASON.quests.find(x=>x.id===id); if(!q || q.auto==="season") return;
  const s = state.season;
  s.counts[id] = Math.max(0, Math.min(q.target, (s.counts[id]||0) + delta));
  const claimed = s.claimed.includes(id);
  if(s.counts[id] >= q.target && !claimed){
    const amt = payFor(q.pts);
    state.paid["season:"+id] = amt; addPoints(amt);
    toast(`Season quest done! +${amt}`);
    checkSeasonComplete();
  } else if(s.counts[id] < q.target && claimed){
    s.claimed = s.claimed.filter(x=>x!==id);
    addPoints(-(state.paid["season:"+id] ?? q.pts)); delete state.paid["season:"+id];
  }
}
// Points from quests also count toward challenges (earnedTotal never goes down when you spend points).
function addPoints(n){
  state.points = Math.max(0, state.points + n);
  state.earnedTotal = (state.earnedTotal||0) + n;
}
function qInfo(kind, id){
  return kind==="season" ? SEASON.quests.find(q=>q.id===id) : (kind==="daily"?DAILY_POOL:WEEKLY_POOL).find(q=>q.id===id);
}
const bucketKey = kind => kind==="daily" ? state.daily.key : kind==="weekly" ? state.weekly.key : SEASON.id;
// The running quest, or null. A quest from an earlier day, week or season is dropped.
function runningQuest(){
  const a = state.active;
  if(a && a.key !== bucketKey(a.kind)){ state.active = null; return null; }
  return a || null;
}
function activeFor(kind, id){ const a = runningQuest(); return a && a.kind===kind && a.id===id ? a : null; }
function leftMs(a){
  const now = Date.now();
  if(a.start > now){ a.start = now; save(); } // clock set backwards: the timer restarts instead of finishing early
  return Math.max(0, a.start + a.mins*60000 - now);
}
function fmtLeft(ms){
  const t = Math.ceil(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), sec = t%60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
function startQuest(kind, id){
  const q = qInfo(kind, id); if(!q) return;
  const cur = runningQuest();
  if(cur){ const cq = qInfo(cur.kind, cur.id); toast(`Finish or cancel "${cq?cq.title:"your quest"}" first.`); return; }
  if(kind==="season" && ONCE_A_DAY.has(id) && (state.season.last||{})[id]===dayKey()){ toast("Nice! Come back tomorrow for the next one."); return; }
  state.active = { kind, id, key:bucketKey(kind), start:Date.now(), mins:minsFor(id) };
  save(); render();
}
function cancelQuest(){ state.active = null; save(); render(); }
// Returns true when the timer for this quest is up; otherwise says why not.
function timerDone(kind, id){
  const a = activeFor(kind, id);
  if(!a){ toast("Tap Start first."); return false; }
  if(leftMs(a) > 0){ toast("Keep going! The timer isn't done yet."); return false; }
  return true;
}
function questButton(kind, id, done, logAct){
  const act = logAct ? "log" : "toggle";
  if(done) return logAct
    ? `<button class="btn" disabled>Done</button>`
    : `<button class="btn" data-act="toggle" data-kind="${kind}" data-id="${id}" aria-pressed="true">Done</button>`;
  const a = activeFor(kind, id);
  if(!a) return `<button class="btn" data-act="start" data-kind="${kind}" data-id="${id}">Start</button>`;
  const l = leftMs(a);
  if(l > 0) return `<button class="btn timer" disabled data-countdown="${kind}:${id}" aria-label="Time left">${fmtLeft(l)}</button>`;
  return `<button class="btn solid" data-act="${act}" data-kind="${kind}" data-id="${id}">Complete</button>`;
}
function questMeta(kind, q){
  const a = activeFor(kind, q.id);
  return `<span>${minsFor(q.id)>=60 ? minsFor(q.id)/60+" hr" : minsFor(q.id)+" min"}</span>` +
    (a ? `<button class="linkbtn" data-act="cancel">Cancel</button>` : "");
}
function toggle(kind, id){
  const pool = kind==="daily" ? DAILY_POOL : WEEKLY_POOL;
  const q = pool.find(x=>x.id===id); if(!q) return;
  const bucket = state[kind];
  if(bucket.done.includes(id)){
    // Undoing takes the points back, so it isn't allowed once they've been spent in the Locker.
    const pk = payKey(kind, id), paid = state.paid[pk] ?? q.pts;
    let back = paid;
    const s6 = SEASON.quests.find(x=>x.id==="s6");
    if(kind==="daily" && state.season.claimed.includes("s6") && (state.season.counts.s6||0) >= s6.target) back += state.paid["season:s6"] ?? s6.pts;
    if(state.points < back){ toast("Those points are already spent."); return; }
    bucket.done = bucket.done.filter(x=>x!==id);
    addPoints(-paid); delete state.paid[pk];
    if(kind==="daily") bumpSeason("s6",-1);
  } else {
    if(!timerDone(kind, id)) return;
    state.active = null;
    bucket.done.push(id);
    const amt = payFor(q.pts);
    state.paid[payKey(kind, id)] = amt;
    addPoints(amt);
    toast(amt > q.pts ? `+${amt} points (${eventMult()}x bonus!)` : `+${amt} points`);
    if(kind==="daily") bumpSeason("s6",1);
  }
  save(); render();
}

let inLocker = false, lockCat = "titles", pendingBuy = null;
const THUMB_CAM = { glasses:"head", shirts:"torso", pants:"legs", hats:"bust", borders:"head" };
const THUMB_CAM_ITEM = { wizard:"tall" };

function equip(slot, id){
  if(slot==="title") state.title = id;
  else state.gear = Object.assign(getGear(), { [slot]: id });
}
const equippedId = slot => slot==="title" ? state.title : getGear()[slot];

function itemAction(catKey, id){
  const cat = catByKey(catKey), item = findItem(catKey, id); if(!item) return;
  const key = cat.slot+":"+id, cost = item[2];
  if(isOwned(cat.slot, id)){ equip(cat.slot, id); pendingBuy = null; }
  else if(cost < 0){ toast(`Finish every ${SEASON.name} quest to earn this.`); return; }
  else if(state.points < cost){ toast(`You need ${cost - state.points} more points.`); return; }
  else if(pendingBuy !== key){ pendingBuy = key; render(); return; } // first tap asks to confirm
  else {
    state.points -= cost; state.owned.push(key); equip(cat.slot, id); pendingBuy = null;
    toast(`Unlocked ${itemName(catKey, id)}`);
  }
  save(); setAvatar(); render();
}

function thumbHtml(cat, id, owner){
  if(cat.key==="titles") return "";
  const cv = HAS3D
    ? `<canvas data-thumb${owner ? ` data-owner="${owner}"` : ""} data-slot="${cat.slot}" data-id="${id}" data-cam="${THUMB_CAM_ITEM[id] || THUMB_CAM[cat.key]}" width="200" height="200" aria-hidden="true"></canvas>`
    : "";
  if(cat.key==="borders") return `<div class="me ring-sample" style="background:${ringBg(id)}"><span class="me-in">${cv}</span></div>`;
  return HAS3D ? `<div class="thumb">${cv}</div>` : `<div class="thumb thumb-fallback">${esc(itemName(cat.key,id))}</div>`;
}

function itemCard(cat, it){
  const id = it[0], cost = it[2], slot = cat.slot;
  const owned = isOwned(slot, id), equipped = equippedId(slot) === id;
  const pending = pendingBuy === slot+":"+id;
  let label, cls = "btn", dis = "";
  if(equipped){ label = "Equipped"; cls += " solid"; dis = " disabled"; }
  else if(owned){ label = "Equip"; }
  else if(cost < 0){ label = "Locked"; dis = " disabled"; }
  else if(state.points < cost){ label = `${cost} pts`; dis = " disabled"; }
  else if(pending){ label = `Spend ${cost} pts?`; cls += " solid"; }
  else { label = `Unlock · ${cost} pts`; }
  const meta = owned ? (cost===0 ? "Free" : cost<0 ? "Earned" : "Unlocked")
    : cost<0 ? `Finish every ${SEASON.name} quest`
    : (state.points<cost ? `Need ${cost-state.points} more points` : `${cost} points`);
  const name = (cat.key==="titles" ? titleHtml(id) : esc(itemName(cat.key, id))) + (it[3] ? `<span class="tag">Special</span>` : "");
  const btn = `<button class="${cls}" data-act="item" data-cat="${cat.key}" data-id="${id}"${dis}>${label}</button>`;
  if(cat.key==="titles"){
    return `<li class="item row ${equipped?"equipped":""}"><div><span class="item-name">${name}</span><span class="item-meta">${meta}</span></div>${btn}</li>`;
  }
  return `<li class="item ${equipped?"equipped":""}">${thumbHtml(cat,id)}<div><span class="item-name">${name}</span><span class="item-meta">${meta}</span></div>${btn}</li>`;
}

function renderThumbs(){
  if(!HAS3D || !avatarGroup) return;
  avatarGroup.visible = false;
  document.querySelectorAll("canvas[data-thumb]").forEach(cv=>{
    const owner = cv.dataset.owner ? samplePlayer(cv.dataset.owner) : null; // a friend's Locker draws on the friend's avatar

    R.render(scene, cams[cv.dataset.cam] || camFull);

/* ---------- Challenges ---------- */
/* Most points earned before the end date wins. 1st gets the reward, 2nd half, 3rd a third, nobody else.
   Earning 0 points means no reward. Ties share a place. Test players earn points on a simple timer until real accounts exist. */
const MAX_DAYS = 30;
let draft = null, viewChallenge = null;
function endTs(ch){ const [y,m,d] = ch.end.split("-").map(Number); return new Date(y,m-1,d,23,59,59).getTime(); }
function prizeFor(place, reward){ return place===1 ? reward : place===2 ? Math.floor(reward/2) : place===3 ? Math.floor(reward/3) : 0; }
function ordinal(n){ return n===1 ? "1st" : n===2 ? "2nd" : n===3 ? "3rd" : n+"th"; }
function theirScore(code, ch, at){
  const days = Math.max(0, (Math.min(at, endTs(ch)) - ch.created) / 864e5);
  return Math.floor(days * (15 + hash(code) % 35));
}
function standings(ch, at){
  if(ch.done && ch.results) return ch.results;
  at = at || Date.now();
  const rows = [{ code:"me", name:"You", score:Math.max(0, state.earnedTotal - ch.startTotal) }]
    .concat(ch.players.map(p=>({ code:p.code, name:p.name, score:theirScore(p.code, ch, at) })));
  rows.sort((a,b)=>b.score - a.score);
  rows.forEach((r,i)=>{
    r.place = i>0 && r.score===rows[i-1].score ? rows[i-1].place : i+1;
    r.prize = r.score>0 ? prizeFor(r.place, ch.reward) : 0;
  });
  return rows;
}
// Settles any challenge whose end date has passed. Returns true if one finished.
function finishChallenges(){
  const now = Date.now(); let msg = null;
  (state.challenges||[]).forEach(ch=>{
    if(ch.done || now <= endTs(ch)) return;
    const rows = standings(ch, endTs(ch));
    const me = rows.find(r=>r.code==="me");
    ch.results = rows; ch.done = true;
    if(me.prize > 0) state.points += me.prize; // prizes are not "earned" points, so they can't feed later challenges
    msg = me.prize>0 ? `Challenge over! You placed ${ordinal(me.place)}: +${me.prize} points` : "Challenge over. No reward this time.";
  });
  if(msg){ save(); toast(msg); return true; }
  return false;
}
const fmtDay = str => { const [y,m,d] = str.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
const prizeLine = r => `1st ${prizeFor(1,r)} · 2nd ${prizeFor(2,r)} · 3rd ${prizeFor(3,r)}`;

function challengeRow(ch){
  const rows = standings(ch), me = rows.find(r=>r.code==="me");
  const names = ch.players.map(p=>esc(p.name)).join(", ");
  const sub = ch.done
    ? `Finished · you placed ${ordinal(me.place)}${me.prize ? ` · +${me.prize} pts` : ""}`
    : `Ends ${fmtDay(ch.end)} · you're ${ordinal(me.place)} with ${me.score} pts`;
  return `<li><button class="fbtn" data-act="view-challenge" data-id="${ch.id}">
    <span class="f-txt"><b>vs ${names}</b><span>${sub}</span></span>
    <span class="chev" aria-hidden="true" style="font-size:24px">›</span></button></li>`;
}

function startChallenge(){
  const err = document.getElementById("cErr");
  const fail = m => { err.textContent = m; return false; };
  const picks = [...document.querySelectorAll('input[name="pl"]:checked')].map(i=>i.value);
  if(!picks.length) return fail("Pick at least one friend.");
  const end = document.getElementById("cEnd").value;
  const lo = dayKey(new Date(Date.now()+864e5)), hi = dayKey(new Date(Date.now()+MAX_DAYS*864e5));
  if(!/^\d{4}-\d{2}-\d{2}$/.test(end)) return fail("Pick an end date.");
  if(end < lo) return fail("The end date has to be tomorrow or later.");
  if(end > hi) return fail(`Challenges can last up to ${MAX_DAYS} days.`);
  const reward = Math.max(0, Math.min(500, Math.round((+document.getElementById("rwd").value||0)/10)*10));
  const ch = { id:"c"+Date.now(), created:Date.now(), end, reward, startTotal:state.earnedTotal,
    players: picks.map(c=>{ const p = samplePlayer(c); return { code:c, name:p?p.name:c }; }), done:false };
  state.challenges.unshift(ch); save();
  viewChallenge = ch.id; friendsPage = "challenge"; render(); window.scrollTo(0,0);
  toast("Challenge started!");
  return true;
}

async function adminSignIn(email, pw){
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, { method:"POST",
    headers:{ apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" }, body:JSON.stringify({ email, password:pw }) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || "Sign-in failed.");
  const a = await fetch(`${SUPABASE_URL}/rest/v1/admins?select=user_id`, { headers:sbHeaders(j.access_token) });
  const rows = await a.json().catch(()=>[]);
  adminSession = { token:j.access_token, email, isAdmin:Array.isArray(rows) && rows.length>0 };
  saveAdminSession();
}
async function saveEvent(mult, untilIso, banner){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1`, { method:"PATCH",
    headers:Object.assign(sbHeaders(adminSession.token), { Prefer:"return=representation" }),
    body:JSON.stringify({ points_multiplier:mult, until:untilIso, banner, updated_at:new Date().toISOString() }) });
  const rows = await r.json().catch(()=>[]);
  if(r.status===401){ adminSession = null; saveAdminSession(); throw new Error("Your sign-in expired. Sign in again."); }
  if(!r.ok || !Array.isArray(rows) || !rows.length) throw new Error("Not allowed. Is this account an admin?");
  await loadEvent();
}

  <section class="panel" role="tabpanel">${panels[tab]()}</section>
  <p class="note">Tap Start, go do the quest, and Complete unlocks when the timer ends. One quest at a time. Spend your points in the Locker or the Shop.</p>
  ${ONLINE ? `<p class="acct-line">${cloud.session ? `☁ Saved online · ` : ""}<button class="linkbtn" data-act="open-account">${cloud.session ? "Account" : "Save your progress online"}</button></p>` : ""}`;
}

function render(){
  const welcome = !state.username;
  document.getElementById("app").innerHTML =
    welcome ? welcomeView() : editing ? editorView() : inAccount ? accountView() : inAdmin ? adminView() : inLocker ? lockerView() : inShop ? shopView()
    : friendsPage==="requests" ? requestsView() : friendsPage==="profile" ? profileView()
    : friendsPage==="friend-locker" ? friendLockerView() : friendsPage==="new-challenge" ? newChallengeView() : friendsPage==="challenge" ? challengeView()
    : friendsPage ? friendsView() : mainView();
  if(!welcome && !editing && friendsPage) renderFriendAvatars();
  if(!welcome && editing) updateEditorUI();
  if(welcome){ const i = document.getElementById("uname"); if(i) i.focus(); }
  if(!welcome && !editing && (inLocker || inShop || friendsPage==="friend-locker")) renderThumbs();
  draw(performance.now());
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  if(e.target.closest("p.note") && !inLocker && !inShop && !friendsPage && !editing){ // 5 quick taps on the footer note opens Admin
    const now = Date.now(); noteTaps = noteTaps.filter(t=>now-t<3000).concat(now);
    if(noteTaps.length>=5){ noteTaps=[]; inAdmin=true; render(); window.scrollTo(0,0); }
    return;
  }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act==="set"){ setLookValue(el.dataset.key, el.dataset.val); }
  else if(act==="random"){ randomLook(); }
  else if(act==="open-locker"){ inLocker=true; pendingBuy=null; render(); window.scrollTo(0,0); }
  else if(act==="close-locker"){ inLocker=false; pendingBuy=null; render(); window.scrollTo(0,0); }
  else if(act==="open-account"){ inAccount=true; render(); window.scrollTo(0,0); }
  else if(act==="close-account"){ inAccount=false; render(); window.scrollTo(0,0); }
  else if(act==="sign-in"){ signInWith(el.dataset.provider); }
  else if(act==="sign-out"){ signOut(); render(); }
  else if(act==="save-now"){ cloud.status = "Saving..."; render(); pushCloud(); }
  else if(act==="use-cloud"){ adoptCloud(cloud.conflict.row); }
  else if(act==="use-local"){ cloud.conflict = null; state.syncedAt = null; pushCloud().then(()=>render()); }
  else if(act==="close-admin"){ inAdmin=false; render(); window.scrollTo(0,0); }
  else if(act==="admin-out"){ adminSession=null; saveAdminSession(); render(); }
  else if(act==="ev-start" || act==="ev-stop"){
    const err = document.getElementById("aErr"); err.textContent = "";
    const stop = act==="ev-stop";
    const days = +document.getElementById("evLen").value;
    const until = stop || !days ? null : new Date(Date.now()+days*864e5).toISOString();
    el.disabled = true;
    saveEvent(stop ? 1 : +document.getElementById("evMult").value, until, stop ? "" : document.getElementById("evBanner").value.trim())
      .then(()=>{ render(); toast(stop ? "Event turned off" : "Event is live for everyone"); })
      .catch(e=>{ el.disabled=false; const x=document.getElementById("aErr"); if(x) x.textContent=e.message; if(!adminSession) render(); });
  }
  else if(act==="open-shop"){ inShop=true; pendingBuy=null; render(); window.scrollTo(0,0); }
  else if(act==="close-shop"){ inShop=false; pendingBuy=null; render(); window.scrollTo(0,0); }
  else if(act==="open-friends"){ friendsPage="list"; render(); window.scrollTo(0,0); }
  else if(act==="close-friends"){ friendsPage=null; render(); window.scrollTo(0,0); }
  else if(act==="friends-page"){ friendsPage = el.dataset.page || "list"; pendingRemove=false; render(); window.scrollTo(0,0); }
  else if(act==="view-friend"){ viewCode = el.dataset.code; pendingRemove=false; friendsPage="profile"; render(); window.scrollTo(0,0); }
  else if(act==="copy-code"){
    try { navigator.clipboard.writeText(state.friendCode).then(()=>toast("Code copied"), ()=>toast("Copy it by hand: "+state.friendCode)); }
    catch(_){ toast("Copy it by hand: "+state.friendCode); }
  }
  else if(act==="accept"){
    const c = el.dataset.code, p = samplePlayer(c);
    state.requests = state.requests.filter(x=>x!==c);
    if(!state.friends.includes(c)) state.friends.push(c);
    save(); render(); if(p) toast(`${p.name} is now your friend`);
  }
  else if(act==="test-request"){
    const next = SAMPLE_PLAYERS.find(p=>p.code!=="TEST-FRND" && !state.friends.includes(p.code) && !state.requests.includes(p.code));
    if(!next){ toast("No more test players left."); return; }
    state.requests.push(next.code); save(); render(); toast(`${next.name} sent you a request`);
  }
  else if(act==="friend-locker"){ viewCode = el.dataset.code; fLockCat = "titles"; friendsPage = "friend-locker"; render(); window.scrollTo(0,0); }
  else if(act==="fcat"){ fLockCat = el.dataset.cat; render(); }
  else if(act==="new-challenge"){ draft = { code: el.dataset.code }; friendsPage = "new-challenge"; render(); window.scrollTo(0,0); }
  else if(act==="view-challenge"){ viewChallenge = el.dataset.id; friendsPage = "challenge"; render(); window.scrollTo(0,0); }
  else if(act==="test-end"){
    const ch = state.challenges.find(c=>c.id===el.dataset.id);
    if(ch){ ch.end = dayKey(new Date(Date.now()-864e5)); finishChallenges(); render(); }
  }
  else if(act==="decline"){ state.requests = state.requests.filter(x=>x!==el.dataset.code); save(); render(); }
  else if(act==="remove-friend"){
    if(!pendingRemove){ pendingRemove=true; render(); return; }
    state.friends = state.friends.filter(x=>x!==el.dataset.code);
    pendingRemove=false; friendsPage="list"; save(); render(); window.scrollTo(0,0);
  }
  else if(act==="cat"){ lockCat = el.dataset.cat; pendingBuy=null; render(); }
  else if(act==="item"){ itemAction(el.dataset.cat, el.dataset.id); }
  else if(act==="done"){
    if(!applyName()) return;
    state.look = getLook(); save(); editing=false; render(); window.scrollTo(0,0);
  }
  else if(act==="open-editor"){ editing=true; render(); window.scrollTo(0,0); }
  else if(act==="tab"){ tab = el.dataset.tab; render(); }
  else if(act==="toggle"){ toggle(el.dataset.kind, el.dataset.id); }
  else if(act==="start"){ startQuest(el.dataset.kind, el.dataset.id); }
  else if(act==="cancel"){ cancelQuest(); }
  else if(act==="log"){
    const id = el.dataset.id;
    if(!timerDone("season", id)) return;
    state.active = null;
    state.season.last = Object.assign(state.season.last||{}, { [id]: dayKey() });
    bumpSeason(id, 1); save(); render();
  }
});
document.addEventListener("submit", e=>{
  if(e.target.id === "adminLogin"){
    e.preventDefault();
    const err = document.getElementById("aErr"); err.textContent = "";
    adminSignIn(document.getElementById("aEmail").value.trim(), document.getElementById("aPass").value)
      .then(()=>render()).catch(x=>{ err.textContent = x.message; });
    return;
  }
  if(e.target.id === "challengeForm"){ e.preventDefault(); startChallenge(); return; }
  if(e.target.id === "addForm"){ e.preventDefault(); addFriendByCode(document.getElementById("fcode").value); return; }
  if(e.target.id !== "nameForm") return;
  e.preventDefault();
  if(applyName()) render();
});
document.addEventListener("input", e=>{
  if(e.target.id === "rwd"){
    const v = +e.target.value;
    document.getElementById("rwdVal").textContent = v;
    document.getElementById("prizes").textContent = prizeLine(v);
    return;
  }
  if(e.target.id === "uname"){
    e.target.removeAttribute("aria-invalid");
    const err = document.getElementById("unameErr"); if(err) err.textContent = "";
    return;
  }
  const el = e.target.closest("input[data-key]");
  if(el) setLookValue(el.dataset.key, el.value);
});
document.addEventListener("pointerdown", e=>{
  const cv = e.target.closest('canvas[data-mode="full"]'); if(!cv) return;
  drag = { x:e.clientX }; lastInteract = performance.now();
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener("pointermove", e=>{
  if(!drag) return;
  userYaw += (e.clientX - drag.x) * .012; drag.x = e.clientX;
  lastInteract = performance.now();
  if(REDUCED) draw(lastInteract);
});
const endDrag = ()=>{ drag = null; lastInteract = performance.now(); };
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ ensureFresh(); finishChallenges(); render(); refreshEvent(); if(cloud.session && !cloud.conflict) syncCloud(); } });

// Re-draw after the shared settings load, unless someone is typing
function refreshEvent(){
  const sig = () => JSON.stringify([eventMult(), eventSettings.banner, eventSettings.until]);
  const before = sig();
  loadEvent().then(ok=>{
    const a = document.activeElement;
    if(ok && sig() !== before && !(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) render();
  });
}
setInterval(()=>{ if(!document.hidden && ONLINE) refreshEvent(); }, 300000);
handleOAuthReturn().then(()=>{ if(cloud.session) syncCloud().then(()=>render()); else render(); });
setInterval(()=>{ if(!document.hidden && cloud.session && !cloud.conflict) syncCloud(); }, 120000);
refreshEvent();
finishChallenges();
render();
if(HAS3D && !REDUCED) requestAnimationFrame(loop);
</script>
</body>
</html>
